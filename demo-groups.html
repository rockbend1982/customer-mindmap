/* ---------- 客戶詳情 ---------- */
function relationLabel(r, viewpointId){
  const t = relType(r.type);
  const otherId = r.from === viewpointId ? r.to : r.from;
  const other = getCustomer(otherId);
  const otherName = other ? other.name : "（已刪除）";
  let text;
  if (t.key === "upline"){
    text = r.from === viewpointId ? `下線：${otherName}` : `上線：${otherName}`;
  } else if (t.directed){
    text = r.from === viewpointId ? `介紹了 ${otherName}` : `${otherName} 介紹（引路人）`;
    if (t.key !== "intro") text = r.from === viewpointId ? `${t.label} → ${otherName}` : `${otherName} → ${t.label}`;
  } else {
    text = `${t.label}：${otherName}`;
  }
  return {text, otherId, color:t.color};
}
function openDetail(id){
  const c = getCustomer(id);
  if (!c) return;
  const rels = relationsOf(id);
  const logs = interactionsOf(id);
  const buys = purchasesOf(id);
  const trials = trialsOf(id);
  const spent = spentOf(id);
  const fields = [
    ["電話", esc(c.phone)],
    ["LINE", esc(c.lineId)],
    ["生日", c.birthday ? esc(c.birthday) + (birthdayInDays(c, 30) !== null ? `　<b>${birthdayInDays(c, 30) === 0 ? "就是今天" : birthdayInDays(c, 30) + " 天後"}</b>` : "") : ""],
    ["公司／職業", esc(c.company)],
    ["怎麼認識的", esc(c.source)],
  ].filter(f => f[1]);

  const ts = tasksOf(id);
  const up = uplineOf(id), downs = downlinesOf(id), orgSz = orgSize(id);
  const hasOrg = !!(up || downs.length || isPartner(c));
  // 同一張單（orderId）的多個品項歸在一起；舊資料沒有 orderId，各自成一單
  const groupOrders = rows => {
    const out = [], by = {};
    rows.forEach(x => {
      const k = x.orderId || ("_solo_" + x.id);
      if (!by[k]){ by[k] = {key:k, date:x.date, note:x.note, reaction:x.reaction, items:[]}; out.push(by[k]); }
      by[k].items.push(x);
    });
    return out;
  };
  const orders = groupOrders(buys), trialGroups = groupOrders(trials);
  const orderHTML = (o, trial) => {
    const sum = o.items.reduce((t, x) => t + (Number(x.amount) || 0), 0);
    const sumSv = o.items.reduce((t, x) => t + (Number(x.sv) || 0), 0);
    // .txt 是 white-space:pre-wrap，模板裡的換行縮排會原樣渲染成一大片空白，
    // 所以內容先拼成單一字串再塞進去
    const lines = o.items.map(x =>
      `<div><b>${esc(x.item)}</b>${(x.qty && x.qty > 1) ? ` ×${x.qty}` : ""}${
        !trial && Number(x.amount) ? "　" + money(Number(x.amount)) : ""}${
        !trial && Number(x.sv) ? "　SV " + Math.round(x.sv) : ""}</div>`).join("")
      + ((!trial && o.items.length > 1) ? `<div class="muted" style="margin-top:2px;">合計 ${money(sum)}${sumSv ? "・SV " + Math.round(sumSv) : ""}</div>` : "")
      + ((trial && o.reaction) ? `<div class="muted" style="margin-top:2px;">反應：${esc(o.reaction)}</div>` : "")
      + (o.note ? `<div class="muted" style="margin-top:2px;">${esc(o.note)}</div>` : "");
    return `<div class="ilog"${trial ? ` style="border-left-color:${partnerColor()};"` : ""}>`
      + `<span class="when">${esc(o.date)}</span>`
      + `<button class="btn small ghost" data-delorder="${esc(o.key)}" style="float:right;">刪</button>`
      + `<button class="btn small ghost" data-editorder="${esc(o.key)}" style="float:right; color:var(--ink-soft);">改</button>`
      + `<div class="txt">${lines}</div></div>`;
  };
  /* 往來多年的客戶，全部攤開要捲很久；分段收起來，摘要行先講重點 */
  const fold = (title, meta, body, open) => `<details class="detfold"${open ? " open" : ""}>
    <summary>${title}${meta ? `<span class="n">${esc(meta)}</span>` : ""}</summary>
    <div>${body}</div></details>`;

  openSheet(c.name, `
    <div>
      <span class="chip warmth-${c.warmth}">${esc(warmthLabel(c.warmth))}</span>
      ${isPartner(c) ? `<span class="chip" style="background:${partnerColor()};color:#fff;">${esc(ROLES[roleOf(c)].label)}</span>` : ""}
      ${(c.tags||[]).map(t => `<span class="chip tag">#${esc(t)}</span>`).join("")}
    </div>

    ${(c.phone || c.lineId) ? `<div class="qcontact">
      ${c.phone ? `<a href="tel:${esc(c.phone)}">撥電話</a>` : ""}
      ${c.lineId ? `<a href="https://line.me/ti/p/~${encodeURIComponent(c.lineId)}" target="_blank" rel="noopener">LINE</a>` : ""}
    </div>` : ""}

    <div class="row" style="margin-top:12px;">
      <button class="btn primary grow" id="d-log">記互動</button>
      <button class="btn grow" id="d-buy">記購買</button>
      <button class="btn grow" id="d-trial">記體驗</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <button class="btn grow" id="d-rel">加關係</button>
      <button class="btn grow" id="d-edit">編輯</button>
    </div>

    ${c.preference ? `<div style="margin-top:14px;"><span class="muted">偏好／需求</span>
      <div class="card" style="margin-top:4px; margin-bottom:0; white-space:pre-wrap;">${esc(c.preference)}</div></div>` : ""}
    ${c.note ? `<div class="card" style="margin-top:12px; margin-bottom:0; white-space:pre-wrap;">${esc(c.note)}</div>` : ""}

    <div style="margin-top:16px;">
    ${ts.length ? fold("待辦", ts.length + " 件", ts.map(t => {
        const d = daysUntil(t.due);
        return `<div class="row" style="margin-bottom:8px;">
          <button class="btn small" data-donetask="${esc(t.id)}" style="flex:0 0 auto;">完成</button>
          <span class="grow">${esc(t.text)}</span>
          <span class="muted">${esc(t.due)}${d < 0 ? "（逾期）" : d === 0 ? "（今天）" : ""}</span></div>`;
      }).join(""), true) : ""}

    ${fold("購買紀錄",
      orders.length ? `${orders.length} 單／${buys.length} 項${spent ? "・累計 " + money(spent) : ""}` : "還沒有",
      orders.length ? orders.map(o => orderHTML(o, false)).join("") : `<div class="muted">還沒有購買紀錄。</div>`,
      orders.length > 0)}

    ${trialGroups.length ? fold("體驗紀錄", `${trialGroups.length} 次／${trials.length} 項`,
      trialGroups.map(o => orderHTML(o, true)).join(""), false) : ""}

    ${fold("互動紀錄", logs.length ? `${logs.length} 筆・最近 ${logs[0].date}` : "還沒有",
      logs.length ? logs.map(i =>
        `<div class="ilog"><span class="when">${esc(i.date)}</span>
         <button class="btn small ghost" data-dellog="${esc(i.id)}" style="float:right;">刪</button>
         <button class="btn small ghost" data-editlog="${esc(i.id)}" style="float:right; color:var(--ink-soft);">改</button>
         <div class="txt">${esc(i.text)}</div></div>`).join("")
        : `<div class="muted">還沒有互動紀錄。</div>`, false)}

    ${fold("關係", rels.length ? rels.length + " 條" : "還沒有",
      `<div id="d-rels">${rels.length ? rels.map(r => {
        const L = relationLabel(r, id);
        return `<div class="row" style="margin-bottom:6px;">
          <span class="grow" data-open="${esc(L.otherId)}" style="cursor:pointer;">
            <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${L.color};margin-right:6px;"></span>${esc(L.text)}</span>
          <button class="btn small" data-delrel="${esc(r.id)}">刪</button></div>`;
      }).join("") : `<div class="muted">還沒有連任何人。</div>`}</div>`, false)}

    ${hasOrg ? fold("組織",
      `第 ${generationOf(id)} 代・直屬 ${downs.length} 人・整條線 ${orgSz} 人`,
      `<div class="muted">上線：${up && getCustomer(up) ? `<span data-open="${esc(up)}" style="color:var(--accent);cursor:pointer;">${esc(getCustomer(up).name)}</span>` : "無（最上層）"}</div>
       ${orgSpend(id) ? `<div class="muted" style="margin-top:4px;">組織業績累計 ${money(orgSpend(id))}（本人 ${money(spent)}）</div>` : ""}
       ${downs.length ? `<div style="margin-top:8px;">${downs.map(d => {
         const dc = getCustomer(d);
         return dc ? `<span class="chip tag" data-open="${esc(d)}" style="cursor:pointer;">${esc(dc.name)}${orgSize(d) ? "（+" + orgSize(d) + "）" : ""}</span>` : "";
       }).join("")}</div>` : ""}`, false) : ""}

    ${fields.length ? fold("基本資料", fields.map(f => f[0]).join("・"),
      fields.map(f => `<div style="margin-bottom:8px;"><span class="muted">${f[0]}</span>　${f[1]}</div>`).join(""), false) : ""}
    </div>

    <div style="margin-top:22px; text-align:center;">
      <button class="btn ghost" id="d-delete" style="color:var(--danger);">刪除這位客戶</button>
    </div>
  `);

  document.getElementById("d-edit").addEventListener("click", () => openEdit(id));
  document.getElementById("d-log").addEventListener("click", () => openQuickLog(id));
  document.getElementById("d-buy").addEventListener("click", () => openPurchase(id, "buy"));
  document.getElementById("d-trial").addEventListener("click", () => openPurchase(id, "trial"));
  bindTaskButtons(sheetEl, () => openDetail(id));
  document.getElementById("d-rel").addEventListener("click", () => openAddRelation(id));
  document.getElementById("d-delete").addEventListener("click", () => {
    if (!confirm(`確定刪除「${c.name}」？相關的關係、互動與購買紀錄會一併刪除，無法復原。`)) return;
    DB.customers = DB.customers.filter(x => x.id !== id);
    DB.relations = DB.relations.filter(r => r.from !== id && r.to !== id);
    DB.interactions = DB.interactions.filter(i => i.customerId !== id);
    DB.purchases = DB.purchases.filter(x => x.customerId !== id);
    DB.tasks = DB.tasks.filter(x => x.customerId !== id);
    save(); closeSheet(); showView(currentView);
  });
  document.querySelectorAll("[data-delrel]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    if (!confirm("刪除這條關係？")) return;
    DB.relations = DB.relations.filter(r => r.id !== b.dataset.delrel);
    save(); openDetail(id);
  }));
  document.querySelectorAll("[data-delorder]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const k = b.dataset.delorder;
    const solo = k.startsWith("_solo_");
    const targets = solo
      ? DB.purchases.filter(x => x.id === k.slice(6))
      : DB.purchases.filter(x => x.orderId === k && x.customerId === id);   // 購買與體驗共用
    if (!targets.length) return;
    const kindTxt = isTrial(targets[0]) ? "體驗" : "購買";
    if (!confirm(targets.length > 1
      ? `刪除這筆${kindTxt}紀錄（共 ${targets.length} 個品項）？`
      : `刪除這筆${kindTxt}紀錄？`)) return;
    const ids = new Set(targets.map(x => x.id));
    DB.purchases = DB.purchases.filter(x => !ids.has(x.id));
    save(); openDetail(id);
  }));
  document.querySelectorAll("[data-dellog]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    if (!confirm("刪除這筆互動紀錄？")) return;
    DB.interactions = DB.interactions.filter(i => i.id !== b.dataset.dellog);
    save(); openDetail(id);
  }));
  document.querySelectorAll("[data-editorder]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const rows = purchaseRowsOf(b.dataset.editorder, id);
    if (rows.length) openPurchase(id, isTrial(rows[0]) ? "trial" : "buy", b.dataset.editorder);
  }));
  document.querySelectorAll("[data-editlog]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    openQuickLog(id, b.dataset.editlog);
  }));
}

/* ---------- 新增／編輯客戶 ---------- */
function openEdit(id){
  const c = id ? getCustomer(id) : null;
  openSheet(c ? "編輯：" + c.name : "新增客戶", `
    <label>姓名（必填）</label><input type="text" id="f-name" value="${esc(c ? c.name : "")}">
    <label>電話</label><input type="tel" id="f-phone" value="${esc(c ? c.phone : "")}">

    <label>怎麼認識的</label><input type="text" id="f-source" value="${esc(c ? c.source : "")}" placeholder="例：老王介紹、社團活動…">
    <label>LINE ID</label><input type="text" id="f-line" value="${esc(c ? (c.lineId || "") : "")}" placeholder="用來一鍵開 LINE 聊天">
    <label>生日（可只填月日）</label><input type="text" id="f-birthday" value="${esc(c ? (c.birthday || "") : "")}" placeholder="例：03-15 或 1985-03-15" inputmode="numeric">
    <label>標籤（用逗號分隔）</label><input type="text" id="f-tags" value="${esc(c ? (c.tags||[]).join("、") : "")}" placeholder="例：保險、高潛力、台中">
    <label>身份</label>
    <div class="filterbar" id="f-role">
      ${Object.keys(ROLES).map(k =>
        `<button class="fbtn ${roleOf(c || {}) === k ? "on" : ""}" data-k="${k}">${esc(ROLES[k].label)}</button>`).join("")}
    </div>
    <label>熟度</label>
    <div class="filterbar" id="f-warmth">
      ${Object.keys(WARMTH).map(k =>
        `<button class="fbtn ${((c&&c.warmth)||"warm")===k?"on":""}" data-k="${k}">${esc(warmthLabel(k))}</button>`).join("")}
    </div>
    <label>偏好／需求</label><textarea id="f-pref" rows="2" placeholder="例：只用無香精、預算 3 萬內、偏好週末見面">${esc(c ? (c.preference || "") : "")}</textarea>
    <label>備註</label><textarea id="f-note" rows="4">${esc(c ? c.note : "")}</textarea>
    <div class="row" style="margin-top:18px;">
      <button class="btn primary grow" id="f-save">儲存</button>
    </div>
  `);
  let role = roleOf(c || {});
  document.querySelectorAll("#f-role .fbtn").forEach(b => b.addEventListener("click", () => {
    role = b.dataset.k;
    document.querySelectorAll("#f-role .fbtn").forEach(x => x.classList.toggle("on", x === b));
  }));
  let warmth = (c && c.warmth) || "warm";
  document.querySelectorAll("#f-warmth .fbtn").forEach(b => b.addEventListener("click", () => {
    warmth = b.dataset.k;
    document.querySelectorAll("#f-warmth .fbtn").forEach(x => x.classList.toggle("on", x === b));
  }));
  document.getElementById("f-save").addEventListener("click", () => {
    const name = document.getElementById("f-name").value.trim();
    if (!name){ alert("姓名是必填的。"); return; }
    const tags = document.getElementById("f-tags").value.split(/[,，、]/).map(s => s.trim()).filter(Boolean);
    const data = {
      name,
      phone: document.getElementById("f-phone").value.trim(),
      company: document.getElementById("f-company").value.trim(),
      source: document.getElementById("f-source").value.trim(),
      tags, warmth, role,
      lineId: document.getElementById("f-line").value.trim(),
      birthday: document.getElementById("f-birthday").value.trim(),
      preference: document.getElementById("f-pref").value.trim(),
      note: document.getElementById("f-note").value.trim(),
    };
    if (!c){
      // 人脈累積久了一定會重複建檔，而且目前沒有合併功能，事前擋一下比事後搬省事
      const dup = DB.customers.find(x => x.name === data.name);

    if (c) Object.assign(c, data);
    else DB.customers.push(Object.assign({id:uid("c"), pos:null, createdAt:Date.now()}, data));
    save(); closeSheet(); showView(currentView);
    if (c) openDetail(c.id);
  });
}

/* ---------- 記一筆互動 ---------- */
/* 最近有往來（互動或購買）的人，去重後由近到遠 */
function recentContactIds(n){
  const rows = DB.interactions.map(x => ({id:x.customerId, date:x.date, createdAt:x.createdAt}))
    .concat(DB.purchases.map(x => ({id:x.customerId, date:x.date, createdAt:x.createdAt})))
    .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  const out = [], seen = new Set();
  for (const r of rows){
    if (out.length >= n) break;
    if (!seen.has(r.id) && getCustomer(r.id)){ seen.add(r.id); out.push(r.id); }
  }
  return out;
}
/* 反覆下單的常常就那幾位，沒有關鍵字時把他們提到最上面，省得每次捲整份名單 */
function pickerOptionsHTML(excludeId, kw){
  kw = String(kw || "").trim().toLowerCase();
  const opt = c => `<option value="${esc(c.id)}">${esc(c.name)}${c.company ? "（" + esc(c.company) + "）" : ""}</option>`;
  const match = c => c.id !== excludeId && (!kw || (c.name + " " + (c.company || "")).toLowerCase().includes(kw));
  const all = DB.customers.slice().sort((a, b) => a.name.localeCompare(b.name, "zh-Hant")).filter(match);
  if (kw) return all.map(opt).join("");
  const recent = recentContactIds(5).map(getCustomer).filter(c => c && match(c));
  if (!recent.length) return all.map(opt).join("");
  const rset = new Set(recent.map(c => c.id));
  return `<optgroup label="最近往來">${recent.map(opt).join("")}</optgroup>` +
    `<optgroup label="全部">${all.filter(c => !rset.has(c.id)).map(opt).join("")}</optgroup>`;
}
/* 選人改成一排頭像 pill：最近往來的排前面，點一下就選好，
   人多時再打字過濾。原本的 select 清單一次只露五個，每次都要捲 */
function customerPickerHTML(pickId, excludeId){
  return `<input type="hidden" id="${pickId}">
    <div class="pillpick" id="${pickId}-wrap"></div>
    <input type="search" id="${pickId}-q" placeholder="打字找人…" autocomplete="off" style="margin-top:6px;">`;
}
function renderPillPicker(pickId, excludeId, kw){
  const hid = document.getElementById(pickId);
  const wrap = document.getElementById(pickId + "-wrap");
  if (!hid || !wrap) return;
  kw = String(kw || "").trim().toLowerCase();
  const match = c => c.id !== excludeId && (!kw || (c.name + " " + (c.company || "")).toLowerCase().includes(kw));
  const byName = (a, b) => a.name.localeCompare(b.name, "zh-Hant");
  let list;
  if (kw){
    list = DB.customers.filter(match).sort(byName);
  } else {
    const recent = recentContactIds(8).map(getCustomer).filter(c => c && match(c));
    const seen = new Set(recent.map(c => c.id));
    list = recent.concat(DB.customers.filter(c => match(c) && !seen.has(c.id)).sort(byName));
  }
  wrap.innerHTML = list.slice(0, 40).map(c =>
    `<button type="button" class="ppill${hid.value === c.id ? " on" : ""}" data-pick="${esc(c.id)}">
      <span class="av" style="background:${warmthColor(WARMTH[c.warmth] ? c.warmth : "warm")};">${esc(c.name.slice(0, 1))}</span>${esc(c.name)}</button>`
  ).join("") || `<div class="muted">找不到符合的人。</div>`;
  wrap.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => {
    hid.value = b.dataset.pick;
    const q = document.getElementById(pickId + "-q");
    renderPillPicker(pickId, excludeId, q ? q.value : "");
  }));
}
function wireCustomerPicker(pickId, excludeId){
  renderPillPicker(pickId, excludeId, "");
  const q = document.getElementById(pickId + "-q");
  if (q) q.addEventListener("input", () => renderPillPicker(pickId, excludeId, q.value));
}
/* 選日期：九成的紀錄不是今天就是昨天，先給兩顆鈕，真的要挑再開日曆 */
function dateSegHTML(id, value){
  const t = todayStr();
  const y = (() => { const d = new Date(t + "T00:00:00"); d.setDate(d.getDate() - 1);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); })();
  const mode = value === t ? "today" : value === y ? "yest" : "pick";
  return `<div class="seg" id="${id}-seg">
      <button type="button" data-dseg="today"${mode === "today" ? ' class="on"' : ""}>今天</button>
      <button type="button" data-dseg="yest"${mode === "yest" ? ' class="on"' : ""}>昨天</button>
      <button type="button" data-dseg="pick"${mode === "pick" ? ' class="on"' : ""}>選日期</button>
    </div>
    <input type="date" id="${id}" value="${esc(value)}" style="margin-top:8px;${mode === "pick" ? "" : "display:none;"}">`;
}
function wireDateSeg(id){
  const seg = document.getElementById(id + "-seg"), inp = document.getElementById(id);
  if (!seg || !inp) return;
  const t = todayStr();
  const y = (() => { const d = new Date(t + "T00:00:00"); d.setDate(d.getDate() - 1);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); })();
  seg.querySelectorAll("[data-dseg]").forEach(b => b.addEventListener("click", () => {
    seg.querySelectorAll("[data-dseg]").forEach(x => x.classList.toggle("on", x === b));
    const k = b.dataset.dseg;
    inp.style.display = k === "pick" ? "" : "none";
    if (k === "today") inp.value = t;
    if (k === "yest") inp.value = y;
    if (k === "pick") inp.focus();
  }));
}
function openQuickLog(customerId, editId){
  if (!DB.customers.length){ alert("還沒有任何客戶，先新增一位吧。"); return; }
  const c = customerId ? getCustomer(customerId) : null;
  const ex = editId ? DB.interactions.find(x => x.id === editId) : null;
  openSheet(ex ? "修改這筆互動" : "記一筆互動", `
    ${c ? `<div style="font-weight:600;">${esc(c.name)}</div>` : `<label>對象</label>` + customerPickerHTML("log-pick", null)}
    <label>日期</label>${dateSegHTML("log-date", ex ? ex.date : todayStr())}
    <label>聊了什麼</label><textarea id="log-text" rows="4" placeholder="重點記兩句就好…">${ex ? esc(ex.text) : ""}</textarea>
    ${ex ? "" : `<hr class="card-divider">
    <label>下次跟進（選填，時間到會出現在首頁「今天要做的事」）</label>
    <input type="date" id="log-due">
    <input type="text" id="log-todo" placeholder="要做什麼？例：約見面談續約" style="margin-top:8px;">`}
    <div class="row" style="margin-top:18px;"><button class="btn primary grow" id="log-save">${ex ? "儲存修改" : "儲存"}</button></div>
  `);
  if (!c) wireCustomerPicker("log-pick", null);
  wireDateSeg("log-date");
  document.getElementById("log-save").addEventListener("click", () => {
    const target = c ? c.id : (document.getElementById("log-pick") || {}).value;
    if (!target){ alert("請先選一位對象。"); return; }
    const text = document.getElementById("log-text").value.trim();
    if (!text){ alert("內容不能是空的。"); return; }
    const date = document.getElementById("log-date").value || todayStr();
    if (ex){
      ex.date = date; ex.text = text;
    } else {
      DB.interactions.push({id:uid("i"), customerId:target, date, text, createdAt:Date.now()});
      // 改舊紀錄時不顯示跟進欄位，免得每改一次就多排一筆待辦
      const due = document.getElementById("log-due").value;
      const todo = document.getElementById("log-todo").value.trim();
      if (due) DB.tasks.push({id:uid("t"), customerId:target, due, text:todo || "跟進", done:false, createdAt:Date.now()});
    }
    save(); closeSheet();
    if (c) openDetail(c.id); else showView(currentView);
  });
}

/* ---------- 記一筆購買 ---------- */
function purchaseRowsOf(key, customerId){
  if (!key) return [];
  return key.startsWith("_solo_")
    ? DB.purchases.filter(x => x.id === key.slice(6))
    : DB.purchases.filter(x => x.orderId === key && x.customerId === customerId);
}
function openPurchase(customerId, kind, editKey){
  if (!DB.customers.length){ alert("還沒有任何客戶，先新增一位吧。"); return; }
  const c = customerId ? getCustomer(customerId) : null;
  const trial = kind === "trial";
  // 改一筆單＝把原本的品項讀回來當草稿，存檔時整單換掉（orderId 與建立時間留著）
  const editRows = purchaseRowsOf(editKey, customerId);
  const editing = editRows.length > 0;
  const first = editing ? editRows[0] : null;
  // unit 早期沒存，用總額回推；正好讓一直存著沒人讀的 unit/svUnit 派上用場
  let lines = editRows.map(x => ({
    item: x.item, qty: x.qty || 1,
    unit: x.unit != null ? x.unit : (x.amount != null && x.qty ? x.amount / x.qty : null),
    svUnit: x.svUnit != null ? x.svUnit : (x.sv != null && x.qty ? x.sv / x.qty : null)
  }));

  openSheet(editing ? (trial ? "修改這筆體驗" : "修改這筆購買") : (trial ? "記一筆體驗" : "記一筆購買"), `
    ${c ? `<div style="font-weight:600;">${esc(c.name)}</div>` : `<label>對象</label>` + customerPickerHTML("buy-pick", null)}
    <label>日期</label>${dateSegHTML("buy-date", editing ? first.date : todayStr())}

    <label>加品項 <span class="muted" style="font-weight:400;">點一下加入・常買的排前面</span></label>
    <input type="search" id="buy-cat-q" placeholder="輸入關鍵字找商品…" autocomplete="off">
    <div class="catgrid" id="buy-cat-pick"></div>
    <div class="row" style="margin-top:8px;">
      <input type="text" id="buy-manual" class="grow" placeholder="不在目錄裡？自己打品項名稱">
      <button class="btn small" id="buy-add-manual" style="flex:0 0 auto;">加入</button>
    </div>

    <label>${trial ? "體驗了哪些產品" : "這張單的品項"}</label>
    <div id="buy-lines"></div>

    <details class="fold"${(editing && (first.cycle || first.note || first.reaction)) ? " open" : ""}>
      <summary>${trial ? "反應、回訪與備註" : "回購週期與備註"} <span class="muted">選填</span></summary>
      <div>
      ${trial ? `
        <label>反應／回饋</label>
        <textarea id="buy-reaction" rows="2" placeholder="例：膚觸有感，想再試一次；覺得味道太重">${editing ? esc(first.reaction || "") : ""}</textarea>
        ${editing ? "" : `<label>幾天後回訪（會排進待辦）</label>
        <input type="text" id="buy-followup" inputmode="numeric" placeholder="例：7（給 7 天份，一週後問感想）">`}
      ` : `
        <label>回購週期（天數；消耗品填了會自動提醒）</label>
        <input type="text" id="buy-cycle" inputmode="numeric" placeholder="例：30（一個月用完）"
          value="${editing && first.cycle ? first.cycle : ""}">
      `}
      <label>備註</label><textarea id="buy-note" rows="2" placeholder="${trial ? "例：在她家客廳體驗、朋友一起試" : "例：分期付款、幫親戚一起買"}">${editing ? esc(first.note || "") : ""}</textarea>
      </div>
    </details>
    <div class="row" style="margin-top:18px;"><button class="btn primary grow" id="buy-save">${editing ? "儲存修改" : "儲存"}</button></div>
  `);
  if (!c) wireCustomerPicker("buy-pick", null);
  wireDateSeg("buy-date");

  const linesBox = document.getElementById("buy-lines");
  const renderLines = () => {
    if (!lines.length){
      linesBox.innerHTML = `<div class="muted">還沒有品項——從上面的目錄挑，或自己打名稱加入。</div>`;
      return;
    }
    const total = lines.reduce((t, l) => t + (l.unit || 0) * l.qty, 0);
    const totalSv = lines.reduce((t, l) => t + (l.svUnit || 0) * l.qty, 0);
    linesBox.innerHTML = lines.map((l, i) => `
      <div class="card" style="padding:10px; margin-bottom:8px;">
        <div class="row" style="align-items:baseline;">
          <b class="grow">${esc(l.item)}</b>
          <button class="btn small ghost" data-rmline="${i}" style="flex:0 0 auto;">移除</button>
        </div>
        <div class="row" style="margin-top:8px; gap:6px;">
          <button class="btn small" data-qty="${i}" data-delta="-1" style="flex:0 0 auto;">−</button>
          <input type="text" inputmode="numeric" data-qtyin="${i}" value="${l.qty}"
            style="width:3.2em; text-align:center; padding:6px 4px;">
          <button class="btn small" data-qty="${i}" data-delta="1" style="flex:0 0 auto;">＋</button>
          ${trial ? "" : `<span class="muted" style="flex:0 0 auto;">單價</span>
          <input type="text" inputmode="decimal" data-unit="${i}" value="${l.unit == null ? "" : l.unit}"
            placeholder="選填" style="width:5.5em; padding:6px 8px;">`}
        </div>
        ${trial ? "" : `<div class="muted line-sub" data-sub="${i}" style="margin-top:6px;">
          ${l.unit == null ? "未填金額" : "小計 " + money(l.unit * l.qty)}${l.svUnit ? "・SV " + Math.round(l.svUnit * l.qty) : ""}
        </div>`}
      </div>`).join("") +
      (trial ? "" : `<div class="row" style="margin-top:4px;"><b class="grow">合計</b>
        <b id="buy-total">${money(total)}${totalSv ? "・SV " + Math.round(totalSv) : ""}</b></div>`);

    linesBox.querySelectorAll("[data-rmline]").forEach(b => b.addEventListener("click", () => {
      lines.splice(Number(b.dataset.rmline), 1); renderLines();
    }));
    linesBox.querySelectorAll("[data-qty]").forEach(b => b.addEventListener("click", () => {
      const i = Number(b.dataset.qty);
      lines[i].qty = Math.max(1, Math.min(999, lines[i].qty + Number(b.dataset.delta)));
      renderLines();
    }));
    // 打字當下就更新小計與合計；只改文字不重繪整份，否則游標會跳掉
    const refreshTotals = () => {
      lines.forEach((l, i) => {
        const el = linesBox.querySelector(`[data-sub="${i}"]`);
        if (el) el.textContent = (l.unit == null ? "未填金額" : "小計 " + money(l.unit * l.qty)) +
          (l.svUnit ? "・SV " + Math.round(l.svUnit * l.qty) : "");
      });
      const t = lines.reduce((a, l) => a + (l.unit || 0) * l.qty, 0);
      const tv = lines.reduce((a, l) => a + (l.svUnit || 0) * l.qty, 0);
      const el = linesBox.querySelector("#buy-total");
      if (el) el.textContent = money(t) + (tv ? "・SV " + Math.round(tv) : "");
    };
    linesBox.querySelectorAll("[data-qtyin]").forEach(inp => {
      const apply = () => {
        const i = Number(inp.dataset.qtyin);
        const v = parseInt(inp.value, 10);
        lines[i].qty = (v > 0 && v <= 999) ? v : 1;
        refreshTotals();
      };
      inp.addEventListener("input", apply);
      // 不在 blur/change 時重繪：即時更新已寫好數字，重繪會把使用者正要點的另一個
      // 輸入框整個換掉，導致第一下點擊被吃掉（手機上兩欄相鄰特別明顯）
      inp.addEventListener("change", apply);
    });
    linesBox.querySelectorAll("[data-unit]").forEach(inp => {
      const apply = () => {
        const i = Number(inp.dataset.unit);
        const raw = inp.value.replace(/[,\s$]/g, "");
        const v = Number(raw);
        lines[i].unit = (raw && Number.isFinite(v) && v >= 0) ? v : null;
        refreshTotals();
      };
      inp.addEventListener("input", apply);
      inp.addEventListener("change", apply);
    });
  };
  renderLines();

  const addLine = (item, unit, svUnit) => {
    const exist = lines.find(l => l.item === item);
    if (exist){ exist.qty = Math.min(999, exist.qty + 1); }   // 同品項再選一次就是加數量
    else lines.push({item, qty:1, unit: unit == null ? null : unit, svUnit: svUnit || null});
    renderLines();
  };

  const cq = document.getElementById("buy-cat-q");
  const cpick = document.getElementById("buy-cat-pick");
  // 賣得最多的就那幾樣，沒關鍵字時把買過的次數當排序依據推到最前面
  const boughtCount = {};
  DB.purchases.forEach(x => { boughtCount[x.item] = (boughtCount[x.item] || 0) + 1; });
  const LIMIT = 16;
  const fillCatalog = () => {
    const kw = cq.value.trim().toLowerCase();
    // 搜尋同時比對分類，所以卡片上也標分類，否則使用者看不出這筆為何入選
    let hits = kw ? CATALOG.filter(x => (x[0] + " " + x[3]).toLowerCase().includes(kw)) : CATALOG.slice();
    if (!kw) hits.sort((a, b) => (boughtCount[b[0]] || 0) - (boughtCount[a[0]] || 0));
    const shown = hits.slice(0, LIMIT);
    cpick.innerHTML = shown.map(x => `<button type="button" class="catcard" data-cat="${esc(x[0])}">
        <span class="ci">${esc(String(x[0]).replace(/^[\[(（【][^\])）】]*[\])）】]\s*/, "").slice(0, 1))}</span>
        <span class="cm">
          <span class="cn">${esc(x[0])}</span>
          <span class="cp">${x[1] ? money(x[1]).replace("NT$ ", "$") : "未標價"}${x[2] ? "・SV " + x[2] : ""}${kw && x[3] ? "・" + esc(x[3]) : ""}</span>
        </span>
        <span class="cplus">＋</span>
      </button>`).join("")
      + (hits.length > shown.length
        ? `<div class="catmore">還有 ${hits.length - shown.length} 項——打關鍵字找</div>` : "")
      || `<div class="catmore">目錄裡找不到「${esc(cq.value.trim())}」，可以用下面的欄位自己打。</div>`;
    cpick.querySelectorAll("[data-cat]").forEach(btn => btn.addEventListener("click", () => {
      const hit = CATALOG.find(x => x[0] === btn.dataset.cat);
      if (hit) addLine(hit[0], hit[1] || null, hit[2] || null);
    }));
  };
  fillCatalog();
  cq.addEventListener("input", fillCatalog);
  const addManual = () => {
    const el = document.getElementById("buy-manual");
    const v = el.value.trim();
    if (!v) return;
    addLine(v, null, null);
    el.value = "";
  };
  document.getElementById("buy-add-manual").addEventListener("click", addManual);
  document.getElementById("buy-manual").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); addManual(); } });

  document.getElementById("buy-save").addEventListener("click", () => {
    const target = c ? c.id : (document.getElementById("buy-pick") || {}).value;
    if (!target){ alert("請先選一位對象。"); return; }
    if (!lines.length){ alert("這張單還沒有任何品項。"); return; }
    const date = document.getElementById("buy-date").value || todayStr();
    const cycEl = document.getElementById("buy-cycle");
    const cycle = cycEl ? (() => { const v = parseInt(cycEl.value, 10); return (v > 0 && v <= 3650) ? v : null; })() : null;
    const note = document.getElementById("buy-note").value.trim();
    const reactEl = document.getElementById("buy-reaction");
    const reaction = reactEl ? reactEl.value.trim() : "";
    const orderId = editing ? (first.orderId || uid("o")) : uid("o");
    const createdAt = editing ? (first.createdAt || Date.now()) : Date.now();
    if (editing){
      const drop = new Set(editRows.map(x => x.id));
      DB.purchases = DB.purchases.filter(x => !drop.has(x.id));
    }
    lines.forEach(l => {
      DB.purchases.push({id:uid("p"), customerId:target, date, orderId,
        kind: trial ? "trial" : "buy", reaction,
        item:l.item, qty:l.qty,
        unit: l.unit == null ? null : l.unit,
        amount: l.unit == null ? null : l.unit * l.qty,
        svUnit: l.svUnit == null ? null : l.svUnit,
        sv: l.svUnit == null ? null : l.svUnit * l.qty,
        cycle, note, createdAt});
    });
    // 體驗排回訪待辦：體驗完不追等於白做
    const fuEl = document.getElementById("buy-followup");
    const fuDays = fuEl ? parseInt(fuEl.value, 10) : NaN;
    if (trial && fuDays > 0 && fuDays <= 365){
      const due = new Date(new Date(date + "T00:00:00").getTime() + fuDays * 86400000);
      const dueStr = due.getFullYear() + "-" + String(due.getMonth() + 1).padStart(2, "0") +
        "-" + String(due.getDate()).padStart(2, "0");
      DB.tasks.push({id:uid("t"), customerId:target, due:dueStr,
        text:"問體驗感想：" + lines.map(l => l.item).join("、").slice(0, 40),
        done:false, createdAt:Date.now()});
    }
    save(); closeSheet();
    if (c) openDetail(c.id); else showView(currentView);
  });
}

    <div class="row" style="margin-top:18px;"><button class="btn primary grow" id="rel-save">建立關係</button></div>
  `);
  wireCustomerPicker("rel-pick", id);
  const typeSel = document.getElementById("rel-type");
  const dirBox = document.getElementById("rel-dir-box");
  const syncDir = () => { dirBox.style.display = relType(typeSel.value).directed ? "block" : "none"; };
  typeSel.addEventListener("change", syncDir); syncDir();
  document.getElementById("rel-save").addEventListener("click", () => {
    const otherId = (document.getElementById("rel-pick") || {}).value;
    if (!otherId){ alert("請先選另一位客戶。"); return; }
    const type = typeSel.value;
    const t = relType(type);
    let from = id, to = otherId;
    if (t.directed && document.getElementById("rel-dir").value === "in"){ from = otherId; to = id; }
    const dup = DB.relations.some(r => r.type === type &&
      ((r.from === from && r.to === to) || (!t.directed && r.from === to && r.to === from)));
    if (dup){ alert("這兩位之間已經有同樣的關係了。"); return; }
    if (t.tree){
      if (from === to){ alert("不能把自己設成自己的上線。"); return; }
      // 防環：新的上線若已在自己的組織底下，會形成迴圈
      if (orgMembers(to).includes(from)){
        alert("這樣會繞成一個圈（對方已經在你這條線底下），請確認上下線方向。"); return;
      }
      const exist = DB.relations.find(r => r.type === "upline" && r.to === to);
      if (exist){
        const cur = getCustomer(exist.from);
        if (!confirm(`${getCustomer(to).name} 目前的上線是「${cur ? cur.name : "（已刪除）"}」。\n一個人只能有一個上線，要改成「${getCustomer(from).name}」嗎？`)) return;
        DB.relations = DB.relations.filter(r => r.id !== exist.id);
      }
    }
    DB.relations.push({id:uid("r"), from, to, type, createdAt:Date.now()});
    save(); openDetail(id);
  });
}

/* ---------- 關係圖 ---------- */
const gview = {tx:0, ty:0, s:1, inited:false};
let gMode = "net";          // net=網絡 org=組織圖 intro=轉介鏈
const TREE_REL = {org:"upline", intro:"intro"};
let gDepth = {};            // 樹狀模式下各節點的代數
let gFocus = null;          // 聚焦的客戶 id
let gFocusDepth = 1;        // 1=直接關係 2=第二層
let gFilterWarmth = null;
let gFilterTag = null;
let gIntroPos = {};         // 轉介鏈模式的臨時座標（不寫回 pos）

function dormantLimit(){
  const v = DB.settings && parseInt(DB.settings.dormantDays, 10);
  return (v >= 1 && v <= 365) ? v : 30;
}
function dormantInfo(id){
  const lc = lastContact(id);
  if (!lc) return {days:null, dormant:true};
  const days = Math.max(0, Math.floor((Date.now() - new Date(lc + "T00:00:00").getTime()) / 86400000));
  return {days, dormant: days > dormantLimit()};
}

function ensurePositions(){
  const need = DB.customers.filter(c => !c.pos);
  if (!need.length) return;
  // 全部重排 → 用群組打包；只加了幾個人 → 沿用增量排版不動既有位置
  if (need.length === DB.customers.length) packedLayout();
  else forceLayout(need);
  save();
}

/* 連通分量：把彼此有關係的人歸成同一群 */
function componentsOf(list){
  const idset = new Set(list.map(c => c.id));
  const adj = {};
  list.forEach(c => adj[c.id] = []);
  DB.relations.forEach(r => {
    if (idset.has(r.from) && idset.has(r.to)){ adj[r.from].push(r.to); adj[r.to].push(r.from); }
  });
  const seen = new Set(), comps = [];
  list.forEach(c => {
    if (seen.has(c.id)) return;
    const stack = [c.id], g = [];
    seen.add(c.id);
    while (stack.length){
      const id = stack.pop();
      g.push(id);
      adj[id].forEach(n => { if (!seen.has(n)){ seen.add(n); stack.push(n); } });
    }
    comps.push(g);
  });
  return comps;
}

/* 單一群組內部的力導向排版（回傳相對座標） */
function layoutComponent(ids){
  const K = 120;
  const idset = new Set(ids);
  const rels = DB.relations.filter(r => idset.has(r.from) && idset.has(r.to));
  const pos = {};
  ids.forEach((id, i) => {
    const ang = i * 2.399963, rad = 40 + 22 * Math.sqrt(i + 1);
    pos[id] = {x: rad * Math.cos(ang), y: rad * Math.sin(ang)};
  });
  for (let it = 0; it < 260; it++){
    const disp = {};
    ids.forEach(id => disp[id] = {x:0, y:0});
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++){
      const a = ids[i], b = ids[j];
      let dx = pos[a].x - pos[b].x, dy = pos[a].y - pos[b].y, d2 = dx*dx + dy*dy;
      if (d2 < 1){ dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
      const d = Math.sqrt(d2), f = K * K / d;
      disp[a].x += dx / d * f; disp[a].y += dy / d * f;
      disp[b].x -= dx / d * f; disp[b].y -= dy / d * f;
    }
    rels.forEach(r => {
      const dx = pos[r.from].x - pos[r.to].x, dy = pos[r.from].y - pos[r.to].y;
      const d = Math.max(1, Math.sqrt(dx*dx + dy*dy)), f = d * d / K;
      disp[r.from].x -= dx / d * f; disp[r.from].y -= dy / d * f;
      disp[r.to].x += dx / d * f; disp[r.to].y += dy / d * f;
    });
    let cx = 0, cy = 0;
    ids.forEach(id => { cx += pos[id].x; cy += pos[id].y; });
    cx /= ids.length; cy /= ids.length;
    ids.forEach(id => {
      disp[id].x += (cx - pos[id].x) * 0.06;
      disp[id].y += (cy - pos[id].y) * 0.06;
    });
    const temp = 14 * (1 - it / 260) + 1;
    ids.forEach(id => {
      const d = Math.sqrt(disp[id].x**2 + disp[id].y**2) || 1;
      pos[id].x += disp[id].x / d * Math.min(d, temp);
      pos[id].y += disp[id].y / d * Math.min(d, temp);
    });
  }
  return pos;
}

/* 沒有任何關係的人：排成整齊格狀，不參與力導向（否則會被斥力推到天邊） */
function gridLayout(ids){
  const cols = Math.max(1, Math.ceil(Math.sqrt(ids.length)));
  const SX = 132, SY = 120;
  const pos = {};
  ids.forEach((id, i) => { pos[id] = {x: (i % cols) * SX, y: Math.floor(i / cols) * SY}; });
  return pos;
}

/* 把各群組當積木緊湊排列，避免互不相連的群把畫布撐爆 */
function packedLayout(){
  const all = DB.customers;
  if (!all.length) return;
  const comps = componentsOf(all).sort((a, b) => b.length - a.length);
  const singles = comps.filter(g => g.length === 1).map(g => g[0]);
  const blocks = [];
  const mkBlock = (ids, local) => {
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    ids.forEach(id => {
      minX = Math.min(minX, local[id].x); maxX = Math.max(maxX, local[id].x);
      minY = Math.min(minY, local[id].y); maxY = Math.max(maxY, local[id].y);
    });
    ids.forEach(id => { local[id] = {x: local[id].x - minX, y: local[id].y - minY}; });
    return {ids, local, w: maxX - minX, h: maxY - minY};
  };
  comps.filter(g => g.length > 1).forEach(ids => blocks.push(mkBlock(ids, layoutComponent(ids))));
  if (singles.length) blocks.push(mkBlock(singles, gridLayout(singles)));

  const GAP = 165;
  const area = blocks.reduce((t, b) => t + (b.w + GAP) * (b.h + GAP), 0);
  // 手機是直式螢幕：讓每列窄一點、群往下堆，才不會被寬度綁死縮放而上下留白
  const target = Math.max(420, Math.sqrt(area) * 0.78);
  let x = 0, y = 0, rowH = 0;
  blocks.forEach(b => {
    if (x > 0 && x + b.w > target){ x = 0; y += rowH + GAP; rowH = 0; }
    b.ox = x; b.oy = y;
    x += b.w + GAP;
    rowH = Math.max(rowH, b.h);
  });
  blocks.forEach(b => b.ids.forEach(id => {
    const c = getCustomer(id);
    if (c) c.pos = {x: Math.round(b.local[id].x + b.ox), y: Math.round(b.local[id].y + b.oy)};
  }));
}
function forceLayout(movable){
  const all = DB.customers;
  if (!all.length) return;
  const fixedSet = new Set(all.filter(c => c.pos && !movable.includes(c)).map(c => c.id));
  let cx = 0, cy = 0, n = 0;
  all.forEach(c => { if (c.pos){ cx += c.pos.x; cy += c.pos.y; n++; } });
  if (n){ cx /= n; cy /= n; } else { cx = 0; cy = 0; }
  const pos = {};
  all.forEach((c, i) => {
    if (c.pos && fixedSet.has(c.id)) pos[c.id] = {x:c.pos.x, y:c.pos.y};
    else {
      const ang = i * 2.399963;
      const rad = 60 + 26 * Math.sqrt(i + 1);
      pos[c.id] = {x: cx + rad * Math.cos(ang), y: cy + rad * Math.sin(ang)};
    }
  });
  // Fruchterman-Reingold：K = 理想邊長（120 > 節點直徑 54，連線露得出來又不會太鬆）
  const K = 120;
  for (let it = 0; it < 220; it++){
    const disp = {};
    all.forEach(c => disp[c.id] = {x:0, y:0});
    for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++){
      const a = all[i], b = all[j];
      let dx = pos[a.id].x - pos[b.id].x, dy = pos[a.id].y - pos[b.id].y;
      let d2 = dx*dx + dy*dy;
      if (d2 < 1) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
      const d = Math.sqrt(d2);
      const f = K * K / d;
      disp[a.id].x += dx / d * f; disp[a.id].y += dy / d * f;
      disp[b.id].x -= dx / d * f; disp[b.id].y -= dy / d * f;
    }
    DB.relations.forEach(r => {
      const pa = pos[r.from], pb = pos[r.to];
      if (!pa || !pb) return;
      const dx = pa.x - pb.x, dy = pa.y - pb.y;
      const d = Math.max(1, Math.sqrt(dx*dx + dy*dy));
      const f = (d * d) / K;
      disp[r.from].x -= dx / d * f; disp[r.from].y -= dy / d * f;
      disp[r.to].x += dx / d * f; disp[r.to].y += dy / d * f;
    });
    all.forEach(c => {
      // 向心力 0.06：讓群集更聚攏，手機一屏能看到的節點更多（0.02 時整體攤太開）
      disp[c.id].x += (cx - pos[c.id].x) * 0.06;
      disp[c.id].y += (cy - pos[c.id].y) * 0.06;
    });
    const temp = 14 * (1 - it / 220) + 1;
    all.forEach(c => {
      if (fixedSet.has(c.id)) return;
      const d = Math.sqrt(disp[c.id].x**2 + disp[c.id].y**2) || 1;
      pos[c.id].x += disp[c.id].x / d * Math.min(d, temp);
      pos[c.id].y += disp[c.id].y / d * Math.min(d, temp);
    });
  }
  // 沒有任何關係的節點不受引力拘束，會被斥力推到極遠；收斂後直接安置到群體外圍環上
  const linked = new Set();
  DB.relations.forEach(r => { linked.add(r.from); linked.add(r.to); });
  const islands = all.filter(c => !linked.has(c.id) && !fixedSet.has(c.id));
  if (islands.length && islands.length < all.length){
    const core = all.filter(c => linked.has(c.id));
    let mx = 0, my = 0;
    core.forEach(c => { mx += pos[c.id].x; my += pos[c.id].y; });
    mx /= core.length; my /= core.length;
    let rad = 0;
    core.forEach(c => rad = Math.max(rad, Math.hypot(pos[c.id].x - mx, pos[c.id].y - my)));
    const ring = rad + 110;
    islands.forEach((c, i) => {
      const ang = (i / islands.length) * Math.PI * 2 + 0.6;
      pos[c.id] = {x: mx + ring * Math.cos(ang), y: my + ring * Math.sin(ang)};
    });
  }
  all.forEach(c => { if (!fixedSet.has(c.id)) c.pos = {x:Math.round(pos[c.id].x), y:Math.round(pos[c.id].y)}; });
}

function nodePos(c){ return TREE_REL[gMode] ? gIntroPos[c.id] : c.pos; }

function visibleCustomers(){
  let list = DB.customers;
  if (gFilterWarmth) list = list.filter(c => c.warmth === gFilterWarmth);
  if (gFilterTag) list = list.filter(c => (c.tags || []).includes(gFilterTag));
  if (TREE_REL[gMode]){
    const key = TREE_REL[gMode];
    const inTree = new Set();
    DB.relations.filter(r => r.type === key).forEach(r => { inTree.add(r.from); inTree.add(r.to); });
    // 組織圖：夥伴即使還沒建立上下線關係也要看得到（會直接掛在「我」底下）
    list = list.filter(c => inTree.has(c.id) || (gMode === "org" && isPartner(c)));
  }
  return list;
}
function focusSetOf(rels){
  if (!gFocus) return null;
  const set = new Set([gFocus]);
  for (let depth = 0; depth < gFocusDepth; depth++){
    const add = [];
    rels.forEach(r => {
      if (set.has(r.from) && !set.has(r.to)) add.push(r.to);
      if (set.has(r.to) && !set.has(r.from)) add.push(r.from);
    });
    add.forEach(id => set.add(id));
  }
  return set;
}
function layoutIntroTree(vis, rels){
  const ids = vis.map(c => c.id);
  const idSet = new Set(ids);
  const parent = {};
  rels.forEach(r => { if (parent[r.to] === undefined && r.from !== r.to) parent[r.to] = r.from; });
  const children = {};
  ids.forEach(id => children[id] = []);
  ids.forEach(id => { const pa = parent[id]; if (pa !== undefined && idSet.has(pa)) children[pa].push(id); });
  const roots = ids.filter(id => parent[id] === undefined || !idSet.has(parent[id]));
  const XS = 118, YS = 150;
  let cursor = 0;
  const pos = {};
  const seen = new Set();
  function place(id, depth){
    if (seen.has(id)) return;
    seen.add(id);
    const kids = children[id];
    if (!kids.length){ pos[id] = {x: cursor * XS, y: depth * YS}; cursor++; return; }
    kids.forEach(k => place(k, depth + 1));
    const xs = kids.filter(k => pos[k]).map(k => pos[k].x);
    pos[id] = {x: xs.length ? (Math.min(...xs) + Math.max(...xs)) / 2 : (cursor++) * XS, y: depth * YS};
  }
  roots.forEach(r => { place(r, 0); cursor++; });
  ids.forEach(id => { if (!pos[id]){ pos[id] = {x: cursor * XS, y: 0}; cursor++; } });
  gDepth = {};
  ids.forEach(id => { gDepth[id] = Math.round(pos[id].y / YS) + 1; });
  return pos;
}

function fitViewTo(list){
  const wrap = document.getElementById("graph-wrap");
  const W = wrap.clientWidth, H = wrap.clientHeight;
  if (!list.length || !W) return;
  const PAD = 16;
  // 文字字級隨縮放反向變動、縮放又取決於含文字的範圍——兩者互為因果，跑兩次逼近即收斂
  let sc = 0.6, bounds = null;
  for (let pass = 0; pass < 2; pass++){
    bounds = contentBounds(list, sc);
    const w = bounds.maxX - bounds.minX + PAD * 2 || 1;
    const h = bounds.maxY - bounds.minY + PAD * 2 || 1;
    sc = Math.min(1.4, Math.max(0.18, Math.min(W / w, H / h)));
  }
  gview.s = sc;
  gview.tx = W / 2 - (bounds.minX + bounds.maxX) / 2 * sc;
  gview.ty = H / 2 - (bounds.minY + bounds.maxY) / 2 * sc;
}
function centerOn(c){
  const wrap = document.getElementById("graph-wrap");
  const pt = nodePos(c);
  if (!pt) return;
  gview.tx = wrap.clientWidth / 2 - pt.x * gview.s;
  gview.ty = wrap.clientHeight / 2 - pt.y * gview.s;
}

/* 凸包（Andrew monotone chain）：群組布塊輪廓的骨架 */
function convexHull(pts){
  if (pts.length < 3) return pts.slice();
  const p = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  const cr = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lo = [];
  for (const q of p){ while (lo.length >= 2 && cr(lo[lo.length-2], lo[lo.length-1], q) <= 0) lo.pop(); lo.push(q); }
  const up = [];
  for (let i = p.length - 1; i >= 0; i--){ const q = p[i]; while (up.length >= 2 && cr(up[up.length-2], up[up.length-1], q) <= 0) up.pop(); up.push(q); }
  lo.pop(); up.pop();
  return lo.concat(up);
}
/* 把輪廓從質心往外推 pad：節點都落在頂點上，推滿 pad 就不會被邊切到 */
function inflateHull(hull, pad){
  const n = hull.length;
  const cx = hull.reduce((s, p) => s + p.x, 0) / n, cy = hull.reduce((s, p) => s + p.y, 0) / n;
  return hull.map(p => {
    const vx = p.x - cx, vy = p.y - cy, L = Math.hypot(vx, vy) || 1;
    const j = 1 + ((Math.round(Math.abs(p.x) * 7 + Math.abs(p.y) * 13) % 21) - 10) / 110;
    return {x: p.x + vx / L * pad * j, y: p.y + vy / L * pad * j};
  });
}
/* 圓角多邊形：邊走直線、轉角用二次貝茲抹圓。
   用邊中點起筆的畫法曲線會整個往內縮，人少的群會塌成一條扭曲的帶子 */
function smoothClosedPath(pts, r){
  const n = pts.length;
  if (n < 3) return "";
  const lerp = (a, b, t) => ({x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t});
  let d = "";
  for (let i = 0; i < n; i++){
    const prev = pts[(i - 1 + n) % n], p = pts[i], next = pts[(i + 1) % n];
    const lp = Math.hypot(p.x - prev.x, p.y - prev.y) || 1;
    const ln = Math.hypot(next.x - p.x, next.y - p.y) || 1;
    const a = lerp(p, prev, Math.min(0.45, r / lp));
    const b = lerp(p, next, Math.min(0.45, r / ln));
    d += (i ? "L" : "M") + a.x.toFixed(1) + " " + a.y.toFixed(1)
       + " Q" + p.x.toFixed(1) + " " + p.y.toFixed(1) + " " + b.x.toFixed(1) + " " + b.y.toFixed(1) + " ";
  }
  return d + "Z";
}
/* 節點形狀兩種都留著，讓使用者自己挑 */
const NODE_SHAPES = {patch: "織片（方形）", round: "圓珠"};
function currentShape(){
  const k = DB && DB.settings ? DB.settings.nodeShape : null;
  return NODE_SHAPES[k] ? k : "patch";
}

/* 織片：每片布縫上去的角度都差一點，由 id 決定所以不會每次重畫都在抖 */
function patchTilt(id){
  if (currentShape() === "round") return 0;
  let h = 0; const s = String(id);
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 100000;
  return ((h % 81) - 40) / 10;
}
/* 從織片中心沿 ang 射出，打到邊界的距離（含歪斜與圓角修正）——連線端點用 */
function patchReach(half, ang, tilt){
  if (currentShape() === "round") return half;
  const a = ang - tilt * Math.PI / 180;
  const c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a));
  const mx = Math.max(c, s, 1e-6), mn = Math.min(c, s);
  return half / mx - half * 0.26 * (mn / mx) * 0.42;
}

const HULL_PAD = 58;
const NODE_HALO = 30;   // 織片外圈半徑：輪廓要包住的是布片本身，不是一個沒有大小的點
/* 群組區塊：ids、外框範圍、群名。hull 繪製與自動縮放共用同一份計算 */
function groupBlocks(vis){
  if (gMode !== "net" || vis.length < 2) return [];
  const comps = componentsOf(vis);
  const singles = comps.filter(g => g.length === 1).map(g => g[0]);
  const blocks = comps.filter(g => g.length > 1).map(ids => ({ids, island:false}));
  if (singles.length) blocks.push({ids:singles, island:true});
  if (blocks.length < 2) return [];
  return blocks.map(b => {
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    const pts = [];
    b.ids.forEach(id => {
      const c = getCustomer(id); if (!c) return;
      const pt = nodePos(c); if (!pt) return;
      for (let a = 0; a < 8; a++){
        pts.push({x: pt.x + Math.cos(a * Math.PI / 4) * NODE_HALO,
                  y: pt.y + Math.sin(a * Math.PI / 4) * NODE_HALO});
      }
      minX = Math.min(minX, pt.x); maxX = Math.max(maxX, pt.x);
      minY = Math.min(minY, pt.y); maxY = Math.max(maxY, pt.y);
    });
    if (minX > maxX) return null;
    let title;
    if (b.island) title = "未連結";
    else {
      const freq = {};
      b.ids.forEach(id => (getCustomer(id).tags || []).forEach(t => freq[t] = (freq[t] || 0) + 1));
      const top = Object.keys(freq).sort((x, y) => freq[y] - freq[x])[0];
      if (top && freq[top] >= Math.ceil(b.ids.length / 2)) title = top;
      else {
        const deg = {};
        b.ids.forEach(id => deg[id] = 0);
        DB.relations.forEach(r => { if (deg[r.from] !== undefined) deg[r.from]++; if (deg[r.to] !== undefined) deg[r.to]++; });
        const hub = b.ids.slice().sort((x, y) => deg[y] - deg[x])[0];
        title = getCustomer(hub).name + " 這群";
      }
    }
    return Object.assign({}, b, {
      pts,
      x1:minX - HULL_PAD, y1:minY - HULL_PAD, x2:maxX + HULL_PAD, y2:maxY + HULL_PAD,
      label: title + "　" + b.ids.length + " 人",
    });
  }).filter(Boolean);
}

/* 群名寬度：中文一格、半形約六成。一律當 0.78 會讓中文標題溢出方框、避讓也判不到 */
function labelWidth(s, hs){
  let w = 0;
  for (const ch of String(s)) w += /[\x00-\xff]/.test(ch) ? 0.58 : 1;
  return w * hs + hs * 0.9;
}

/* 群名方框的位置。上緣高度接近的群名會疊在一起，一行一行往上讓開 */
function groupLabelBoxes(blocks, hs){
  const out = [];
  blocks.forEach(b => {
    const w = labelWidth(b.label, hs), h = hs * 1.5;
    const x1 = (b.x1 + b.x2) / 2 - w / 2;
    let y1 = b.y1 - hs * 1.62;
    for (let k = 0; k < 6; k++){
      if (!out.some(q => x1 < q.x2 && x1 + w > q.x1 && y1 < q.y2 && y1 + h > q.y1)) break;
      y1 -= h * 1.15;
    }
    out.push({x1, y1, x2: x1 + w, y2: y1 + h, w, h});
  });
  return out;
}

function groupHullsSVG(vis){
  const blocks = groupBlocks(vis);
  if (!blocks.length) return "";
  const hs = Math.min(80, 13 / Math.max(gview.s, 0.12));
  const boxes = groupLabelBoxes(blocks, hs);
  return blocks.map((b, i) => {
    const dim = gFocus && !b.ids.includes(gFocus);
    const lb = boxes[i];
    // 凸包點不足三個（同座標重疊）畫不成塊，退回原本的圓角矩形
    const hull = inflateHull(convexHull(b.pts), HULL_PAD - NODE_HALO);
    const d = smoothClosedPath(hull, HULL_PAD * 0.8);
    const shape = d
      ? `<path d="${d}" fill="var(--accent)" fill-opacity="0.045"
        stroke="var(--accent)" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="6 5"
        stroke-linecap="round" vector-effect="non-scaling-stroke"/>`
      : `<rect x="${b.x1}" y="${b.y1}" width="${b.x2 - b.x1}" height="${b.y2 - b.y1}"
        rx="${Math.round(HULL_PAD * 0.9)}" fill="var(--accent)" fill-opacity="0.045"
        stroke="var(--accent)" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="6 5"
        stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
    return `<g class="ghull ${dim ? "dim" : ""}">
      ${shape}
      <rect x="${lb.x1.toFixed(1)}" y="${lb.y1.toFixed(1)}"
        width="${lb.w.toFixed(1)}" height="${lb.h.toFixed(1)}"
        rx="${(hs * 0.75).toFixed(1)}" fill="var(--card)" stroke="var(--accent)" stroke-opacity="0.22"
        vector-effect="non-scaling-stroke"/>
      <text class="glabel" x="${(lb.x1 + lb.w / 2).toFixed(1)}" y="${(lb.y1 + hs * 1.12).toFixed(1)}"
        text-anchor="middle" font-size="${hs.toFixed(1)}" stroke="none">${esc(b.label)}</text>
    </g>`;
  }).join("");
}

/* 內容實際範圍：含節點姓名與群名文字所佔空間（文字字級隨縮放反向變動，故需指定 s） */
function orgSubLabel(c){
  if (c.subLabel) return c.subLabel;
  const dn = downlinesOf(c.id).length, sz = orgSize(c.id), os = orgSpend(c.id);
  const bits = [`直屬 ${dn}`];
  if (sz > dn) bits.push(`線上 ${sz}`);
  if (os) bits.push(money(os).replace("NT$ ", "$"));
  return bits.join("・");
}

function contentBounds(list, sc){
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  const add = (a, b, c, d) => {
    minX = Math.min(minX, a); minY = Math.min(minY, b);
    maxX = Math.max(maxX, c); maxY = Math.max(maxY, d);
  };
  const R = 34;                       // 織片是方的，量到角比圓的半徑遠，fit 時要多留一點
  const ns = Math.min(72, 12 / Math.max(sc, 0.12));
  list.forEach(c => {
    const pt = nodePos(c); if (!pt) return;
    let halfW = Math.max(R, c.name.length * ns * 0.55);
    const hasSub = gMode === "org" || c.subLabel;
    if (hasSub){
      // 節點下方的小字（直屬／線上／業績、自己開發／轉介）比姓名長，不算進去會被切掉
      halfW = Math.max(halfW, String(orgSubLabel(c)).length * ns * 0.8 * 0.55);
    }
    add(pt.x - halfW, pt.y - R, pt.x + halfW, pt.y + R + ns * (hasSub ? 2.9 : 1.3));
  });
  const hs = Math.min(80, 13 / Math.max(sc, 0.12));
  const gbs = groupBlocks(list);
  gbs.forEach(b => add(b.x1, b.y1, b.x2, b.y2));
  groupLabelBoxes(gbs, hs).forEach(lb => add(lb.x1, lb.y1, lb.x2, lb.y2));
  return {minX, minY, maxX, maxY};
}

function renderGraph(){
  const svg = document.getElementById("graph-svg");
  const wrap = document.getElementById("graph-wrap");
  renderGraphChips();
  renderGraphLegend();
  const vis = visibleCustomers();
  if (gFocus && !vis.some(c => c.id === gFocus)){ gFocus = null; gFocusDepth = 1; }
  if (!vis.length){
    const [msg, sub] = !DB.customers.length
      ? ["還沒有人可以畫", "先到「名單」加幾位常聯絡的，這裡會自己長出來"]
      : gMode === "org" ? ["還沒有上下線關係", "到客戶詳情按「加關係」，關係種類選「上線」"]
      : gMode === "intro" ? ["還沒有介紹人關係", "記下誰介紹誰，這裡就會長出轉介鏈"]
      : ["沒有符合篩選的人", "把上面「篩選與圖例」裡的篩選點掉就會全部回來"];
    svg.innerHTML = `<text x="50%" y="45%" text-anchor="middle" fill="var(--ink-soft)" font-size="15" font-weight="600">${msg}</text>`
      + `<text x="50%" y="45%" dy="26" text-anchor="middle" fill="var(--ink-faint, #a5aab0)" font-size="12.5">${sub}</text>`;
    updateFocusBar(null);
    return;
  }
  const visSet = new Set(vis.map(c => c.id));
  let rels = DB.relations.filter(r => visSet.has(r.from) && visSet.has(r.to));
  let me = null;
  if (TREE_REL[gMode]){
    rels = rels.filter(r => r.type === TREE_REL[gMode]);
    if (vis.length){
      // 以使用者為重心：虛擬「我」節點當樹根。組織圖是沒有上線的夥伴掛在我底下；
      // 轉介鏈是沒有介紹人的人掛在我底下，一眼看得出哪些人是自己開發的
      const hasUp = new Set(rels.map(r => r.to));
      const roots = vis.filter(c => !hasUp.has(c.id));
      const isOrg = gMode === "org";
      const total = isOrg ? vis.reduce((t, c) => t + spentOf(c.id), 0) : 0;
      me = {id:"__me__", name:"我", subLabel: isOrg
        ? `直屬 ${roots.length}・線上 ${vis.length}` + (total ? "・" + money(total).replace("NT$ ", "$") : "")
        : `自己開發 ${roots.length}・轉介來的 ${vis.length - roots.length}`};
      rels = rels.concat(roots.map((c, i) => ({id:"__mer" + i, from:"__me__", to:c.id,
        type:TREE_REL[gMode], createdAt:0})));
      gIntroPos = layoutIntroTree([me].concat(vis), rels);
    } else {
      gIntroPos = layoutIntroTree(vis, rels);
    }
  } else {
    ensurePositions();
  }
  const drawList = me ? [me].concat(vis) : vis;
  const byId = {};
  drawList.forEach(c => byId[c.id] = c);
  const fset = focusSetOf(rels);
  if (!gview.inited){ fitViewTo(drawList); gview.inited = true; }

  const R = 27;
  // 連線多的人畫大一點，一眼看得出誰是核心
  const degree = {};
  rels.forEach(r => { degree[r.from] = (degree[r.from] || 0) + 1; degree[r.to] = (degree[r.to] || 0) + 1; });
  const rOf = id => R * (1 + Math.min(degree[id] || 0, 6) * 0.05);
  // 織片半邊長：跟原本的圓等面積看起來會偏大，收到 0.88 倍量體才相當
  const hOf = id => (id === "__me__" ? R * 1.12 : rOf(id)) * (currentShape() === "round" ? 1 : 0.88);
  const reachOf = (id, ang) => patchReach(hOf(id), ang, patchTilt(id));
  /* 分級呈現：縮得小就少畫字，人多就少畫層次——設計稿給的三段式降級 */
  const lod = {
    // 門檻照本專案的縮放尺度校準過：一進關係圖 fit 完通常落在 0.35 左右，
    // 直接照設計稿的 0.55／0.4 會讓預設畫面就少了標籤與人名
    labels: gview.s >= 0.3,                        // 關係說明
    names: gview.s >= 0.2,                         // 一般人的姓名（夥伴與聚焦者永遠留）
    sheen: drawList.length <= 40,                  // 珠子的高光層
    straight: drawList.length > 60,                // 連線的弧度
  };
  wrap.classList.toggle("lite", drawList.length > 40);
  const defs = `<defs>
    <filter id="nsh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" style="flood-color:var(--shadow-flood)" flood-opacity="0.26"/>
    </filter>
    <radialGradient id="gsheen" cx="34%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="nglow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" style="flood-color:var(--accent)" flood-opacity="0.5"/>
    </filter>
    ${DB.relationTypes.map(t => `<marker id="arrow-${esc(t.key)}" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="${t.color}"/></marker>
      <marker id="arrows-${esc(t.key)}" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="${t.color}"/></marker>`).join("")}
  </defs>`;

  // 佔位方框：姓名（畫在圓下方，位置可預先算）＋已放好的關係標籤。
  // 關係標籤放置時要同時閃開這兩種，否則短邊上的說明會互相壓成一團
  const ns0 = Math.min(72, 12 / Math.max(gview.s, 0.12));
  const taken = drawList.map(c => {
    const p = nodePos(c);
    const half = Math.max(hOf(c.id) * 1.42,
      String(c.name || "").length * ns0 * 0.55 + ns0 * 0.25);
    return {x1: p.x - half, x2: p.x + half,
            y1: p.y - R, y2: p.y + R + 9.5 + ns0 * ((gMode === "org" || c.subLabel) ? 2.7 : 1.2)};
  });
  // 群名標題貼在群框上緣，也是關係標籤不能壓的字
  groupLabelBoxes(groupBlocks(vis), Math.min(80, 13 / Math.max(gview.s, 0.12)))
    .forEach(lb => taken.push(lb));
  const hitsTaken = (x, y, hw, hh) => taken.some(b =>
    x + hw > b.x1 && x - hw < b.x2 && y + hh > b.y1 && y - hh < b.y2);

  const pkey = r => r.from < r.to ? r.from + "|" + r.to : r.to + "|" + r.from;
  const pairGroups = {};
  rels.forEach(r => { (pairGroups[pkey(r)] = pairGroups[pkey(r)] || []).push(r); });
  Object.values(pairGroups).forEach(g => g.sort((a, b) => a.id.localeCompare(b.id)));

  const edgeParts = rels.map(r => {
    const a = byId[r.from], b = byId[r.to];
    if (!a || !b) return null;
    const pa = nodePos(a), pb = nodePos(b);
    const t = relType(r.type);
    const dx = pb.x - pa.x, dy = pb.y - pa.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    const grp = pairGroups[pkey(r)];
    const nPair = grp.length;
    // 多重關係：起訖點沿圓周扇開＋弧高用螢幕固定距離。
    // 只鼓中段而兩端重合，看起來仍像一條粗線，所以端點也要分開
    let spread = nPair > 1 ? (grp.indexOf(r) - (nPair - 1) / 2) : 0;
    if (r.from > r.to) spread = -spread;
    const baseAng = Math.atan2(dy, dx);
    const fan = spread * 0.44;                          // 端點扇開角度（弧度）
    const a1 = baseAng + fan, a2 = baseAng + Math.PI - fan;
    // 織片是方的，端點要沿角度打在布邊上，不能再用單一半徑
    const d1 = reachOf(r.from, a1), d2 = reachOf(r.to, a2) + (t.directed ? 5 : 0);
    const x1 = pa.x + Math.cos(a1) * d1, y1 = pa.y + Math.sin(a1) * d1;
    const x2 = pb.x + Math.cos(a2) * d2, y2 = pb.y + Math.sin(a2) * d2;
    const off = (lod.straight && nPair < 2) ? 0 : spread * (30 / Math.max(gview.s, 0.12));
    const nx = -dy / d, ny = dx / d;
    const cx = (x1 + x2) / 2 + nx * off, cy = (y1 + y2) / 2 + ny * off;
    const dim = fset && !(fset.has(r.from) && fset.has(r.to));
    const ls = Math.min(60, 10.5 / Math.max(gview.s, 0.12));
    const nInPair = grp.length;

    // 標籤一律放在自己那條弧的正上方（姓名固定畫在圓下方，往上必然避開）。
    // 舊版沿線前後錯開，短邊上標籤仍落在節點旁被姓名壓住；改成沿法線依序
    // 往上疊，每條各自貼著自己的弧，彼此距離固定不重疊
    const bez = t2 => {
      const u = 1 - t2;
      return {x: u*u*x1 + 2*u*t2*cx + t2*t2*x2, y: u*u*y1 + 2*u*t2*cy + t2*t2*y2};
    };
    const lp = bez(0.5);
    const upSign = ny < 0 ? 1 : -1;                        // 法線恆指向螢幕上方
    // 純法線在「近乎垂直的線」上等於往側邊挪，剛好挪進節點姓名那一帶；
    // 混入固定的向上分量，讓這種線的標籤改成斜上方離開姓名
    let ox = nx * upSign * 0.55, oy = ny * upSign * 0.55 - 0.45;
    const on = Math.hypot(ox, oy) || 1;
    ox /= on; oy /= on;
    const px = 1 / Math.max(gview.s, 0.12);                // 1 螢幕像素 = 幾個 SVG 單位
    const maxOff = (nInPair - 1) / 2 * 30 * px;            // 最外側那條弧的鼓起量
    // 預設位置：抬到全部弧之上再留 16px。撞到姓名或別條線的說明就換位置——
    // 同一段距離先試線的上側、再試下側，一格一格往外，但最多只挪 35px：
    // 再遠標籤就飄到別群的地盤、看起來像在標別條線，那寧可不標
    const bs = 16 * px + maxOff / 2;
    const lhw = t.label.length * ls * 0.55 + ls * 0.2, lhh = ls * 0.62;
    let lx = lp.x + ox * bs, ly = lp.y + oy * bs, fit = false;
    for (const tp of [0.5, 0.62, 0.38]){          // 中點放不下就沿著自己的線前後挪
      const q = bez(tp);
      for (let k = 0; k <= 5 && !fit; k++){
        for (const dir of [1, -1]){
          const c = dir * (bs + k * 7 * px);
          const tx = q.x + ox * c, ty = q.y + oy * c;
          if (!hitsTaken(tx, ty, lhw, lhh)){ lx = tx; ly = ty; fit = true; break; }
        }
      }
      if (fit) break;
    }

    // 空間夠不夠要用「標籤實際寬度」判斷，不能只看線長門檻：
    // 舊版對多重關係開例外強制顯示，短邊上兩個標籤會互相壓、還蓋住姓名
    const labelPx = t.label.length * ls * gview.s * 0.62;   // 標籤螢幕寬度估算
    const edgePx = (d - d1 - d2) * gview.s;                  // 可見線段螢幕長度
    // 箭頭大小依「佔線長比例」決定：大箭頭約 10px、小箭頭約 6px。
    // 用絕對像素一刀切會把單一關係的短邊也連坐，方向資訊整片消失
    const arrowMark = !t.directed ? null : (edgePx > 34 ? "arrow-" : edgePx > 16 ? "arrows-" : null);
    // 標籤改走獨立圖層、又統一挪到線的上方後，短邊也不再互相壓或蓋姓名，門檻放寬
    // 從「我」拉出去的是虛擬連線，五條都標「介紹人」既吵又沒有資訊
    const virtualFromMe = String(r.id).indexOf("__mer") === 0;
    const room = lod.labels && fit && !virtualFromMe && edgePx > Math.max(24, labelPx * 0.75);
    if (room) taken.push({x1: lx - lhw, x2: lx + lhw, y1: ly - lhh, y2: ly + lhh});
    return {
      path: (() => {
        const st = RELTYPE_STITCH[t.key] || {w: 1.8};
        const common = `fill="none" stroke="${t.color}" stroke-width="${st.w}" vector-effect="non-scaling-stroke"`
          + (t.dash ? ` stroke-dasharray="${esc(t.dash)}"` : "")
          + ` stroke-linecap="round" opacity="${dim ? 0.11 : 0.92}"`;
        // 家人＝雙股平行線：同一條曲線往法向各推 ±twin 描兩筆
        if (st.twin){
          const k = st.twin;
          const off = (s) => `M${x1 + nx * k * s} ${y1 + ny * k * s} Q${cx + nx * k * s} ${cy + ny * k * s} ${x2 + nx * k * s} ${y2 + ny * k * s}`;
          return `<path class="gedge" d="${off(1)}" ${common}/><path class="gedge" d="${off(-1)}" ${common}/>`;
        }
        return `<path class="gedge" d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" ${common}`
          + (arrowMark ? ` marker-end="url(#${arrowMark}${esc(t.key)})"` : "") + `/>`;
      })(),
      label: room
        ? `<text class="elabel" x="${lx}" y="${ly + ls * 0.35}" font-size="${ls.toFixed(1)}" fill="${t.color}" opacity="${dim ? 0.12 : 1}">${esc(t.label)}</text>`
        : ""
    };
  }).filter(Boolean);
  // 線與標籤分兩層：同一組多重關係裡，後畫的線原本會蓋掉先畫那條的說明字
  const edges = edgeParts.map(e => e.path).join("");
  const edgeLabels = edgeParts.map(e => e.label).join("");

  const nodes = drawList.map(c => {
    const isMe = c.id === "__me__";
    const pt = nodePos(c);
    const wc = isMe ? "#3a3436" : warmthColor(WARMTH[c.warmth] ? c.warmth : "warm");
    const initial = isMe ? "我" : String(c.name || "").slice(0, 1);
    // 線頭珠：鐵桿實心、溫半透、冷幾乎空心只留一圈線
    const wk = WARMTH[c.warmth] ? c.warmth : "warm";
    const bead = isMe ? {fo:1, stroke:"#2b2724", sw:1.6}
      : wk === "hot" ? {fo:1, stroke:"#a8442f", sw:1.6}
      : wk === "warm" ? {fo:0.42, stroke:warmthColor("warm"), sw:1.5}
      : {fo:0.2, stroke:warmthColor("cold"), sw:1.6};
    const dim = fset && !fset.has(c.id);
    const sleep = !isMe && !dim && dormantInfo(c.id).dormant;
    const hit = !isMe && gFocus === c.id;
    // 姓名一律畫在圓下方（反向縮放，螢幕字級恆定），圓本身只當熟度色點，不再重複放字
    const ns = Math.min(72, 12 / Math.max(gview.s, 0.12));
    const hN = hOf(c.id), tilt = patchTilt(c.id);
    const TAG = currentShape() === "round" ? "circle" : "rect";
    const sq = h => TAG === "circle" ? `r="${h.toFixed(1)}"`
      : `x="${(-h).toFixed(1)}" y="${(-h).toFixed(1)}" width="${(h * 2).toFixed(1)}"`
        + ` height="${(h * 2).toFixed(1)}" rx="${(h * 0.26).toFixed(1)}" transform="rotate(${tilt})"`;
    const partner = !isMe && isPartner(c);
    const subTxt = gMode === "org" ? orgSubLabel(c) : (c.subLabel || "");
    const sub = subTxt
      ? `<text class="slabel" y="${(hN + 9.5 + ns * 2.35).toFixed(1)}" font-size="${(ns * 0.78).toFixed(1)}">${esc(subTxt)}</text>`
      : "";
    return `<g class="gnode ${dim ? "dim" : ""} ${sleep ? "sleep" : ""} ${hit ? "hit" : ""}" ${isMe ? "" : `data-nid="${esc(c.id)}"`} transform="translate(${pt.x},${pt.y})">
      ${hit ? `<${TAG} ${sq(hN + 11)} fill="none" stroke="var(--accent)" stroke-opacity="0.55"
        stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>` : ""}
      ${partner ? `<${TAG} ${sq(hN + 7.5)} fill="none" stroke="${partnerColor()}" stroke-width="1.8"
        stroke-dasharray="4.5 3.5" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity="0.95"/>` : ""}
      <${TAG} ${sq(hN)} fill="${wc}" fill-opacity="${bead.fo}" stroke="${bead.stroke}"
        stroke-width="${bead.sw}" vector-effect="non-scaling-stroke"
        ${hit ? 'filter="url(#nglow)"' : 'filter="url(#nsh)"'}/>
      ${lod.sheen ? `<${TAG} ${sq(hN)} fill="url(#gsheen)" stroke="none" pointer-events="none"/>
      <${TAG} ${sq(hN - 5.5)} fill="none" stroke="${bead.fo > 0.5 ? "#ffffff" : bead.stroke}" stroke-opacity="0.26"
        stroke-width="0.8" stroke-dasharray="1.5 3.5" stroke-linecap="round"
        vector-effect="non-scaling-stroke" pointer-events="none"/>` : ""}
      <text class="ninit" y="${(hN * 0.36).toFixed(1)}" font-size="${(hN * 0.9).toFixed(1)}"
        fill="${bead.fo > 0.5 ? readableOn(wc) : "var(--ink)"}" opacity="${bead.fo > 0.5 ? 1 : 0.72}">${esc(initial)}</text>
      ${(!isMe && (lod.names || partner || hit))
        ? `<text class="nlabel" y="${(hN + 9.5 + ns * 0.9).toFixed(1)}" font-size="${ns.toFixed(1)}">${esc(c.name)}</text>` : ""}
      ${sub}
    </g>`;
  }).join("");

  svg.innerHTML = defs + `<g id="gworld" transform="translate(${gview.tx},${gview.ty}) scale(${gview.s})">${groupHullsSVG(vis)}${edges}${nodes}${edgeLabels}</g>`;
  wrap.style.backgroundPosition = gview.tx + "px " + gview.ty + "px";
  const bs = 26 * gview.s;
  wrap.style.backgroundSize = "16px 16px, 16px 16px, " + bs + "px " + bs + "px, 100% 100%";
  updateFocusBar(fset ? gFocus : null);
}

function applyGraphTransformOnly(){

  const wrap = document.getElementById("graph-wrap");
  wrap.style.backgroundPosition = gview.tx + "px " + gview.ty + "px";
  const bs = 26 * gview.s;
  wrap.style.backgroundSize = "16px 16px, 16px 16px, " + bs + "px " + bs + "px, 100% 100%";
}

/* 手勢：單指拖背景=平移、單指拖節點=移動節點（網絡模式）、雙指=縮放、
   輕點節點=聚焦、再點同一節點=開詳情 */
(function(){
  const wrap = document.getElementById("graph-wrap");
  const pointers = new Map();
  let mode = null;
  let dragNode = null;       // 網絡模式下被拖的節點
  let downNode = null;       // 按下時壓到的節點（供輕點判斷）
  let startPt = null, moved = false;
  let pinchStart = null;

  function toWorld(x, y){
    const r = wrap.getBoundingClientRect();
    return {x: (x - r.left - gview.tx) / gview.s, y: (y - r.top - gview.ty) / gview.s};
  }

  wrap.addEventListener("pointerdown", e => {
    if (e.target.closest("#focus-bar")) return;
    wrap.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pointers.size === 2){
      mode = "pinch";
      dragNode = null; downNode = null;
      const pts = [...pointers.values()];
      pinchStart = {
        d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y),
        mid: {x:(pts[0].x + pts[1].x)/2, y:(pts[0].y + pts[1].y)/2},
        s: gview.s, tx: gview.tx, ty: gview.ty,
      };
      return;
    }
    const nodeEl = e.target.closest(".gnode");
    moved = false;
    startPt = {x:e.clientX, y:e.clientY, tx:gview.tx, ty:gview.ty};
    downNode = nodeEl ? getCustomer(nodeEl.dataset.nid) : null;
    if (downNode && gMode === "net"){
      mode = "node";
      dragNode = downNode;
    } else {
      mode = "pan";
    }
  });

  wrap.addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (mode === "pinch" && pointers.size >= 2){
      const pts = [...pointers.values()];
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const mid = {x:(pts[0].x + pts[1].x)/2, y:(pts[0].y + pts[1].y)/2};
      const ns = Math.min(3, Math.max(0.15, pinchStart.s * d / (pinchStart.d || 1)));
      const r = wrap.getBoundingClientRect();
      const wx = (pinchStart.mid.x - r.left - pinchStart.tx) / pinchStart.s;
      const wy = (pinchStart.mid.y - r.top - pinchStart.ty) / pinchStart.s;
      gview.s = ns;
      gview.tx = mid.x - r.left - wx * ns;
      gview.ty = mid.y - r.top - wy * ns;
      applyGraphTransformOnly();
      return;
    }
    if (!startPt) return;
    const dx = e.clientX - startPt.x, dy = e.clientY - startPt.y;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    if (mode === "pan"){
      gview.tx = startPt.tx + dx; gview.ty = startPt.ty + dy;
      applyGraphTransformOnly();
    } else if (mode === "node" && dragNode && moved){
      const w = toWorld(e.clientX, e.clientY);
      dragNode.pos = {x:Math.round(w.x), y:Math.round(w.y)};
      renderGraph();
    }
  });

  function up(e){
    pointers.delete(e.pointerId);
    if (mode === "pinch"){
      if (pointers.size < 2){ mode = null; pinchStart = null; renderGraph(); }
      return;
    }
    if (!moved && downNode){
      if (gFocus === downNode.id) openDetail(downNode.id);
      else { gFocus = downNode.id; gFocusDepth = 1; centerOn(downNode); renderGraph(); }
    } else if (mode === "node" && dragNode && moved){
      if (!DB.settings.dragHinted){ DB.settings.dragHinted = true; renderGraphLegend(); }
      save();
    }
    mode = null; dragNode = null; downNode = null; startPt = null;
  }
  wrap.addEventListener("pointerup", up);
  wrap.addEventListener("pointercancel", up);
})();

/* 匯出備份 */
async function exportBackup(){
  const stamp = todayStr();
  const json = JSON.stringify(DB, null, 2);
  const filename = `織網備份-${stamp}.json`;
  const file = new File([json], filename, {type:"application/json"});
  let done = false;
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try {
      await navigator.share({files:[file], title:"織網備份"});
      done = true;
    } catch(e){
      if (e && e.name === "AbortError") return false; // 使用者取消，不算備份
    }
  }
  if (!done){
    const url = URL.createObjectURL(new Blob([json], {type:"application/json"}));
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    done = true;
  }
  if (done){
    DB.lastBackupAt = new Date().toISOString();
    save();
  }
  return done;
}
document.getElementById("btn-export").addEventListener("click", async () => {
  await exportBackup();

});

document.getElementById("btn-import").addEventListener("click", () => document.getElementById("import-file").click());
document.getElementById("import-file").addEventListener("change", e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    let incoming;
    try { incoming = migrate(JSON.parse(reader.result)); }
    catch(err){ alert("這個檔案不是有效的織網備份：" + err.message); return; }
    if (!confirm(`備份內有 ${incoming.customers.length} 位客戶、${incoming.interactions.length} 筆紀錄。\n將整份取代目前資料（目前 ${DB.customers.length} 位客戶）。\n目前資料會自動暫存一份以防匯錯。確定匯入？`)) return;
    try { localStorage.setItem(KEY + "_prebak", JSON.stringify(DB)); } catch(_){}
    DB = incoming;
    const okSaved = save();
    gview.inited = false;
    const dp = incoming._dropped;
    const dpMsg = dp ? "\n\n有部分資料格式不符已略過：" +
      Object.entries(dp).filter(([, n]) => n > 0)
        .map(([k, n]) => ({customers:"客戶", relations:"關係", interactions:"互動", purchases:"購買", tasks:"待辦"}[k] + " " + n + " 筆"))
        .join("、") : "";
    alert((okSaved ? "匯入完成。" : "匯入的資料已載入畫面，但寫入裝置失敗，請立即備份。") + dpMsg);
    showView("home");
  };
  reader.readAsText(f, "utf-8");
});
