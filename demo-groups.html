<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>織網 多群組示範</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  /* 玫瑰褐 × 奶油白：低彩度暖色，不是粉紅 */
  --paper:#fffaf8; --card:#ffffff; --ink:#3d3436; --ink-soft:#7a6d6f;
  --line:#f2e9e6; --line-strong:#e0d2ce; --card-line:#ece0dc;
  --accent:#a86a72; --accent-soft:#f7ece9; --accent-wash:#fdf8f7;
  --accent-hover:#8f545c; --accent-active:#7a464e;
  --btn-line:#e0d2ce; --btn-primary:#a86a72;
  /* 夥伴用冷的藍灰，跟暖色主色明確分開，才不會跟「鐵桿」的暖紅混淆 */
  --partner:#6d7c8a;
  --hot:#b8503f; --warm:#6b5f60; --cold:#c9c2c3; --cold-fg:#ffffff;
  --hot-bg:#f9e9e5; --warm-bg:#f0ecec; --cold-bg:#f5f2f2;
  --danger:#a32b28; --danger-bg:#f9e6e4;
  --logo:#c81d1d;                       /* 沿用原本的識別色，不隨主題走 */
  --surface-sunken:#faf4f2; --surface-hover:#f5ebe8;
  --accent-lite:#c58890; --chart-lo:#d9b4b4; --chart-lo2:#eddad7;
  --shadow-rgb:60 42 40; --shadow-flood:rgb(60,42,40);
  --shadow-sm:0 1px 2px rgb(var(--shadow-rgb)/.05), 0 2px 6px rgb(var(--shadow-rgb)/.05);
  --shadow-md:0 2px 4px rgb(var(--shadow-rgb)/.06), 0 8px 20px rgb(var(--shadow-rgb)/.07);
  --r-btn:999px; --r-card:12px; --r-input:8px; --r-person:12px;
  --dot:#f0e6e3;
  --font-head:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei UI",sans-serif;
  --nav-h:58px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--font-body, -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei UI", system-ui, sans-serif);
  letter-spacing:.02em;
  font-size:16px; line-height:1.55;
  overscroll-behavior:none;
}
button{font-family:inherit;}
input,textarea,select{
  font-family:inherit; font-size:16px; color:var(--ink);
  background:#fff; border:1px solid var(--line-strong); border-radius:var(--r-input);
  padding:10px 12px; width:100%;
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent);}
label{display:block; font-size:13px; color:var(--ink-soft); margin:14px 0 4px;}

/* ===== 版面骨架 ===== */
#app{height:100%; display:flex; flex-direction:column;}
header{
  padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;
  display:flex; align-items:center; gap:9px;
  border-bottom:1px solid var(--line); background:var(--paper);
  flex:0 0 auto;
}
header .brand-mark{width:26px; height:26px; flex:0 0 auto;}
header h1{align-self:baseline;}
header .sub{align-self:baseline;}
header h1{font-size:20px; margin:0; letter-spacing:.34em; font-family:var(--font-head); font-weight:600; color:var(--ink);}
header .sub{font-size:12px; color:var(--ink-soft);}
main{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);}
.view{display:none; padding:16px;}
.view.active{display:block;}
#view-graph{padding:0; height:100%;}
#view-graph.active{display:flex; flex-direction:column;}

nav#tabbar{
  position:fixed; left:0; right:0; bottom:0;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--paper); border-top:1px solid var(--line);
  box-shadow:0 -2px 10px rgb(var(--shadow-rgb)/.05);
  display:flex; z-index:50;
}
nav#tabbar button{
  flex:1; border:0; background:none; color:var(--ink-soft);
  font-size:13px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
nav#tabbar button.on{color:var(--accent); font-weight:600;}
nav#tabbar svg{width:22px; height:22px;}

/* ===== 通用元件 ===== */
.card{background:var(--card); border:1px solid var(--card-line); border-radius:var(--r-card);
  padding:16px; margin-bottom:14px; box-shadow:var(--shadow-sm);}
.btn{
  display:inline-block; border:1px solid var(--btn-line); background:#fff; color:var(--ink);
  border-radius:var(--r-btn); padding:10px 18px; font-size:15px; cursor:pointer; font-weight:500;
}
.btn.primary{background:var(--btn-primary); border-color:var(--btn-primary); color:#fff; font-weight:600;}
.btn.danger{background:var(--danger); border-color:var(--danger); color:#fff;}
.btn.ghost{border-color:transparent; color:var(--danger);}
.btn.small{padding:5px 12px; font-size:13px; border-radius:var(--r-btn);}
.btn:active{opacity:.75;}
.row{display:flex; gap:10px; align-items:center;}
.row .grow{flex:1;}
.chip{
  display:inline-block; font-size:12px; padding:2px 10px; border-radius:99px;
  background:var(--accent-soft); color:var(--ink); margin:0 4px 4px 0; font-weight:500;
}
.chip.tag{background:#f5f5f5; color:var(--ink-soft);}
.warmth-hot{background:var(--hot-bg); color:var(--hot);}
.warmth-warm{background:var(--warm-bg); color:var(--ink);}
.warmth-cold{background:var(--cold-bg); color:var(--ink-soft);}
.muted{color:var(--ink-soft); font-size:13px;}
.empty{
  text-align:center; color:var(--ink-soft); padding:36px 20px; font-size:14px;
  border:1px dashed var(--line); border-radius:14px; background:#fffdf9;
}
h2{font-size:13px; color:var(--ink-soft); font-weight:600; margin:22px 0 8px; letter-spacing:2px;}
.banner{
  background:var(--card); color:var(--ink);
  border:1px solid var(--card-line); border-radius:var(--r-card);
  padding:12px 14px; margin-bottom:14px; font-size:14px;
  display:flex; align-items:center; gap:10px;
}
.banner .btn{flex:0 0 auto;}
.banner.danger{background:var(--danger-bg); color:var(--danger); border-color:#e6c3c0;}
.card-title{font-size:13px; color:var(--ink-soft); font-weight:700; letter-spacing:1.5px; margin:0 0 10px;}
.card-divider{border:0; border-top:1px dashed var(--card-line); margin:10px 0;}

/* 客戶列表項 */
.person{
  display:flex; align-items:flex-start; gap:12px;
  background:var(--card); border:1px solid var(--card-line); border-radius:var(--r-person);
  padding:12px; margin-bottom:8px; cursor:pointer;
}
.person .dot{
  flex:0 0 auto; width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:600; color:#fff;
}
.dot-hot{background:var(--hot);} .dot-warm{background:var(--warm);} .dot-cold{background:var(--cold); color:var(--cold-fg);}
/* 節點形狀選織片時，名單頭像、人員膠囊、圖例色點一起變方，才不會一邊圓一邊方 */
body.shape-patch .person .dot,
body.shape-patch .ppill .av,
body.shape-patch #graph-legend .swdot{border-radius:26%;}
.person{padding-top:14px;}
.person .info{flex:1; min-width:0;}
.person .name-row{display:flex; align-items:center; flex-wrap:wrap; gap:5px 6px;}
.person .name{font-weight:600;}
.person .chip.partner{background:var(--partner); color:#fff;}
.person .meta{font-size:12.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px;}
.person .side{flex:0 0 auto; align-self:center; text-align:right;}
.person .amount{font-size:12.5px; font-weight:600; color:var(--ink); white-space:nowrap;}
.person .last{font-size:11.5px; color:var(--ink-soft); white-space:nowrap; margin-top:2px;}
.person.sleep .last{color:var(--hot); font-weight:600;}
.person.sleep .dot{outline:2px dashed var(--cold); outline-offset:2px;}

/* 互動紀錄項 */
.ilog{border-left:3px solid var(--accent-soft); padding:4px 0 4px 10px; margin-bottom:10px;}
.ilog .when{font-size:12px; color:var(--ink-soft);}
.ilog .who{font-weight:600; font-size:14px; color:var(--accent);}
.ilog .txt{font-size:14px; white-space:pre-wrap;}

/* 篩選列 */
.filterbar{
  display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; -webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 28px), transparent 100%);
  mask-image:linear-gradient(to right, #000 calc(100% - 28px), transparent 100%);
}
.filterbar .fbtn{
  flex:0 0 auto; border:1px solid var(--line-strong); background:#fff; border-radius:99px;
  padding:5px 14px; font-size:13px; color:var(--ink-soft); cursor:pointer;
}
.filterbar .fbtn.on{background:var(--btn-primary); border-color:var(--btn-primary); color:#fff;}
.filterbar .fdivider{flex:0 0 1px; align-self:stretch; background:var(--line); margin:0 2px;}
.filterbar.tags{margin-top:-4px;}

/* ===== 底部彈窗 sheet ===== */
#sheet-mask{
  position:fixed; inset:0; background:rgba(50,40,30,.45); z-index:80;
  display:none;
}
#sheet-mask.show{display:block;}
#sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:90;
  background:var(--paper); border-radius:18px 18px 0 0;
  max-height:88%; display:none; flex-direction:column;
  box-shadow:0 -6px 30px rgba(0,0,0,.18);
}
#sheet.show{display:flex;}
#sheet .sheet-head{
  padding:14px 16px 8px; display:flex; align-items:center; gap:8px;
  border-bottom:1px solid var(--line); flex:0 0 auto;
}
#sheet .sheet-head .title{font-size:17px; font-weight:700; flex:1;}
#sheet .sheet-body{overflow-y:auto; padding:14px 16px calc(24px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch;}

/* ===== 關係圖 ===== */
#graph-tools{
  padding:10px 12px 6px; display:flex; gap:8px; align-items:center; flex:0 0 auto;
}
#graph-tools input{flex:1; padding:8px 12px;}
#graph-legend{
  display:flex; gap:12px; overflow-x:auto; padding:4px 12px 8px; flex:0 0 auto;
  font-size:12px; color:var(--ink-soft); -webkit-overflow-scrolling:touch;
}
#graph-legend .lg{flex:0 0 auto; display:flex; align-items:center; gap:5px; white-space:nowrap;}
#graph-legend .sw{width:26px; height:6px; flex:0 0 auto;}
#graph-legend .swdot{width:11px; height:11px; border-radius:50%;}
/* 畫布當成布：16px 的經緯織紋＋角落暖暈，再疊原本的點陣 */
#graph-wrap{
  flex:1 1 auto; position:relative; overflow:hidden; touch-action:none;
  background:
    repeating-linear-gradient(90deg, transparent 0 15px, rgb(var(--shadow-rgb)/var(--weave-a,.035)) 15px 16px),
    repeating-linear-gradient(0deg, transparent 0 15px, rgb(var(--shadow-rgb)/var(--weave-b,.028)) 15px 16px),
    radial-gradient(var(--dot) 1px, transparent 1px),
    radial-gradient(120% 80% at 50% 0%, var(--accent-wash) 0%, transparent 60%);
  background-size:16px 16px, 16px 16px, 26px 26px, 100% 100%;
}
/* 人一多就把織紋收掉，只留純色與暈邊 */
#graph-wrap.lite{--weave-a:0; --weave-b:0;}
#graph-svg{position:absolute; inset:0; width:100%; height:100%; touch-action:none;}
.gnode{cursor:pointer;}
.gnode rect, .gnode circle{stroke-width:2.5;}
.gnode.dim{opacity:.22;}
.gedge.dim{opacity:.12;}
input[type="color"].colorpick{width:46px; height:34px; padding:2px; border-radius:6px;}
.rename{text-decoration:underline dotted; text-underline-offset:3px; cursor:pointer;}
.gnode.sleep{opacity:.45;}
.gnode.sleep rect, .gnode.sleep circle{stroke:#9aa2a9; stroke-dasharray:4 3;}
#focus-bar{
  position:absolute; left:10px; right:10px; bottom:12px; display:none;
  align-items:center; gap:8px; flex-wrap:wrap;
  background:var(--card); border:1px solid var(--card-line); border-radius:12px;
  padding:10px 12px; box-shadow:0 4px 18px rgba(0,0,0,.10);
}
.ghull rect, .ghull path{pointer-events:none;}
.ghull.dim{opacity:.3;}
.glabel{
  fill:var(--ink-soft); font-weight:700; text-anchor:middle; pointer-events:none; letter-spacing:1px;
  paint-order:stroke; stroke:var(--paper); stroke-width:3.5px; stroke-linejoin:round;
}
.slabel{
  fill:var(--ink-soft); font-weight:500; text-anchor:middle; pointer-events:none;
  paint-order:stroke; stroke:var(--paper); stroke-width:3px; stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}
.nlabel{
  fill:var(--ink); font-weight:600; text-anchor:middle; pointer-events:none;
  paint-order:stroke; stroke:var(--paper); stroke-width:3.5px; stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}
.elabel{
  font-weight:600; text-anchor:middle; pointer-events:none;
  paint-order:stroke; stroke:var(--paper); stroke-width:3.5px; stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}
.ninit{text-anchor:middle; font-weight:600; pointer-events:none;}

/* ===== 手繪感主題 ===== */
body.theme-sketch .card,
body.theme-sketch .person,
body.theme-sketch .empty{border-radius:16px 13px 17px 12px / 13px 17px 12px 16px; border-width:1.5px;}
body.theme-sketch .btn{border-radius:14px 20px 15px 19px / 19px 14px 20px 15px; border-width:1.5px;}
body.theme-sketch .btn.primary{border-radius:14px 20px 15px 19px / 19px 14px 20px 15px;}
body.theme-sketch .chip,
body.theme-sketch .filterbar .fbtn,
body.theme-sketch .minitabs button,
body.theme-sketch .thm{border-radius:13px 18px 12px 17px / 17px 12px 18px 13px;}
body.theme-sketch .kpi > div{border-radius:15px 11px 16px 12px / 12px 16px 11px 15px;}
body.theme-sketch input,
body.theme-sketch textarea,
body.theme-sketch select{border-radius:11px 15px 12px 14px / 14px 12px 15px 11px; border-width:1.5px;}
body.theme-sketch h1,
body.theme-sketch .datehead .t,
body.theme-sketch .card-lead .t{letter-spacing:.06em;}
body.theme-sketch .todo-check{border-radius:50% 48% 52% 50% / 50% 52% 48% 50%; border-width:1.5px;}
.gnode.hit circle{stroke-width:2.5;}

/* ===== 首頁：今天 ===== */
.datehead{padding:2px 2px 12px;}
.datehead .d{font-size:12.5px; color:var(--ink-soft); letter-spacing:.08em; font-weight:600;}
.datehead .t{font-size:27px; font-weight:700; letter-spacing:.01em; margin-top:1px; color:var(--ink);}
.card-lead{display:flex; align-items:center; gap:9px;}
.card-lead .bar{flex:0 0 auto; width:3px; height:18px; border-radius:2px; background:var(--accent);}
.card-lead .t{font-size:17px; font-weight:700; letter-spacing:.02em;}
.todo-sub{font-size:12.5px; color:var(--ink-soft); margin:6px 0 2px 12px;}
.todo-row{display:flex; gap:11px; align-items:flex-start; padding:11px 0 11px 12px; border-bottom:1px solid var(--line);}
.todo-row:last-child{border-bottom:0; padding-bottom:2px;}
.todo-dot{flex:0 0 auto; width:9px; height:9px; border-radius:50%; margin-top:6px;}
.todo-main{flex:1 1 auto; min-width:0; cursor:pointer;}
.todo-name{font-weight:600; font-size:15px;}
.todo-why{font-size:13px; color:var(--ink-soft); margin-top:3px; line-height:1.45;}
.todo-tag{
  display:inline-block; font-size:11.5px; font-weight:600; padding:1px 8px;
  border-radius:999px; margin-left:6px; position:relative; top:-1px;
}
.todo-tag.late{background:var(--danger-bg); color:var(--danger);}
.todo-tag.today{background:var(--accent-soft); color:var(--accent-active);}
.todo-tag.soon{background:var(--surface-sunken); color:var(--ink-soft);}
.todo-check{
  flex:0 0 auto; width:34px; height:34px; border-radius:50%; padding:0;
  border:1px solid var(--line-strong); background:var(--card);
  display:flex; align-items:center; justify-content:center; color:var(--ink-soft); cursor:pointer;
}
.todo-check:active{background:var(--surface-hover); color:var(--accent);}
/* 下面接的是卡片，卡片只有 margin-bottom，這裡不補就會貼在一起 */
.qa{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin:14px 0;}
.qa button{
  display:flex; flex-direction:column; align-items:center; gap:7px; padding:12px 3px 10px;
  border:1px solid var(--card-line); border-radius:14px; background:var(--card);
  box-shadow:var(--shadow-sm); font-size:12.5px; font-weight:500; color:var(--ink); cursor:pointer;
}
.qa button .ic{
  width:34px; height:34px; border-radius:11px; background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center;
}
/* 四顆地位相當，都白底；最常用的那顆只把圖示做成實心，當視覺重心而不是選中態 */
.qa button.lead .ic{background:var(--accent); color:#fff;}
.qa button:active{transform:translateY(1px);}

/* ===== 表單：選人、選日期、選填區 ===== */
.pillpick{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; -webkit-overflow-scrolling:touch;}
.ppill{
  flex:0 0 auto; display:flex; align-items:center; gap:7px; padding:5px 13px 5px 5px;
  border:1px solid var(--card-line); border-radius:999px; background:var(--card);
  font-size:14px; color:var(--ink); cursor:pointer; white-space:nowrap;
}
.ppill .av{
  width:26px; height:26px; border-radius:50%; color:#fff; font-size:12.5px; font-weight:600;
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.ppill.on{border-color:var(--accent); background:var(--accent-soft); font-weight:600;}
.seg{display:flex; gap:8px;}
.seg button{
  flex:1 1 0; padding:9px 6px; border:1px solid var(--card-line); border-radius:var(--r-input);
  background:var(--card); font-size:14px; color:var(--ink); cursor:pointer;
}
.seg button.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-active); font-weight:600;}
details.fold{border:1px solid var(--card-line); border-radius:var(--r-input); padding:0 12px; margin-top:14px;}
details.fold > summary{
  list-style:none; cursor:pointer; padding:12px 0; font-weight:600; font-size:14.5px;
  display:flex; align-items:center; gap:8px;
}
details.fold > summary::-webkit-details-marker{display:none;}
details.fold > summary::after{content:"▾"; margin-left:auto; color:var(--ink-soft); font-size:12px;}
details.fold[open] > summary::after{content:"▴";}
details.fold > summary .muted{font-weight:400;}
details.fold > div{padding-bottom:12px;}
.catgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px;}
.catcard{
  display:flex; align-items:flex-start; gap:8px; padding:9px 10px; min-width:0;
  border:1px solid var(--card-line); border-radius:12px; background:var(--card);
  text-align:left; cursor:pointer;
}
.catcard .ci{
  flex:0 0 auto; width:30px; height:30px; border-radius:9px;
  background:var(--surface-sunken); color:var(--ink-soft);
  font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center;
}
.catcard .cm{flex:1 1 auto; min-width:0;}
.catcard .cn{
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  font-size:12.5px; font-weight:600; line-height:1.32; word-break:break-word;
}
.catcard .cp{display:block; font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
.catcard .cplus{flex:0 0 auto; width:20px; height:20px; border-radius:50%;
  border:1px solid var(--line-strong); color:var(--ink-soft); font-size:14px; line-height:18px; text-align:center;}
.catcard:active{border-color:var(--accent); background:var(--accent-wash);}
.catmore{grid-column:1 / -1; text-align:center; font-size:12.5px; color:var(--ink-soft); padding:4px 0 0;}
.minitabs{display:flex; gap:6px; margin:0 0 10px; flex-wrap:wrap;}
.minitabs button{
  padding:4px 11px; border:1px solid var(--card-line); border-radius:999px;
  background:var(--card); font-size:12px; color:var(--ink-soft); cursor:pointer;
}
.minitabs button.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-active); font-weight:600;}
.themes{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
.thm{
  display:flex; align-items:center; gap:7px; padding:6px 13px 6px 7px;
  border:1px solid var(--card-line); border-radius:999px; background:var(--card);
  font-size:13.5px; color:var(--ink); cursor:pointer;
}
.thm .sw{width:18px; height:18px; border-radius:50%; flex:0 0 auto;}
.thm.on{border-color:var(--accent); background:var(--accent-soft); font-weight:600;}
.kpi > div.tap{cursor:pointer;}
.kpi > div.tap:active{background:var(--surface-hover);}
.bars .bcol.tap{cursor:pointer;}
.bars .bcol.tap:active .bfill{filter:brightness(.94);}
details.gfold{border:0; border-top:1px solid var(--line); border-radius:0; padding:0 12px; margin:0;}
details.gfold > summary{padding:8px 0; font-size:13px; font-weight:600; color:var(--ink-soft);}
details.gfold > div{padding-bottom:4px;}
#graph-mode{padding:8px 12px 4px; margin:0;}
.hero{padding:2px 0 12px; border-bottom:1px solid var(--line); margin-bottom:12px;}
.hero .lab{font-size:12.5px; color:var(--ink-soft); letter-spacing:.06em; font-weight:600;}
.hero .val{font-size:28px; font-weight:700; letter-spacing:-.01em; margin-top:2px; font-variant-numeric:tabular-nums;}
.hero .sub{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
.grouplab{font-size:12px; font-weight:700; letter-spacing:.1em; color:var(--ink-soft); margin:2px 0 8px;}
details.detfold{border:0; border-top:1px solid var(--line); border-radius:0; padding:0; margin:0;}
details.detfold > summary{
  padding:13px 2px; font-size:15px; font-weight:600; letter-spacing:.01em;
  list-style:none; cursor:pointer; display:flex; align-items:baseline; gap:8px;
}
details.detfold > summary::-webkit-details-marker{display:none;}
details.detfold > summary .n{font-weight:400; color:var(--ink-soft); font-size:13px;}
details.detfold > summary::after{content:"▾"; margin-left:auto; color:var(--ink-soft); font-size:12px;}
details.detfold[open] > summary::after{content:"▴";}
details.detfold > div{padding:0 0 14px;}
.qcontact{display:flex; gap:10px; margin-top:12px;}
.qcontact a{
  flex:1 1 0; text-align:center; padding:11px 6px; border:1px solid var(--card-line);
  border-radius:var(--r-btn); background:var(--card); color:var(--accent);
  font-size:15px; font-weight:600; text-decoration:none;
}
.qcontact a:active{background:var(--accent-soft);}

/* ===== 業績分頁 ===== */
.cardtitle{font-weight:700; margin-bottom:8px; display:flex; align-items:baseline; gap:8px;}
.kpi{display:grid; grid-template-columns:repeat(auto-fit, minmax(82px, 1fr)); gap:9px;}
.kpi > div{background:var(--accent-soft); border-radius:12px; padding:9px 11px;}
.kpi b{display:block; font-size:17px; font-variant-numeric:tabular-nums; line-height:1.35;}
.kpi span{font-size:11.5px; color:var(--ink-soft);}
.bars{position:relative; display:flex; align-items:stretch; gap:6px; height:136px; margin:4px 0 2px;}
.bars .bcol{flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px;}
.bars .bwrap{flex:1 1 auto; width:100%; display:flex; align-items:flex-end;}
/* 過去的月份用淡青，本月用主色實心——一眼看得出哪根是這個月 */
.bars .bfill{width:100%; border-radius:6px 6px 2px 2px; background:linear-gradient(180deg,var(--chart-lo),var(--chart-lo2));}
.bars .bcol.now .bfill{background:linear-gradient(180deg,var(--accent),var(--accent-lite));}
.bars .bval, .bars .blab{font-size:11px; color:var(--ink-soft); white-space:nowrap;}
.bars .bcol.now .blab{color:var(--accent); font-weight:600;}
/* 平均線：看得出哪幾個月在水準之上 */
.bars .avgline{position:absolute; left:0; right:0; border-top:1px dashed var(--line-strong); pointer-events:none;}
/* 標籤靠右會蓋在最新月份的柱子上（本月通常最高），改靠左並用半透明底 */
.bars .avgline span{
  position:absolute; left:0; top:-14px; font-size:10px; color:var(--ink-soft);
  background:rgba(255,250,248,.9); padding:0 4px; border-radius:3px; letter-spacing:.03em;
}
.rankrow{
  display:flex; align-items:flex-start; gap:9px;
  padding:8px 0; border-bottom:1px solid var(--line);
}
.rankrow:last-child{border-bottom:0; padding-bottom:0;}
.rankrow .rno{flex:0 0 1.4em; color:var(--ink-soft); font-size:12px; padding-top:2px; font-variant-numeric:tabular-nums;}
.rankrow .rname{flex:1 1 auto; min-width:0; font-weight:600;}
.rankrow .rval{flex:0 0 auto; font-weight:600; font-variant-numeric:tabular-nums; padding-top:1px;}
.rankrow .rsub{font-size:11.5px; color:var(--ink-soft); margin-top:3px;}
.rankbar{height:6px; border-radius:99px; background:var(--surface-sunken); margin-top:6px; overflow:hidden;}
.rankbar > i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent-lite));}
.rankrow:nth-child(n+5) .rankbar > i{background:linear-gradient(90deg,var(--chart-lo),var(--chart-lo2));}
</style>

const LEGACY_WARMTH = [
  {hot:"#c81d1d", warm:"#252525", cold:"#c3c9cf"},   // 極簡黑白

function upgradeLegacyColors(){
  const s = DB.settings || (DB.settings = {});
  let changed = false;
  if (s.skin){ delete s.skin; changed = true; }          // 只剩一套配色，不再需要
  const w = s.warmthColors;
  if (w){
    ["hot", "warm", "cold"].forEach(k => {
      if (LEGACY_WARMTH.some(L => L[k] === w[k])){ delete w[k]; changed = true; }
    });
    if (!Object.keys(w).length){ delete s.warmthColors; changed = true; }
  }
  if (LEGACY_PARTNER.includes(s.partnerColor)){ delete s.partnerColor; changed = true; }
  if (changed) save();
}

/* 給定底色，回傳在它上面看得清楚的文字色 */
function readableOn(hex){
  const n = parseInt(String(hex).replace("#", ""), 16);
  if (isNaN(n)) return "#ffffff";
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 165 ? "#3a3436" : "#ffffff";
}
function applySkin(){
  const theme = currentTheme();
  const vars = THEMES[theme].vars;
  document.body.style.removeProperty("--font-body");
  Object.keys(vars).forEach(k => document.body.style.setProperty("--" + k, vars[k]));
  document.body.classList.toggle("theme-sketch", theme === "sketch");
  document.body.classList.toggle("shape-patch", currentShape() === "patch");
  ["hot", "warm", "cold"].forEach(k => {
    const custom = DB && DB.settings && DB.settings.warmthColors && DB.settings.warmthColors[k];
    if (custom) document.body.style.setProperty("--" + k, custom);
    else document.body.style.removeProperty("--" + k);
  });
  const pc = DB && DB.settings && DB.settings.partnerColor;
  if (pc) document.body.style.setProperty("--partner", pc);
  else document.body.style.removeProperty("--partner");
}

function inlineRename(el, current, onDone){
  const inp = document.createElement("input");
  inp.type = "text"; inp.value = current;
  inp.style.maxWidth = "9em"; inp.style.padding = "4px 8px"; inp.style.fontSize = "14px";
  el.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const commit = () => { if (done) return; done = true; onDone(inp.value.trim()); };
  inp.addEventListener("blur", commit);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); });
}

/* 針法：粗細也參與編碼，家人畫成雙股（同一條曲線往法向 ±2.2 各描一筆） */
const RELTYPE_STITCH = {
  upline:{w:2}, intro:{w:2}, family:{w:1.2, twin:2.2}, friend:{w:1.5}, colleague:{w:2.1}, club:{w:1.3},
};
/* 歷代預設線型：沒自訂過就跟著改版更新 */
const LEGACY_RELTYPE_DASH = {
  intro:[""], family:["9 5"], colleague:["2 5"], club:["12 4 3 4"],
};
/* 歷代預設色：使用者沒自訂過的話，載入時自動升級成上面的新色 */
const LEGACY_RELTYPE_COLORS = {
  upline:["#1f6f8b", "#0f766e"], intro:["#c81d1d"], family:["#7a6172", "#7c3aed"],
  friend:["#5c7a68", "#15803d"], colleague:["#48606e", "#b45309"], club:["#8c7a52", "#64748b"],
};
/* 曾用過的預設名稱：使用者沒自己改過的話，載入時跟著改版更新成現行預設名 */
const LEGACY_RELTYPE_LABELS = {
  club: ["同社團", "同公司"],
};
const CUSTOM_COLORS = ["#9c6b7d","#5f7a8c","#8a7a4f","#6d8a72","#8c6d8f","#a8705a"];
const CUSTOM_DASHES = ["5 4", "", "10 4", "2 4", "8 3 2 3", "6 6"];

let DB = null;

function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayStr(){
  // 固定用台北時區判定「今天」，避免裝置時區設定影響待辦、生日、沉睡天數
  try {
    return new Intl.DateTimeFormat("en-CA", {timeZone:"Asia/Taipei", year:"numeric", month:"2-digit", day:"2-digit"})
      .format(new Date());
  } catch(e){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------- 資料層 ---------- */
/* 資料結構版本。改欄位（改名、換算單位、拆表）時把 DB_VERSION 加一，
   並在 upgradeFrom 補上那一版的搬移邏輯——migrate 的逐欄驗證只能丟掉壞資料，
   救不了「格式沒錯但意思變了」的舊資料 */
const DB_VERSION = 2;
function upgradeFrom(d, from){
  // v1 → v2：欄位相容，只是把版本號真的用起來（v1 時代寫死 1 但從沒人讀）
  return d;
}
function emptyDB(){
  return {version:DB_VERSION, customers:[], relations:[], interactions:[], purchases:[], tasks:[], relationTypes:JSON.parse(JSON.stringify(DEFAULT_RELTYPES)), settings:{}, lastBackupAt:null};
}
function migrate(d){
  const base = emptyDB();
  if (!d || typeof d !== "object" || !Array.isArray(d.customers)) throw new Error("格式不正確");
  d = upgradeFrom(d, Number(d.version) || 1);

  // 匯入的 JSON 可能是手改過的：逐欄驗證，不合格的丟掉而不是讓它進資料層後炸畫面
  const isStr = v => typeof v === "string";
  const safeId = v => isStr(v) && /^[A-Za-z0-9_-]{1,64}$/.test(v);
  const isDate = v => isStr(v) && /^\d{4}-\d{2}-\d{2}$/.test(v) &&
    (() => { const t = new Date(v + "T00:00:00"); return !isNaN(t) && v === t.getFullYear() + "-" +
      String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0"); })();
  const isBirthday = v => isStr(v) && (/^\d{2}-\d{2}$/.test(v) || isDate(v));
  const isColor = v => isStr(v) && /^#[0-9a-fA-F]{6}$/.test(v);
  const num = v => { const n = Number(v); return Number.isFinite(n) ? n : null; };
  const str = v => isStr(v) ? v : "";
  const dropped = {customers:0, relations:0, interactions:0, purchases:0, tasks:0};

  const seenC = new Set();
  base.customers = d.customers.filter(c => {
    const ok = c && typeof c === "object" && safeId(c.id) && isStr(c.name) && c.name && !seenC.has(c.id);
    if (ok) seenC.add(c.id); else dropped.customers++;
    return ok;
  }).map(c => ({
    id: c.id, name: c.name,
    phone: str(c.phone), company: str(c.company), source: str(c.source),
    lineId: str(c.lineId), birthday: isBirthday(c.birthday) ? c.birthday : "",
    tags: Array.isArray(c.tags) ? c.tags.filter(isStr).slice(0, 30) : [],
    warmth: WARMTH[c.warmth] ? c.warmth : "warm",
    role: ROLES[c.role] ? c.role : "customer",
    preference: str(c.preference), note: str(c.note),
    pos: (c.pos && Number.isFinite(Number(c.pos.x)) && Number.isFinite(Number(c.pos.y)))
      ? {x:Number(c.pos.x), y:Number(c.pos.y)} : null,
    createdAt: num(c.createdAt) || Date.now(),
  }));

  const has = id => seenC.has(id);          // 外鍵檢查：指向不存在客戶的資料一律丟棄
  const seenR = new Set();
  base.relations = (Array.isArray(d.relations) ? d.relations : []).filter(r => {
    const ok = r && typeof r === "object" && safeId(r.id) && !seenR.has(r.id) &&
      has(r.from) && has(r.to) && isStr(r.type) && r.from !== r.to;
    if (ok) seenR.add(r.id); else dropped.relations++;
    return ok;
  }).map(r => ({id:r.id, from:r.from, to:r.to, type:r.type, createdAt: num(r.createdAt) || Date.now()}));

  base.interactions = (Array.isArray(d.interactions) ? d.interactions : []).filter(i => {
    const ok = i && typeof i === "object" && safeId(i.id) && has(i.customerId) && isDate(i.date) && isStr(i.text);
    if (!ok) dropped.interactions++;
    return ok;
  }).map(i => ({id:i.id, customerId:i.customerId, date:i.date, text:i.text, createdAt: num(i.createdAt) || Date.now()}));

  base.purchases = (Array.isArray(d.purchases) ? d.purchases : []).filter(x => {
    const ok = x && typeof x === "object" && safeId(x.id) && has(x.customerId) && isDate(x.date) && isStr(x.item) && x.item;
    if (!ok) dropped.purchases++;
    return ok;
  }).map(x => {
    const amt = num(x.amount), sv = num(x.sv), cy = num(x.cycle);
    const q = num(x.qty), u = num(x.unit), su = num(x.svUnit);
    return {id:x.id, customerId:x.customerId, date:x.date, item:x.item,
      kind: x.kind === "trial" ? "trial" : "buy",
      reaction: str(x.reaction),
      orderId: safeId(x.orderId) ? x.orderId : null,
      qty: (q !== null && q >= 1 && q <= 999) ? Math.round(q) : 1,
      unit: (u !== null && u >= 0) ? u : null,
      svUnit: (su !== null && su >= 0) ? su : null,
      amount: (amt !== null && amt >= 0) ? amt : null,
      sv: (sv !== null && sv >= 0) ? sv : null,
      cycle: (cy !== null && cy > 0 && cy <= 3650) ? Math.round(cy) : null,
      note: str(x.note), createdAt: num(x.createdAt) || Date.now()};
  });

  base.tasks = (Array.isArray(d.tasks) ? d.tasks : []).filter(t => {
    const ok = t && typeof t === "object" && safeId(t.id) && has(t.customerId) && isDate(t.due);
    if (!ok) dropped.tasks++;
    return ok;
  }).map(t => ({id:t.id, customerId:t.customerId, due:t.due, text: str(t.text) || "跟進",
    done: !!t.done, doneAt: num(t.doneAt) || null, createdAt: num(t.createdAt) || Date.now()}));

  const st = (d.settings && typeof d.settings === "object") ? d.settings : {};
  base.settings = {};
  if (st.warmthColors && typeof st.warmthColors === "object"){
    const wc = {};
    ["hot", "warm", "cold"].forEach(k => { if (isColor(st.warmthColors[k])) wc[k] = st.warmthColors[k]; });
    if (Object.keys(wc).length) base.settings.warmthColors = wc;
  }
  if (st.warmthLabels && typeof st.warmthLabels === "object"){
    const wl = {};
    ["hot", "warm", "cold"].forEach(k => { if (isStr(st.warmthLabels[k]) && st.warmthLabels[k]) wl[k] = st.warmthLabels[k].slice(0, 20); });
    if (Object.keys(wl).length) base.settings.warmthLabels = wl;
  }
  if (isColor(st.partnerColor)) base.settings.partnerColor = st.partnerColor;
  const dd = num(st.dormantDays);
  if (dd !== null && dd >= 1 && dd <= 365) base.settings.dormantDays = Math.round(dd);

  const types = Array.isArray(d.relationTypes) && d.relationTypes.length
    ? d.relationTypes.filter(t => t && typeof t === "object" && isStr(t.key) && t.key && isStr(t.label) && t.label)
        .map(t => {
          const def = DEFAULT_RELTYPES.find(x => x.key === t.key);
          // 還停在舊版低飽和色（沒自訂過）就升級成新配色，並補上虛線樣式
          const ld = LEGACY_RELTYPE_DASH[t.key];
          if (def && ld && ld.includes(String(t.dash || ""))) t = Object.assign({}, t, {dash: def.dash});
          const legacy = LEGACY_RELTYPE_COLORS[t.key] || [];
          const color = isColor(t.color)
            ? ((def && legacy.some(L => t.color.toLowerCase() === L.toLowerCase())) ? def.color : t.color)
            : (def ? def.color : "#888888");
          // 名稱同理：還停在舊版預設名（沒自訂過）就更新成現行預設名
          const oldLabels = LEGACY_RELTYPE_LABELS[t.key] || [];
          const label = (def && oldLabels.includes(t.label)) ? def.label : t.label.slice(0, 20);
          return {key:t.key, label, directed: !!t.directed, color,
            dash: isStr(t.dash) ? t.dash : (def ? (def.dash || "") : ""),
            builtin: !!t.builtin, tree: !!t.tree};
        })
    : JSON.parse(JSON.stringify(DEFAULT_RELTYPES));   // 深拷貝：直接引用會讓改名/改色污染全域預設
  const have = new Set(types.map(t => t.key));
  DEFAULT_RELTYPES.forEach(t => { if (!have.has(t.key)) types.push(JSON.parse(JSON.stringify(t))); });
  base.relationTypes = types;

  if (THEMES[st.theme]) base.settings.theme = st.theme;
  if (NODE_SHAPES[st.nodeShape]) base.settings.nodeShape = st.nodeShape;
  // settings 是白名單制，沒列進來的欄位每次載入都會被丟掉
  if (typeof st.seedVer === "number") base.settings.seedVer = st.seedVer;
  base.lastBackupAt = isStr(d.lastBackupAt) ? d.lastBackupAt : null;
  base._dropped = Object.values(dropped).some(n => n > 0) ? dropped : null;
  return base;
}

function loadDB(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){}
  if (!raw) return emptyDB();
  try { return migrate(JSON.parse(raw)); }
  catch(e){
    try { localStorage.setItem(KEY + "_corrupt_" + Date.now(), raw); } catch(_){}
    alert("讀取資料時發現格式異常，已把原始內容另存一份在瀏覽器裡。畫面將以空白資料開始，請盡快匯入最近的備份。");
    return emptyDB();
  }
}
function save(){
  // 回傳是否真的寫入；失敗時明講「這次修改沒有存進去」，不要讓畫面看起來成功
  let ok = false;
  // _dropped 只是匯入當下要回報「丟掉幾筆」，不是資料本身，別讓它長住在 localStorage
  try { localStorage.setItem(KEY, JSON.stringify(DB, (k, v) => k === "_dropped" ? undefined : v)); ok = true; }
  catch(e){
    alert("儲存失敗，這次的修改沒有存進裝置：" + e.message +
      "\n\n可能是儲存空間已滿或瀏覽器隱私模式。請先用「備份」把資料匯出，避免遺失。");
  }
  renderHeadStats();
  return ok;
}
function getCustomer(id){ return DB.customers.find(c => c.id === id) || null; }
function relType(key){ return DB.relationTypes.find(t => t.key === key) || {key, label:key, directed:false, color:"#999"}; }
function relationsOf(id){ return DB.relations.filter(r => r.from === id || r.to === id); }
function interactionsOf(id){
  return DB.interactions.filter(i => i.customerId === id).sort((a,b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
}
/* ===== 直銷組織：上下線樹 ===== */
function uplineOf(id){
  const r = DB.relations.find(x => x.type === "upline" && x.to === id);
  return r ? r.from : null;
}
function downlinesOf(id){
  return DB.relations.filter(x => x.type === "upline" && x.from === id).map(x => x.to);
}
function generationOf(id){
  let depth = 1, cur = id, guard = 0;
  while (guard++ < 200){
    const up = uplineOf(cur);
    if (!up) break;
    depth++; cur = up;
  }
  return depth;
}
function orgMembers(id){
  const out = [], seen = new Set([id]), stack = [id];
  while (stack.length){
    const cur = stack.pop();
    downlinesOf(cur).forEach(d => {
      if (seen.has(d)) return;      // 防呆：資料若成環不會無限迴圈
      seen.add(d); out.push(d); stack.push(d);
    });
  }
  return out;
}
function orgSize(id){ return orgMembers(id).length; }
function orgSpend(id){
  return spentOf(id) + orgMembers(id).reduce((t, x) => t + spentOf(x), 0);
}

/* ===== 跟進待辦 ===== */
function tasksOf(id){
  return DB.tasks.filter(t => t.customerId === id && !t.done)
    .sort((a, b) => a.due.localeCompare(b.due));
}
function openTasks(){
  return DB.tasks.filter(t => !t.done).sort((a, b) => a.due.localeCompare(b.due));
}
function dueTasks(){
  const today = todayStr();
  return openTasks().filter(t => t.due <= today);
}
function daysUntil(dateStr){
  const d = new Date(dateStr + "T00:00:00").getTime();
  const t = new Date(todayStr() + "T00:00:00").getTime();
  return Math.round((d - t) / 86400000);
}

/* ===== 生日 ===== */
function birthdayInDays(c, within){
  if (!c.birthday) return null;                       // 存 MM-DD 或 YYYY-MM-DD
  const md = c.birthday.length > 5 ? c.birthday.slice(5) : c.birthday;
  if (!/^\d{2}-\d{2}$/.test(md)) return null;
  const today = new Date(todayStr() + "T00:00:00");
  for (let y = 0; y <= 1; y++){
    const cand = new Date((today.getFullYear() + y) + "-" + md + "T00:00:00");
    if (isNaN(cand)) return null;
    const diff = Math.round((cand - today) / 86400000);
    if (diff >= 0) return diff <= within ? diff : null;
  }
  return null;
}

/* ===== 回購提醒 ===== */
function repurchaseDue(id){
  // 同一商品只看最新一筆購買（否則重買後，舊紀錄會因逾期越久越搶先，永遠壓著新的）
  const latest = {};
  DB.purchases.filter(x => x.customerId === id && x.cycle > 0 && !isTrial(x)).forEach(x => {
    const k = String(x.item || "");
    if (!latest[k] || x.date > latest[k].date) latest[k] = x;
  });
  let best = null;
  Object.values(latest).forEach(x => {
    const due = new Date(new Date(x.date + "T00:00:00").getTime() + x.cycle * 86400000);
    const d = Math.round((due - new Date(todayStr() + "T00:00:00")) / 86400000);
    if (d <= 7 && (!best || d < best.days)) best = {days:d, item:x.item};
  });
  return best;
}

/* 購買與體驗共用同一個 purchases 陣列，靠 kind 區分：
   "trial" 是給客戶試用的體驗品，完全不計入金額、業績與「有成交」判定 */
function isTrial(x){ return x.kind === "trial"; }
function purchasesOf(id){
  return DB.purchases.filter(x => x.customerId === id && !isTrial(x))
    .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
}
function trialsOf(id){
  return DB.purchases.filter(x => x.customerId === id && isTrial(x))
    .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
}
function spentOf(id){
  return purchasesOf(id).reduce((sum, x) => sum + (Number(x.amount) || 0), 0);
}
function money(n){
  return "NT$ " + Math.round(n).toLocaleString("en-US");
}
/* 接觸＝互動、購買、體驗三種都算；只看互動會把「上週才碰面體驗」的人誤判成失聯。
   不另外複製一份互動紀錄，避免兩邊資料不同步 */
function touchesOf(id){
  const out = DB.interactions.filter(i => i.customerId === id)
    .map(i => ({kind:"log", date:i.date, createdAt:i.createdAt, text:i.text, ref:i}));
  const seen = new Set();
  DB.purchases.filter(x => x.customerId === id).forEach(x => {
    const k = (x.orderId || x.id) + "|" + x.kind;
    if (seen.has(k)) return;
    seen.add(k);
    const sameOrder = DB.purchases.filter(y => y.customerId === id &&
      (y.orderId ? y.orderId === x.orderId : y.id === x.id) && y.kind === x.kind);
    const names = sameOrder.map(y => y.item + (y.qty > 1 ? " ×" + y.qty : "")).join("、");
    out.push({kind: isTrial(x) ? "trial" : "buy", date:x.date, createdAt:x.createdAt,
      text: names, extra: isTrial(x) ? (x.reaction || "") : ""});
  });
  return out.sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
}
function lastContact(id){
  const list = touchesOf(id);
  return list.length ? list[0].date : null;
}

/* ===== 業績分析 =====
   體驗品（kind:"trial"）一律不算業績；一張單（orderId）算一筆，客單價才不會被品項數灌水 */
const SALES_RANGES = [["6m", "近 6 個月"], ["year", "今年"], ["all", "全部"]];
let gSalesRange = "6m";
let gProdSort = "amount";    // amount｜qty｜buyers
let gProdScope = "all";      // all＝含夥伴進貨｜retail＝只算自用客戶
let gCustSort = "amount";    // amount｜orders

/* 訂單清單：KPI 點開、點某個月的柱子都用這一份 */
function ordersListHTML(rows){
  const by = {};
  rows.forEach(x => {
    const k = x.customerId + "|" + (x.orderId || x.id);
    (by[k] = by[k] || []).push(x);
  });
  const list = Object.values(by).map(items => ({
    date: items[0].date, customerId: items[0].customerId,
    amount: items.reduce((t, x) => t + (Number(x.amount) || 0), 0), items
  })).sort((a, b) => b.date.localeCompare(a.date));
  return list.map(o => {
    const c = getCustomer(o.customerId);
    return `<div class="rankrow"${c ? ` data-open="${esc(c.id)}" style="cursor:pointer;"` : ""}>
      <div class="rname">${c ? esc(c.name) : "（已刪除的客戶）"}
        <div class="rsub">${esc(o.date)}・${o.items.map(x => esc(x.item) + (x.qty > 1 ? " ×" + x.qty : "")).join("、")}</div>
      </div>
      <div class="rval">${o.amount ? shortMoney(o.amount) : "未填金額"}</div>
    </div>`;
  }).join("") || `<div class="muted">這段期間沒有紀錄。</div>`;
}
function openMonthDetail(key){
  const rows = DB.purchases.filter(x => !isTrial(x) && !fromPartner(x.customerId) && x.date.slice(0, 7) === key);
  const sum = rows.reduce((t, x) => t + (Number(x.amount) || 0), 0);
  openSheet(`${Number(key.slice(5))} 月・零售 ${shortMoney(sum)}`, ordersListHTML(rows));
}
/* 行動量四格的明細：做了什麼，不是賣了多少 */
function openActDetail(kind){
  const from = salesFrom();
  const fromTs = gSalesRange === "all" ? 0 : new Date(from + "T00:00:00").getTime();
  const label = (SALES_RANGES.find(r => r[0] === gSalesRange) || ["", ""])[1];
  const row = (name, sub, right, id) =>
    `<div class="rankrow"${id ? ` data-open="${esc(id)}" style="cursor:pointer;"` : ""}>
      <div class="rname">${esc(name)}${sub ? `<div class="rsub">${sub}</div>` : ""}</div>
      <div class="rval" style="font-weight:500; color:var(--ink-soft); font-size:12.5px;">${esc(right)}</div>
    </div>`;
  const nameOf = id => { const c = getCustomer(id); return c ? c.name : "（已刪除的客戶）"; };
  let title = "", body = "";
  if (kind === "logs"){
    const rows = DB.interactions.filter(x => x.date >= from)
      .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
    title = `${label}聯絡 ${rows.length} 次`;
    body = rows.map(x => row(nameOf(x.customerId), esc(String(x.text || "").slice(0, 50)), x.date, x.customerId)).join("");
  } else if (kind === "trials"){
    const by = {};
    DB.purchases.filter(x => isTrial(x) && x.date >= from).forEach(x => {
      const k = x.customerId + "|" + (x.orderId || x.id);
      (by[k] = by[k] || []).push(x);
    });
    const list = Object.values(by).sort((a, b) => b[0].date.localeCompare(a[0].date));
    title = `${label}給出 ${list.length} 份體驗`;
    body = list.map(items => row(nameOf(items[0].customerId),
      esc(items.map(x => x.item).join("、")) + (items[0].reaction ? "　反應：" + esc(items[0].reaction) : ""),
      items[0].date, items[0].customerId)).join("");
  } else if (kind === "new"){
    const rows = DB.customers.filter(x => (x.createdAt || 0) >= fromTs)
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    title = `${label}新增 ${rows.length} 位客戶`;
    body = rows.map(c => row(c.name, esc([c.company, c.source].filter(Boolean).join("・")),
      new Date(c.createdAt || 0).toLocaleDateString("zh-TW"), c.id)).join("");
  } else {
    const rows = DB.tasks.filter(t => t.done && (t.doneAt || 0) >= fromTs)
      .sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    title = `${label}完成 ${rows.length} 件待辦`;
    body = rows.map(t => row(nameOf(t.customerId), esc(t.text),
      new Date(t.doneAt || 0).toLocaleDateString("zh-TW"), t.customerId)).join("");
  }
  openSheet(title, body || `<div class="muted">這段期間沒有紀錄。</div>`);
}
function openKpiDetail(kind){
  const rows = salesRows().filter(x => !fromPartner(x.customerId));
  const label = (SALES_RANGES.find(r => r[0] === gSalesRange) || ["", ""])[1];
  const n = orderCount(rows);
  const sum = rows.reduce((t, x) => t + (Number(x.amount) || 0), 0);
  const title = kind === "orders" ? `${label}的 ${n} 張單`
    : kind === "avg" ? `${label}客單價 ${shortMoney(n ? sum / n : 0)}`
    : `${label}營業額 ${shortMoney(sum)}`;
  openSheet(title, ordersListHTML(rows));
}

function salesFrom(){
  const t = todayStr();
  if (gSalesRange === "all") return "0000-01-01";
  if (gSalesRange === "year") return t.slice(0, 4) + "-01-01";
  const d = new Date(t + "T00:00:00");
  d.setDate(1); d.setMonth(d.getMonth() - 5);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-01";
}
function salesRows(){
  const from = salesFrom();
  return DB.purchases.filter(x => !isTrial(x) && x.date >= from);
}
function shortMoney(n){
  n = Math.round(Number(n) || 0);
  // 百萬以下保留一位小數，否則各項加起來會跟總額差一截（20.5＋2 看起來才等於 22.5）
  if (n >= 10000) return (n / 10000).toFixed(n >= 1000000 ? 0 : 1).replace(/\.0$/, "") + " 萬";
  return n.toLocaleString("en-US");
}
function orderCount(rows){
  const s = new Set();
  rows.forEach(x => s.add(x.customerId + "|" + (x.orderId || x.id)));
  return s.size;
}
function salesMonths(){
  const now = new Date(todayStr() + "T00:00:00");
  let n = 6;
  if (gSalesRange === "year") n = now.getMonth() + 1;
  if (gSalesRange === "all"){
    const first = DB.purchases.filter(x => !isTrial(x)).map(x => x.date).sort()[0];
    if (first){
      const f = new Date(first.slice(0, 7) + "-01T00:00:00");
      n = (now.getFullYear() - f.getFullYear()) * 12 + (now.getMonth() - f.getMonth()) + 1;
      n = Math.max(1, Math.min(24, n));
    }
  }
  const out = [];
  for (let i = n - 1; i >= 0; i--){
    const m = new Date(now.getFullYear(), now.getMonth() - i, 1);
    out.push(m.getFullYear() + "-" + String(m.getMonth() + 1).padStart(2, "0"));
  }
  return out;
}
/* 夥伴（含「夥伴＋自用」）跟自己進的貨算組織那塊，不算零售業績 */
function fromPartner(id){
  const c = getCustomer(id);
  return !!(c && isPartner(c));
}
/* 直屬夥伴＝身份是夥伴、且沒有上線的人（組織圖裡直接掛在「我」底下那一層） */
function directPartners(){
  return DB.customers.filter(c => isPartner(c) && !uplineOf(c.id));
}
/* 一條線的消費＝這位夥伴自己＋他底下所有下線，範圍限定在傳進來的那批紀錄 */
function lineSpend(id, rows){
  const ids = new Set([id].concat(orgMembers(id)));
  return rows.filter(x => ids.has(x.customerId)).reduce((t, x) => t + (Number(x.amount) || 0), 0);
}

/* 每個「人＋品項」只看最新一筆，否則重買後舊紀錄會因為逾期越久越搶前面 */
function repurchaseList(){
  const latest = {};
  DB.purchases.filter(x => !isTrial(x) && x.cycle > 0).forEach(x => {
    const k = x.customerId + "|" + String(x.item || "");
    if (!latest[k] || x.date > latest[k].date) latest[k] = x;
  });
  const today = new Date(todayStr() + "T00:00:00");
  return Object.values(latest).map(x => ({
    days: Math.round((new Date(new Date(x.date + "T00:00:00").getTime() + x.cycle * 86400000) - today) / 86400000),
    item: x.item, customerId: x.customerId
  })).filter(x => x.days <= 30 && getCustomer(x.customerId)).sort((a, b) => a.days - b.days);
}

function renderSales(){
  const box = document.getElementById("sales-body");
  document.getElementById("sales-filter").innerHTML = SALES_RANGES.map(([k, label]) =>
    `<button class="fbtn ${gSalesRange === k ? "on" : ""}" data-srange="${k}">${label}</button>`).join("");

  const all = DB.purchases.filter(x => !isTrial(x));
  if (!all.length){
    box.innerHTML = `<div class="empty">還沒有購買紀錄。<br>在首頁按「記購買」記一筆，這裡就會出現業績分析。</div>`;
    return;
  }
  const hasPartner = DB.customers.some(isPartner);
  const rows = salesRows();
  const retail = rows.filter(x => !fromPartner(x.customerId));
  const sum = retail.reduce((t, x) => t + (Number(x.amount) || 0), 0);
  const sv = retail.reduce((t, x) => t + (Number(x.sv) || 0), 0);
  const orders = orderCount(retail);
  const rangeLabel = (SALES_RANGES.find(r => r[0] === gSalesRange) || ["", ""])[1];

  const kpi = `<div class="card">
    <div class="cardtitle">${esc(rangeLabel)}零售業績${hasPartner ? ` <span class="muted">只算自用客戶</span>` : ""}</div>
    <div class="kpi">
      <div class="tap" data-kpi="sum"><b>${shortMoney(sum)}</b><span>營業額</span></div>
      <div class="tap" data-kpi="orders"><b>${orders}</b><span>張單</span></div>
      <div class="tap" data-kpi="avg"><b>${shortMoney(orders ? sum / orders : 0)}</b><span>平均客單</span></div>
      ${sv ? `<div><b>${Math.round(sv).toLocaleString("en-US")}</b><span>SV</span></div>` : ""}
    </div>
    ${orders ? `<div class="muted" style="margin-top:9px;">點方塊看是哪幾單</div>` : ""}
  </div>`;

  // 業績是結果，行動量才是自己控制得了的部分
  const fromDate = salesFrom();
  const fromTs = gSalesRange === "all" ? 0 : new Date(fromDate + "T00:00:00").getTime();
  const logs = DB.interactions.filter(x => x.date >= fromDate);
  const trialRows = DB.purchases.filter(x => isTrial(x) && x.date >= fromDate);
  const newCust = DB.customers.filter(x => (x.createdAt || 0) >= fromTs);
  const doneTasks = DB.tasks.filter(t => t.done && (t.doneAt || 0) >= fromTs);
  const act = `<div class="card">
    <div class="cardtitle">這段期間的行動 <span class="muted">你控制得了的部分</span></div>
    <div class="kpi">
      <div class="tap" data-act="logs"><b>${logs.length}</b><span>次聯絡・${new Set(logs.map(x => x.customerId)).size} 人</span></div>
      <div class="tap" data-act="trials"><b>${orderCount(trialRows)}</b><span>份體驗・${new Set(trialRows.map(x => x.customerId)).size} 人</span></div>
      <div class="tap" data-act="new"><b>${newCust.length}</b><span>位新客戶</span></div>
      <div class="tap" data-act="tasks"><b>${doneTasks.length}</b><span>件待辦完成</span></div>
    </div>
    <div class="muted" style="margin-top:9px;">點方塊看做了哪些</div>
  </div>`;

  const allRetail = all.filter(x => !fromPartner(x.customerId));
  const keys = salesMonths();
  const mSum = {};
  keys.forEach(k => mSum[k] = 0);
  allRetail.forEach(x => { const k = x.date.slice(0, 7); if (k in mSum) mSum[k] += Number(x.amount) || 0; });
  const peak = Math.max(1, ...keys.map(k => mSum[k]));
  const thisKey = todayStr().slice(0, 7);
  const lastKey = keys.length > 1 ? keys[keys.length - 2] : null;
  const showVal = keys.length <= 8;
  const diff = lastKey ? mSum[thisKey] - mSum[lastKey] : 0;
  // 平均線的位置：bars 高 136，扣掉上下兩行文字後柱子區約 106px，往上再讓 18px 給月份標籤
  const avg = keys.reduce((t, k) => t + mSum[k], 0) / (keys.length || 1);
  const avgLine = (keys.length > 1 && avg > 0)
    ? `<div class="avgline" style="bottom:${Math.round(avg / peak * 106) + 18}px"><span>平均 ${shortMoney(avg)}</span></div>`
    : "";
  const trend = `<div class="card">
    <div class="cardtitle">月營業額${hasPartner ? ` <span class="muted">零售</span>` : ""}</div>
    <div class="bars">${avgLine}${keys.map(k => `<div class="bcol ${k === thisKey ? "now" : ""}${mSum[k] ? " tap" : ""}"${mSum[k] ? ` data-month="${k}"` : ""}>
        ${showVal ? `<div class="bval">${mSum[k] ? shortMoney(mSum[k]) : ""}</div>` : ""}
        <div class="bwrap"><div class="bfill" style="height:${mSum[k] ? Math.max(3, Math.round(mSum[k] / peak * 100)) : 1}%"></div></div>
        <div class="blab">${Number(k.slice(5))}月</div>
      </div>`).join("")}</div>
    ${lastKey ? `<div class="muted" style="margin-top:8px;">本月 <b>${money(mSum[thisKey])}</b>　上月 ${money(mSum[lastKey])}${
      (mSum[thisKey] || mSum[lastKey]) ? `（${diff >= 0 ? "多" : "少"} ${money(Math.abs(diff)).replace("NT$ ", "")}）` : ""}</div>` : ""}
  </div>`;

  // 產品排行預設看貨品流動（含夥伴進貨），也可以切成只看自用客戶的零售
  const prodRows = gProdScope === "retail" ? retail : rows;
  const byItem = {};
  prodRows.forEach(x => {
    const k = String(x.item || "");
    const o = byItem[k] || (byItem[k] = {item: k, amount: 0, qty: 0, buyers: new Set()});
    o.amount += Number(x.amount) || 0;
    o.qty += Number(x.qty) || 1;
    o.buyers.add(x.customerId);
  });
  const prodKey = gProdSort === "qty" ? "qty" : gProdSort === "buyers" ? "buyers" : "amount";
  const prodVal = o => prodKey === "buyers" ? o.buyers.size : o[prodKey];
  const items = Object.values(byItem).sort((a, b) => prodVal(b) - prodVal(a) || b.amount - a.amount);
  const topAmt = Math.max(1, items.length ? prodVal(items[0]) : 1);
  const prod = items.length ? `<div class="card">
    <div class="cardtitle">產品排行 <span class="muted">共 ${items.length} 項・點開看誰買的</span></div>
    <div class="minitabs">
      ${[["amount", "金額"], ["qty", "件數"], ["buyers", "幾人買"]].map(([k, t]) =>
        `<button data-psort="${k}"${gProdSort === k ? ' class="on"' : ""}>${t}</button>`).join("")}
      ${hasPartner ? `<span style="flex:0 0 1px; background:var(--line-strong); align-self:stretch; margin:3px 5px;"></span>` +
        [["all", "含夥伴進貨"], ["retail", "只看零售"]].map(([k, t]) =>
          `<button data-pscope="${k}"${gProdScope === k ? ' class="on"' : ""}>${t}</button>`).join("") : ""}
    </div>
    ${items.slice(0, 10).map((o, i) => `<div class="rankrow" data-sitem="${esc(o.item)}" style="cursor:pointer;">
      <div class="rno">${i + 1}</div>
      <div class="rname">${esc(o.item)}
        <div class="rankbar"><i style="width:${Math.max(2, Math.round(prodVal(o) / topAmt * 100))}%"></i></div>
        <div class="rsub">${o.qty} 件・${o.buyers.size} 人買${o.amount ? "" : "・未填金額"}</div>
      </div>
      <div class="rval">${prodKey === "qty" ? o.qty + " 件" : prodKey === "buyers" ? o.buyers.size + " 人" : shortMoney(o.amount)}</div>
    </div>`).join("")}
    ${items.length > 10 ? `<div class="muted" style="margin-top:10px;">只列前 10 項</div>` : ""}
  </div>` : "";

  const byCust = {}, ordersByCust = {};
  retail.forEach(x => {
    byCust[x.customerId] = (byCust[x.customerId] || 0) + (Number(x.amount) || 0);
    (ordersByCust[x.customerId] = ordersByCust[x.customerId] || new Set()).add(x.orderId || x.id);
  });
  const custs = Object.entries(byCust).map(([id, v]) => ({c: getCustomer(id), v, n: (ordersByCust[id] || new Set()).size}))
    .filter(x => x.c).sort((a, b) => gCustSort === "orders" ? (b.n - a.n || b.v - a.v) : (b.v - a.v));
  const custKeyVal = x => gCustSort === "orders" ? x.n : x.v;
  const topCust = Math.max(1, custs.length ? custKeyVal(custs[0]) : 1);
  const from = salesFrom();
  let newSum = 0, newCnt = 0;
  Object.keys(byCust).forEach(id => {
    const first = DB.purchases.filter(y => !isTrial(y) && y.customerId === id).map(y => y.date).sort()[0];
    if (first && first >= from){ newSum += byCust[id]; newCnt++; }
  });
  const newLine = (gSalesRange !== "all" && custs.length)
    ? `<div class="muted" style="margin-top:10px;">這段期間 <b>${custs.length}</b> 位客戶下單，其中 <b>${newCnt}</b> 位是第一次買（貢獻 ${money(newSum)}，佔 ${sum ? Math.round(newSum / sum * 100) : 0}%）</div>`
    : "";
  const custCard = custs.length ? `<div class="card">
    <div class="cardtitle">客戶排行${hasPartner ? ` <span class="muted">自用客戶</span>` : ""}</div>
    <div class="minitabs">
      ${[["amount", "金額"], ["orders", "單數"]].map(([k, t]) =>
        `<button data-csort="${k}"${gCustSort === k ? ' class="on"' : ""}>${t}</button>`).join("")}
    </div>
    ${custs.slice(0, 5).map((x, i) => `<div class="rankrow" data-open="${esc(x.c.id)}" style="cursor:pointer;">
      <div class="rno">${i + 1}</div>
      <div class="rname">${esc(x.c.name)}
        <div class="rankbar"><i style="width:${Math.max(2, Math.round(custKeyVal(x) / topCust * 100))}%"></i></div>
        <div class="rsub">${x.n} 單・${shortMoney(x.v)}</div>
      </div>
      <div class="rval">${gCustSort === "orders" ? x.n + " 單" : shortMoney(x.v)}</div>
    </div>`).join("")}${newLine}
  </div>` : "";

  // 組織的總量要用「線上所有人」算，不能只算夥伴身份的人，
  // 否則頂上的總額會跟底下各線加起來對不上
  const dps = directPartners();
  const lineIds = new Set();
  dps.forEach(c => { lineIds.add(c.id); orgMembers(c.id).forEach(x => lineIds.add(x)); });
  const orgRows = rows.filter(x => lineIds.has(x.customerId));
  const lines = dps.map(c => ({c, v: lineSpend(c.id, rows), n: orgSize(c.id)}))
    .sort((a, b) => b.v - a.v);
  const topLine = Math.max(1, lines.length ? lines[0].v : 1);
  const orgCard = hasPartner ? `<div class="card">
    <div class="cardtitle">組織業績 <span class="muted">你這條線跟你進的貨</span></div>
    <div class="kpi" style="margin-bottom:${lines.length ? "12px" : "0"};">
      <div><b>${shortMoney(orgRows.reduce((t, x) => t + (Number(x.amount) || 0), 0))}</b><span>組織消費</span></div>
      <div><b>${orderCount(orgRows)}</b><span>張單</span></div>
      <div><b>${new Set(orgRows.map(x => x.customerId)).size}</b><span>人下單</span></div>
    </div>
    ${lines.map((x, i) => `<div class="rankrow" data-open="${esc(x.c.id)}" style="cursor:pointer;">
      <div class="rno">${i + 1}</div>
      <div class="rname">${esc(x.c.name)}
        <div class="rankbar"><i style="width:${Math.max(2, Math.round(x.v / topLine * 100))}%"></i></div>
        <div class="rsub">${x.n ? "線上 " + x.n + " 人" : "底下還沒有下線"}</div>
      </div>
      <div class="rval">${shortMoney(x.v)}</div>
    </div>`).join("")}
    ${lines.length ? `<div class="muted" style="margin-top:10px;">每條線＝這位夥伴自己＋他底下所有下線。線上如果有自用客戶，那筆同時也算進上面的零售業績</div>` : ""}
  </div>` : "";

  const due = repurchaseList();
  const dueCard = due.length ? `<div class="card">
    <div class="cardtitle">回購與補貨 <span class="muted">依每筆設定的回購週期推算</span></div>
    ${due.slice(0, 8).map(d => {
      const c = getCustomer(d.customerId), over = d.days < 0;
      return `<div class="rankrow" data-open="${esc(c.id)}" style="cursor:pointer;">
        <div class="rname">${esc(c.name)}<div class="rsub">${esc(d.item)}</div></div>
        <div class="rval"${over ? ' style="color:var(--danger);"' : ""}>${
          over ? "逾期 " + (-d.days) + " 天" : d.days === 0 ? "就是今天" : d.days + " 天後"}</div>
      </div>`;
    }).join("")}
    ${due.length > 8 ? `<div class="muted" style="margin-top:10px;">…共 ${due.length} 筆</div>` : ""}
  </div>` : "";

  box.innerHTML = kpi + act + trend + prod + custCard + orgCard + dueCard;
}

function openSalesItem(item){
  const byC = {};
  salesRows().filter(x => String(x.item || "") === item).forEach(x => {
    const o = byC[x.customerId] || (byC[x.customerId] = {amount: 0, qty: 0, last: ""});
    o.amount += Number(x.amount) || 0;
    o.qty += Number(x.qty) || 1;
    if (x.date > o.last) o.last = x.date;
  });
  const list = Object.entries(byC).map(([id, o]) => ({c: getCustomer(id), o}))
    .filter(x => x.c).sort((a, b) => b.o.amount - a.o.amount);
  openSheet(item, list.length
    ? list.map(x => `<div class="rankrow" data-open="${esc(x.c.id)}" style="cursor:pointer;">
        <div class="rname">${esc(x.c.name)}<div class="rsub">${x.o.qty} 件・最近 ${esc(x.o.last)}</div></div>
        <div class="rval">${shortMoney(x.o.amount)}</div>
      </div>`).join("")
    : `<div class="muted">這個區間沒有紀錄。</div>`);
}

document.body.addEventListener("click", e => {
  const b = e.target.closest("[data-srange]");
  if (b){ gSalesRange = b.dataset.srange; renderSales(); return; }
  const ps = e.target.closest("[data-psort]");
  if (ps){ gProdSort = ps.dataset.psort; renderSales(); return; }
  const pc = e.target.closest("[data-pscope]");
  if (pc){ gProdScope = pc.dataset.pscope; renderSales(); return; }
  const cs = e.target.closest("[data-csort]");
  if (cs){ gCustSort = cs.dataset.csort; renderSales(); return; }
  const mo = e.target.closest("[data-month]");
  if (mo){ openMonthDetail(mo.dataset.month); return; }
  const kp = e.target.closest("[data-kpi]");
  if (kp){ openKpiDetail(kp.dataset.kpi); return; }
  const ac = e.target.closest("[data-act]");
  if (ac){ openActDetail(ac.dataset.act); return; }
  const it = e.target.closest("[data-sitem]");
  if (it) openSalesItem(it.dataset.sitem);
});

/* ---------- 導覽 ---------- */
const views = ["home","list","graph","sales","settings"];
let currentView = "home";
function showView(name){
  currentView = name;
  views.forEach(v => {
    document.getElementById("view-" + v).classList.toggle("active", v === name);
  });
  document.querySelectorAll("#tabbar button").forEach(b => b.classList.toggle("on", b.dataset.view === name));
  if (name === "home") renderHome();
  if (name === "list") renderList();
  if (name === "graph") renderGraph();
  if (name === "sales") renderSales();
  if (name === "settings") renderSettings();
  document.getElementById("main").scrollTop = 0;
}
document.querySelectorAll("#tabbar button").forEach(b => {
  b.addEventListener("click", () => showView(b.dataset.view));
});

function renderHeadStats(){
  document.getElementById("head-stats").textContent =
    DB.customers.length ? (DB.customers.length + " 位客戶") : "";
}

/* ---------- Sheet（底部彈窗） ---------- */
const sheetEl = document.getElementById("sheet");
const maskEl = document.getElementById("sheet-mask");
function openSheet(title, bodyHTML){
  document.getElementById("sheet-title").textContent = title;
  document.getElementById("sheet-body").innerHTML = bodyHTML;
  sheetEl.classList.add("show");
  maskEl.classList.add("show");
}
function refreshView(){
  if (currentView === "home") renderHome();
  else if (currentView === "list") renderList();
  else if (currentView === "graph") renderGraph();
  else if (currentView === "sales") renderSales();
  else if (currentView === "settings") renderSettings();
}
function closeSheet(){
  sheetEl.classList.remove("show");
  maskEl.classList.remove("show");
  document.getElementById("sheet-body").innerHTML = "";
  refreshView();
}
document.getElementById("sheet-close").addEventListener("click", closeSheet);
maskEl.addEventListener("click", closeSheet);
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || !sheetEl.classList.contains("show")) return;
  // 游標在輸入框裡時不關，避免表單填到一半按 Esc 全部消失
  const tag = (document.activeElement || {}).tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  closeSheet();
});

/* ---------- 共用：客戶搜尋 ---------- */
function searchCustomers(q){
  q = q.trim().toLowerCase();
  if (!q) return [];
  // 聊過什麼、買過什麼也要找得到——「誰跟我提過想減肥」才是人脈真正的內容。
  // 先掃一次互動與購買建命中集合，避免每個客戶都重掃一遍全表
  const hit = new Set();
  DB.interactions.forEach(x => { if (String(x.text || "").toLowerCase().includes(q)) hit.add(x.customerId); });
  DB.purchases.forEach(x => { if (String(x.item || "").toLowerCase().includes(q)) hit.add(x.customerId); });
  return DB.customers.filter(c => {
    const hay = [c.name, c.phone, c.company, c.source, c.note, c.preference, (c.tags||[]).join(" ")].join(" ").toLowerCase();
    return hay.includes(q) || hit.has(c.id);
  });
}
/* 命中的如果是聊天內容或品項，把那一句摘出來，否則使用者看不出為什麼這個人會被搜到 */
function searchSnippet(c, q){
  q = q.trim().toLowerCase();
  if (!q) return "";
  const line = (txt, date) => `<div class="muted" style="margin:-7px 0 10px 14px;">${txt}　<span style="opacity:.65;">${esc(date)}</span></div>`;
  const log = DB.interactions.filter(x => x.customerId === c.id && String(x.text || "").toLowerCase().includes(q))
    .sort((a, b) => b.date.localeCompare(a.date))[0];
  if (log){
    const t = String(log.text), i = t.toLowerCase().indexOf(q), s = Math.max(0, i - 12);
    return line((s ? "…" : "") + esc(t.slice(s, s + 46)) + (t.length > s + 46 ? "…" : ""), log.date);
  }
  const buy = DB.purchases.filter(x => x.customerId === c.id && String(x.item || "").toLowerCase().includes(q))
    .sort((a, b) => b.date.localeCompare(a.date))[0];
  if (buy) return line((isTrial(buy) ? "體驗過 " : "買過 ") + esc(buy.item), buy.date);
  return "";
}
function personRowHTML(c){
  const sp = spentOf(c.id);
  const dl = downlinesOf(c.id).length;
  const tagTxt = (c.tags || []).slice(0, 2).map(t => "#" + t).join(" ") +

  const meta = [c.company, tagTxt].filter(Boolean).join("・") || "尚無備註資料";
  // 一整排長得一樣時掃不出誰該理，補一行「多久沒聯絡」，太久沒動的加虛線環

    <div class="dot dot-${c.warmth}" style="color:${readableOn(warmthColor(WARMTH[c.warmth] ? c.warmth : "warm"))};">${esc(c.name.slice(0,2))}</div>
    <div class="info">
      <div class="name-row">

}

function daysSinceBackup(){
  if (!DB.lastBackupAt) return null;
  return Math.max(0, Math.floor((Date.now() - new Date(DB.lastBackupAt).getTime()) / 86400000));
}
function backupOverdue(){
  if (!DB.customers.length) return false;
  if (!DB.lastBackupAt) return true;
  return (Date.now() - new Date(DB.lastBackupAt).getTime()) > 7 * 86400 * 1000;
}

  } else {

        <span class="who">${esc(c ? c.name : "（已刪除）")}</span> <span class="when">${esc(i.date)}</span>
        ${tt.label ? `<span class="chip" style="background:${tt.color};color:#fff;margin-left:4px;">${tt.label}</span>` : ""}
        <div class="txt">${esc(i.text)}${i.extra ? "\n反應：" + esc(i.extra) : ""}</div></div>`;

function todoTag(days){
  if (days < 0) return `<span class="todo-tag late">逾期 ${-days} 天</span>`;
  if (days === 0) return `<span class="todo-tag today">今天</span>`;
  return `<span class="todo-tag soon">${days} 天後</span>`;
}
/* 一列＝一個人一件事：熟度色點、姓名、狀態、下面一行為什麼要動他 */
/* 未來要做的事（待辦／生日／該回購）。首頁的「接下來」預覽與點開後的清單共用這一份，
   兩邊各算一次遲早會對不上 */
function upcomingItems(){
  const out = [];
  openTasks().forEach(t => {
    const c = getCustomer(t.customerId);
    const d = daysUntil(t.due);
    if (!c || d <= 0) return;
    out.push({days:d, c, why:"待辦・" + esc(t.text), taskId:t.id});
  });
  DB.customers.forEach(c => {
    const bd = birthdayInDays(c, 7);
    if (bd !== null && bd > 0) out.push({days:bd, c, why:"生日・傳一句祝賀", taskId:null});
    const rp = repurchaseDue(c.id);
    if (rp && rp.days > 0) out.push({days:rp.days, c, why:"該回購・" + esc(rp.item), taskId:null});
  });
  return out.sort((a, b) => a.days - b.days || a.c.name.localeCompare(b.c.name));
}
function upcomingDayName(d){ return d === 1 ? "明天" : d === 2 ? "後天" : d + " 天後"; }

function openUpcoming(){
  const all = upcomingItems();
  const within = all.filter(x => x.days <= 7);
  const later = all.filter(x => x.days > 7);
  const byDay = arr => {
    const g = {};
    arr.forEach(x => { (g[x.days] = g[x.days] || []).push(x); });
    return Object.keys(g).map(Number).sort((a, b) => a - b)
      .map(d => `<div class="card-title" style="margin-top:14px;">${esc(upcomingDayName(d))}（${g[d].length}）</div>`
        + g[d].map(x => todoRow(x.c, x.days, x.why, x.taskId)).join("")).join("");
  };
  openSheet("接下來", within.length || later.length
    ? byDay(within) + (later.length
        ? `<div class="card-title" style="margin-top:14px;">更遠（${later.length}）</div>`
          + later.map(x => todoRow(x.c, x.days, x.why, x.taskId)).join("")
        : "")
    : `<div class="empty">接下來沒有排到的事。<br>記互動時可以順手填「下次跟進」。</div>`);
  bindTaskButtons(sheetEl, openUpcoming);
}

function todoRow(c, days, why, taskId){
  return `<div class="todo-row">
    <span class="todo-dot" style="background:${warmthColor(WARMTH[c.warmth] ? c.warmth : "warm")};"></span>
    <div class="todo-main" data-open="${esc(c.id)}">
      <div class="todo-name">${esc(c.name)}${todoTag(days)}</div>
      <div class="todo-why">${why}</div>
    </div>
    ${taskId ? `<button class="todo-check" data-donetask="${esc(taskId)}" aria-label="完成">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.2L20 7"/></svg></button>` : ""}
  </div>`;
}
function renderHomeToday(){
  const box = document.getElementById("home-today");
  const dh = document.getElementById("home-datehead");
  if (dh){
    const now = new Date(todayStr() + "T00:00:00");
    const wd = ["日", "一", "二", "三", "四", "五", "六"][now.getDay()];
    dh.innerHTML = `<div class="d">${now.getMonth() + 1} 月 ${now.getDate()} 日　週${wd}</div>
      <div class="t">今天</div>`;
  }
  if (!DB.customers.length){ box.innerHTML = ""; return; }
  const items = [];
  let late = 0, today = 0;

  dueTasks().forEach(t => {
    const c = getCustomer(t.customerId);
    if (!c) return;
    const d = daysUntil(t.due);
    if (d < 0) late++; else today++;
    items.push({sort:d < 0 ? -1 : 0, html: todoRow(c, d, "待辦・" + esc(t.text), t.id)});
  });

  // 「現在要動的」只收逾期與今天；還沒到的併進下面那行預覽，
  // 否則卡片標題說「現在」卻列著 7 天後的事
  const soon = [];
  DB.customers.forEach(c => {
    const bd = birthdayInDays(c, 7);
    if (bd !== null){
      if (bd === 0){ today++; items.push({sort:0, html: todoRow(c, 0, "生日・傳一句祝賀", null)}); }
      else soon.push(bd);
    }
    const rp = repurchaseDue(c.id);
    if (rp){
      if (rp.days < 0){ late++; items.push({sort:-1, html: todoRow(c, rp.days, "該回購・" + esc(rp.item), null)}); }
      else if (rp.days === 0){ today++; items.push({sort:0, html: todoRow(c, 0, "該回購・" + esc(rp.item), null)}); }
      else soon.push(rp.days);
    }
  });

  items.sort((a, b) => a.sort - b.sort);
  // 未來 7 天預覽：一眼看到接下來幾天的量，不用切視圖
  const upcoming = upcomingItems();
  const grouped = {};
  upcoming.filter(x => x.days <= 7).forEach(x => { grouped[x.days] = (grouped[x.days] || 0) + 1; });
  const laterCount = upcoming.filter(x => x.days > 7).length;
  const preview = Object.keys(grouped).map(Number).sort((a, b) => a - b)
    .map(d => `${upcomingDayName(d)} ${grouped[d]} 件`).join("・");
  const aheadLine = (preview || laterCount)
    ? `<hr class="card-divider"><div class="muted" id="open-upcoming" style="cursor:pointer;">接下來：${esc(preview || "7 天內沒有待辦")}` +
      (laterCount ? `　<span style="opacity:.75;">更遠還有 ${laterCount} 件</span>` : "") +
      `<span style="float:right; opacity:.6;">看是哪幾件 ›</span></div>`
    : "";

  const allCount = openTasks().length;
  const titleRow = `<div class="row" style="align-items:center;">
    <span class="card-lead grow"><span class="bar"></span><span class="t">現在要動的</span></span>
    ${allCount ? `<button class="btn small" id="open-all-tasks">全部 ${allCount}</button>` : ""}</div>`;
  const sub = (late || today)
    ? `<div class="todo-sub">${[late ? "逾期 " + late : "", today ? "今天 " + today : ""].filter(Boolean).join("・")}</div>`
    : "";
  box.innerHTML = items.length
    ? `<div class="card">${titleRow}${sub}${items.map(x => x.html).join("")}${aheadLine}</div>`
    : ((aheadLine || allCount) ? `<div class="card">${titleRow}
        <div class="muted" style="margin-top:8px;">今天沒有要動的事。</div>${aheadLine}</div>` : "");
  const allBtn = document.getElementById("open-all-tasks");
  if (allBtn) allBtn.addEventListener("click", openAllTasks);
  const upBtn = document.getElementById("open-upcoming");
  if (upBtn) upBtn.addEventListener("click", openUpcoming);

  bindTaskButtons(box, renderHome);
}

/* 待辦的完成與還原原本在首頁、全部待辦、客戶詳情各寫一份，改一處會漏兩處 */
function setTaskDone(id, done, after){
  const t = DB.tasks.find(x => x.id === id);
  if (!t) return;
  t.done = !!done;
  if (done) t.doneAt = Date.now(); else delete t.doneAt;
  save();
  if (after) after();
}
function bindTaskButtons(root, after){
  root.querySelectorAll("[data-donetask]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    setTaskDone(b.dataset.donetask, true, after);
  }));
  root.querySelectorAll("[data-undotask]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    setTaskDone(b.dataset.undotask, false, after);
  }));
}

function openAllTasks(){

      const c = getCustomer(t.customerId);

        <span class="grow" data-open="${esc(t.customerId)}" style="cursor:pointer;">
          <b>${esc(c ? c.name : "（已刪除）")}</b>　${esc(t.text)}</span>
        <button class="btn small" data-undotask="${esc(t.id)}" style="flex:0 0 auto;">還原</button></div>`;
    }).join("") : ""}

function renderHomeInsights(){
  const box = document.getElementById("home-insights");
  const dbox = document.getElementById("home-dormant");
  if (!DB.customers.length){ box.innerHTML = ""; dbox.innerHTML = ""; return; }
  const relCount = {};
  DB.customers.forEach(c => relCount[c.id] = 0);
  DB.relations.forEach(r => {
    if (relCount[r.from] !== undefined) relCount[r.from]++;
    if (relCount[r.to] !== undefined) relCount[r.to]++;
  });
  const hub = DB.customers.slice().sort((a, b) => relCount[b.id] - relCount[a.id])[0];
  const introOut = {};
  DB.relations.filter(r => r.type === "intro").forEach(r => introOut[r.from] = (introOut[r.from] || 0) + 1);
  const engineId = Object.keys(introOut).sort((a, b) => introOut[b] - introOut[a])[0];
  const engine = engineId ? getCustomer(engineId) : null;
  const islands = DB.customers.filter(c => !relCount[c.id]);
  const hotDorm = DB.customers.filter(c => c.warmth === "hot")
    .map(c => ({c, d: dormantInfo(c.id)}))
    .sort((x, y) => (y.d.days == null ? 1e9 : y.d.days) - (x.d.days == null ? 1e9 : x.d.days))[0];
  const line = (label, html) =>
    `<div class="row" style="margin-bottom:9px; align-items:baseline;"><span class="muted" style="flex:0 0 6.5em;">${label}</span><span class="grow">${html}</span></div>`;
  const nameLink = c => `<span data-open="${esc(c.id)}" style="font-weight:600; cursor:pointer;">${esc(c.name)}</span>`;
  const spender = DB.customers.map(c => ({c, v: spentOf(c.id)})).filter(x => x.v > 0)
    .sort((a, b) => b.v - a.v)[0];
  const lastBuy = DB.purchases.filter(x => !isTrial(x))
    .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt)[0];
  const noBuy = DB.customers.filter(c => c.warmth === "hot" && !purchasesOf(c.id).length);
  // 直銷組織相關
  const partners = DB.customers.filter(isPartner);
  const thisMonth = todayStr().slice(0, 7);
  const newPartners = partners.filter(c => {
    const d = new Date(c.createdAt || 0);
    const ym = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    return ym === thisMonth;
  });
  const stalled = partners.filter(c => !downlinesOf(c.id).length);
  const topOrg = partners.map(c => ({c, v: orgSize(c.id)})).filter(x => x.v > 0)
    .sort((a, b) => b.v - a.v)[0];
  const orgRows = partners.length ? [
    line("組織規模", `<b>${partners.length}</b> 位夥伴` +
      (topOrg ? `　最大線 ${nameLink(topOrg.c)}（${topOrg.v} 人）` : "")),
    newPartners.length ? line("本月新夥伴", newPartners.slice(0, 3).map(nameLink).join("、") +
      (newPartners.length > 3 ? ` <span class="muted">…共 ${newPartners.length} 位</span>` : "")) : "",
    stalled.length ? line("斷層夥伴", stalled.slice(0, 3).map(nameLink).join("、") +
      (stalled.length > 3 ? ` <span class="muted">…共 ${stalled.length} 位</span>` : "") +
      ` <span class="muted">底下還沒有下線</span>`) : "",
  ].filter(Boolean) : [];

  const ym = todayStr().slice(0, 7);
  const prevD = new Date(new Date(todayStr() + "T00:00:00").getTime() - 15 * 86400000);
  const prevYm = new Date(prevD.getFullYear(), prevD.getMonth() - (todayStr().slice(8) >= "16" ? 1 : 0), 1);
  const lastYm = (() => { const d = new Date(todayStr() + "T00:00:00"); d.setDate(1); d.setMonth(d.getMonth() - 1);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); })();
  const sumOf = key => DB.purchases.filter(x => !isTrial(x) && x.date.slice(0, 7) === key)
    .reduce((t, x) => t + (Number(x.amount) || 0), 0);
  const cntOf = key => DB.purchases.filter(x => !isTrial(x) && x.date.slice(0, 7) === key).length;
  const thisSum = sumOf(ym), lastSum = sumOf(lastYm);
  const svOf = key => DB.purchases.filter(x => !isTrial(x) && x.date.slice(0, 7) === key)
    .reduce((t, x) => t + (Number(x.sv) || 0), 0);
  const thisSv = svOf(ym);
  // 本月業績是這張卡最該一眼看到的數字，抽出來當大字，不跟其他十幾行擠在一起
  const monthRow = (thisSum || lastSum || cntOf(ym))
    ? `<div class="hero">
        <div class="lab">本月業績</div>
        <div class="val">${money(thisSum)}</div>
        <div class="sub">${cntOf(ym)} 筆${thisSv ? "・SV " + Math.round(thisSv) : ""}${
          lastSum ? `　上月 ${money(lastSum)}（${thisSum >= lastSum ? "多" : "少"} ${money(Math.abs(thisSum - lastSum)).replace("NT$ ", "")}）` : ""}</div>
      </div>`
    : "";

  // 上半段＝業績與組織，下半段＝客戶洞察，兩組各自組裝（別再用位移量切，會錯位）
  const topRows = [monthRow, ...orgRows].filter(Boolean);
  const bottomRows = [
    spender ? line("消費最高", nameLink(spender.c) + ` <span class="muted">累計 ${money(spender.v)}</span>`) : "",
    lastBuy && getCustomer(lastBuy.customerId) ? line("最近成交", nameLink(getCustomer(lastBuy.customerId)) + ` <span class="muted">${esc(lastBuy.item)}・${esc(lastBuy.date)}</span>`) : "",
    (() => {
      const tried = DB.customers.filter(c => trialsOf(c.id).length);
      const notYet = tried.filter(c => !purchasesOf(c.id).length);
      if (!tried.length) return "";
      const rate = Math.round((tried.length - notYet.length) / tried.length * 100);
      return notYet.length
        ? line("體驗未成交", notYet.slice(0, 3).map(nameLink).join("、") +
            (notYet.length > 3 ? ` <span class="muted">…共 ${notYet.length} 位</span>` : "") +
            ` <span class="muted">轉換率 ${rate}%</span>`)
        : line("體驗轉換", `<b>${tried.length}</b> 位體驗過　<span class="muted">全部都已成交</span>`);
    })(),
    noBuy.length ? line("熟但沒成交", noBuy.slice(0, 3).map(nameLink).join("、") + (noBuy.length > 3 ? ` <span class="muted">…共 ${noBuy.length} 位</span>` : "")) : "",
    hub && relCount[hub.id] ? line("樞紐人物", nameLink(hub) + ` <span class="muted">${relCount[hub.id]} 條連結</span>`) : "",
    engine ? line("轉介發動機", nameLink(engine) + ` <span class="muted">介紹了 ${introOut[engine.id]} 人</span>`) : "",
    islands.length ? line("孤島客戶", islands.slice(0, 3).map(nameLink).join("、") + (islands.length > 3 ? ` <span class="muted">…共 ${islands.length} 位</span>` : "")) : "",
    hotDorm && hotDorm.d.dormant ? line("該回溫的" + esc(warmthLabel("hot")), nameLink(hotDorm.c) + ` <span class="muted">${hotDorm.d.days == null ? "從未往來" : hotDorm.d.days + " 天沒聯絡"}</span>`) : "",
  ].filter(Boolean);
  // monthRow 是整塊 hero，orgRows 才是條列，兩者分開放才不會混在同一組小標下
  const orgOnly = topRows.filter(x => x !== monthRow);
  const divider = orgOnly.length && bottomRows.length ? '<hr class="card-divider">' : "";
  box.innerHTML = (topRows.length || bottomRows.length)
    ? `<div class="card">
        <div class="card-lead" style="margin-bottom:12px;"><span class="bar"></span><span class="t">網絡洞察</span></div>
        ${monthRow}
        ${orgOnly.length ? `<div class="grouplab">組織</div>${orgOnly.join("")}` : ""}
        ${divider}
        ${bottomRows.length ? `<div class="grouplab">客戶</div>${bottomRows.join("")}` : ""}
      </div>` : "";

  const dorm = DB.customers.map(c => ({c, d: dormantInfo(c.id)})).filter(x => x.d.dormant)
    .sort((x, y) => (y.d.days == null ? 1e9 : y.d.days) - (x.d.days == null ? 1e9 : x.d.days));
  dbox.innerHTML = dorm.length
    ? `<div class="card"><div class="card-title">該聯絡了（超過 ${dormantLimit()} 天，共 ${dorm.length} 位）</div>` +
      dorm.slice(0, 5).map(x => `<div class="row" style="margin-bottom:9px;">
        <span class="grow" data-open="${esc(x.c.id)}" style="cursor:pointer;"><b>${esc(x.c.name)}</b>
          <span class="chip warmth-${x.c.warmth}" style="margin:0 0 0 4px;">${esc(warmthLabel(x.c.warmth))}</span></span>
        <span class="muted">${x.d.days == null ? "從未往來" : x.d.days + " 天"}</span></div>`).join("") + `</div>`
    : "";
}

  else if (listWarmth === "_nobuy") list = list.filter(c => !purchasesOf(c.id).length);
  else if (listWarmth !== "all") list = list.filter(c => c.warmth === listWarmth);

        : "還沒有任何人。<br>先加幾位常聯絡的，關係圖與業績會自己長出來。<br><br>按下面的「新增客戶」開始。"}</div>`;
