    + `${DB.purchases.length} 筆購買（累計 ${money(DB.purchases.reduce((t, x) => t + (Number(x.amount) || 0), 0))}）`;

  const rl = document.getElementById("reltype-list");
  rl.innerHTML = DB.relationTypes.map(t => {
    const used = DB.relations.filter(r => r.type === t.key).length;
    return `<div class="row" style="margin-bottom:6px;">
      <input type="color" class="colorpick" data-ctype="${esc(t.key)}" value="${esc(t.color)}" style="width:34px;height:26px;">
      <span class="grow"><span class="rename" data-rename="${esc(t.key)}">${esc(t.label)}</span>${t.directed ? "（有方向）" : ""} <span class="muted">${used ? used + " 條" : ""}</span></span>
      ${t.builtin ? "" : `<button class="btn small" data-deltype="${esc(t.key)}" ${used ? "disabled" : ""}>${used ? "使用中" : "刪"}</button>`}
    </div>`;
  }).join("");
  rl.querySelectorAll("[data-deltype]").forEach(b => b.addEventListener("click", () => {
    DB.relationTypes = DB.relationTypes.filter(t => t.key !== b.dataset.deltype);
    save(); renderSettings();
  }));
  rl.querySelectorAll("[data-ctype]").forEach(inp => inp.addEventListener("change", () => {
    const t = DB.relationTypes.find(x => x.key === inp.dataset.ctype);
    if (t){ t.color = inp.value; save(); }
  }));
  rl.querySelectorAll("[data-rename]").forEach(sp => sp.addEventListener("click", () => {
    const t = DB.relationTypes.find(x => x.key === sp.dataset.rename);
    if (!t) return;
    inlineRename(sp, t.label, v => {
      if (v && v !== t.label){
        if (DB.relationTypes.some(x => x.label === v)) alert("已經有同名的種類了。");
        else { t.label = v; save(); }
      }
      renderSettings();
    });
  }));

  document.getElementById("warmth-row").innerHTML =
    ["hot", "warm", "cold"].map(k =>
      `<span class="muted rename" data-wname="${k}">${esc(warmthLabel(k))}</span>` +
      `<input type="color" class="colorpick" id="wc-${k}" value="${warmthColor(k)}">`).join("") +
    `<span class="grow"></span><button class="btn small" id="wc-reset">恢復預設</button>`;

  const skinSel = document.getElementById("skin-select");
  skinSel.value = currentSkin();
  skinSel.onchange = () => {
    DB.settings.skin = skinSel.value;
    save(); applySkin(); renderSettings();
  };
  ["hot", "warm", "cold"].forEach(k => {
    const inp = document.getElementById("wc-" + k);
    inp.value = warmthColor(k);
    inp.onchange = () => {
      DB.settings.warmthColors = Object.assign({}, DB.settings.warmthColors, {[k]: inp.value});
      save(); applySkin(); renderSettings();
    };
  });
  document.getElementById("wc-reset").onclick = () => {
    delete DB.settings.warmthColors;
    delete DB.settings.warmthLabels;
    save(); applySkin(); renderSettings();
  };
  document.getElementById("catalog-info").innerHTML =
    `內建 ${CATALOG.length} 項 Nu Skin 台灣公開售價（抓取日 ${CATALOG_DATE}），記購買時可直接選、自動帶入售價與 SV。` +
    `<br>這是抓取當下的快照，促銷價會變動，實際金額請以官網或訂單為準；金額與 SV 都可以手動改。`;

  // 匯入前自動暫存的資料：提供實際的還原入口（只寫不讀等於沒有救援）
  const prebakRow = document.getElementById("prebak-row");
  let prebak = null;
  try { prebak = localStorage.getItem(KEY + "_prebak"); } catch(e){}
  if (prebak){
    let info = "";
    try { const d = JSON.parse(prebak); info = `${(d.customers || []).length} 位客戶`; } catch(e){ info = "內容無法解析"; }
    prebakRow.innerHTML = `<div class="muted" style="margin-top:10px;">上次匯入前自動暫存了一份資料（${esc(info)}）。</div>
      <button class="btn" id="prebak-restore" style="width:100%; margin-top:8px;">還原匯入前的資料</button>`;
    document.getElementById("prebak-restore").onclick = () => {
      let incoming;
      try { incoming = migrate(JSON.parse(prebak)); }
      catch(err){ alert("暫存資料無法解析：" + err.message); return; }
      if (!confirm(`將還原成匯入前的資料（${incoming.customers.length} 位客戶），\n目前的資料會被取代。確定？`)) return;
      try { localStorage.setItem(KEY + "_prebak2", JSON.stringify(DB)); } catch(e){}
      DB = incoming;
      save(); gview.inited = false;
      alert("已還原。");
      showView("home");
    };
  } else prebakRow.innerHTML = "";

  const pcInp = document.getElementById("pc-color");
  pcInp.value = partnerColor();
  pcInp.onchange = () => {
    DB.settings.partnerColor = pcInp.value;
    save(); applySkin();
  };
  document.getElementById("pc-reset").onclick = () => {
    delete DB.settings.partnerColor;
    save(); applySkin(); renderSettings();
  };
  document.querySelectorAll("[data-wname]").forEach(sp => {
    const k = sp.dataset.wname;
    sp.textContent = warmthLabel(k);
    sp.onclick = () => inlineRename(sp, warmthLabel(k), v => {
      if (v) DB.settings.warmthLabels = Object.assign({}, DB.settings.warmthLabels, {[k]: v});
      save(); renderSettings();
    });
  });
  const dd = document.getElementById("dormant-days");
  dd.value = dormantLimit();
  dd.onchange = () => {
    const v = parseInt(dd.value, 10);
    DB.settings.dormantDays = (v >= 1 && v <= 365) ? v : 30;
    save(); renderSettings();
  };
}
document.getElementById("btn-add-reltype").addEventListener("click", () => {

  const directed = document.getElementById("new-reltype-directed").checked;

  DB.relationTypes.push({key:uid("t"), label, directed, color, dash, builtin:false});

});

/* 匯出備份 */
document.getElementById("btn-export").addEventListener("click", async () => {
  const stamp = todayStr();
  const json = JSON.stringify(DB, null, 2);
  const filename = `織網備份-${stamp}.json`;
  const file = new File([json], filename, {type:"application/json"});
  let done = false;
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try {
      await navigator.share({files:[file], title:"織網備份"});
      done = true;
    } catch(e){
      if (e && e.name === "AbortError") return; // 使用者取消，不算備份
    }
  }
  if (!done){
    const url = URL.createObjectURL(new Blob([json], {type:"application/json"}));
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    done = true;
  }
  if (done){
    DB.lastBackupAt = new Date().toISOString();
    save(); renderSettings();
  }
});

document.getElementById("btn-import").addEventListener("click", () => document.getElementById("import-file").click());
document.getElementById("import-file").addEventListener("change", e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    let incoming;
    try { incoming = migrate(JSON.parse(reader.result)); }
    catch(err){ alert("這個檔案不是有效的織網備份：" + err.message); return; }
    if (!confirm(`備份內有 ${incoming.customers.length} 位客戶、${incoming.interactions.length} 筆紀錄。\n將整份取代目前資料（目前 ${DB.customers.length} 位客戶）。\n目前資料會自動暫存一份以防匯錯。確定匯入？`)) return;
    try { localStorage.setItem(KEY + "_prebak", JSON.stringify(DB)); } catch(_){}
    DB = incoming;
    const okSaved = save();
    gview.inited = false;
    const dp = incoming._dropped;
    const dpMsg = dp ? "\n\n有部分資料格式不符已略過：" +
      Object.entries(dp).filter(([, n]) => n > 0)
        .map(([k, n]) => ({customers:"客戶", relations:"關係", interactions:"互動", purchases:"購買", tasks:"待辦"}[k] + " " + n + " 筆"))
        .join("、") : "";
    alert((okSaved ? "匯入完成。" : "匯入的資料已載入畫面，但寫入裝置失敗，請立即備份。") + dpMsg);
    showView("home");
  };
  reader.readAsText(f, "utf-8");
});
