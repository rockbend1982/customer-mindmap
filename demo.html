<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta charset="utf-8">
<title>織網 DEMO（假資料）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#ffffff; --card:#ffffff; --ink:#252525; --ink-soft:#6c757d;
  --line:#e9e9e9; --line-strong:#d9d9d9; --card-line:#ececec;
  --accent:#252525; --brand-red:#c81d1d; --accent-soft:#ededed;
  --btn-line:#252525; --btn-primary:#212121; --partner:#1f6f8b;
  --hot:#c81d1d; --warm:#252525; --cold:#c3c9cf; --cold-fg:#252525;
  --hot-bg:#f9e4e4; --warm-bg:#ededed; --cold-bg:#f2f4f5;
  --danger:#a80b0b; --danger-bg:#faeaea;
  --r-btn:999px; --r-card:0; --r-input:0; --r-person:0;
  --dot:#ececec; --font-head:"Lora","Songti TC","Noto Serif TC",serif;
  --nav-h:58px;
}
body.skin-paper{
  --paper:#faf6f0; --card:#ffffff; --ink:#3a3128; --ink-soft:#6f6457;
  --line:#e7ddd0; --line-strong:#e7ddd0; --card-line:#e7ddd0;
  --accent:#c2571a; --brand-red:#c2571a; --accent-soft:#f4e3d5;
  --btn-line:#e7ddd0; --btn-primary:#c2571a; --partner:#1f6f8b;
  --hot:#c2571a; --warm:#d99a2b; --cold:#7d8b99; --cold-fg:#ffffff;
  --hot-bg:#f7e2d3; --warm-bg:#f8ecd2; --cold-bg:#e5eaef;
  --danger:#b3372f; --danger-bg:#f6e0de;
  --r-btn:10px; --r-card:14px; --r-input:10px; --r-person:12px;
  --dot:#eee4d6; --font-head:"PingFang TC","Microsoft JhengHei UI",sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Inter","PingFang TC","Microsoft JhengHei UI","Noto Sans CJK TC",system-ui,sans-serif;
  font-size:16px; line-height:1.55;
  overscroll-behavior:none;
}
.serif{font-family:"Lora","Songti TC","Noto Serif TC",serif;}
button{font-family:inherit;}
input,textarea,select{
  font-family:inherit; font-size:16px; color:var(--ink);
  background:#fff; border:1px solid var(--line-strong); border-radius:var(--r-input);
  padding:10px 12px; width:100%;
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent);}
label{display:block; font-size:13px; color:var(--ink-soft); margin:14px 0 4px;}

/* ===== 版面骨架 ===== */
#app{height:100%; display:flex; flex-direction:column;}
header{
  padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;
  display:flex; align-items:center; gap:9px;
  border-bottom:1px solid var(--line); background:var(--paper);
  flex:0 0 auto;
}
header .brand-mark{width:26px; height:26px; flex:0 0 auto;}
header h1{align-self:baseline;}
header .sub{align-self:baseline;}
header h1{font-size:21px; margin:0; letter-spacing:3px; font-family:var(--font-head); font-weight:500;}
header .sub{font-size:12px; color:var(--ink-soft);}
main{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);}
.view{display:none; padding:16px;}
.view.active{display:block;}
#view-graph{padding:0; height:100%;}
#view-graph.active{display:flex; flex-direction:column;}

nav#tabbar{
  position:fixed; left:0; right:0; bottom:0;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:#fffdf9; border-top:1px solid var(--line);
  display:flex; z-index:50;
}
nav#tabbar button{
  flex:1; border:0; background:none; color:var(--ink-soft);
  font-size:13px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
nav#tabbar button.on{color:var(--accent); font-weight:600;}
nav#tabbar svg{width:22px; height:22px;}

/* ===== 通用元件 ===== */
.card{background:var(--card); border:1px solid var(--card-line); border-radius:var(--r-card); padding:16px; margin-bottom:14px;}
.btn{
  display:inline-block; border:1px solid var(--btn-line); background:#fff; color:var(--ink);
  border-radius:var(--r-btn); padding:10px 18px; font-size:15px; cursor:pointer; font-weight:500;
}
.btn.primary{background:var(--btn-primary); border-color:var(--btn-primary); color:#fff; font-weight:600;}
.btn.danger{background:var(--brand-red); border-color:var(--brand-red); color:#fff;}
.btn.ghost{border-color:transparent; color:var(--brand-red);}
.btn.small{padding:5px 12px; font-size:13px; border-radius:var(--r-btn);}
.btn:active{opacity:.75;}
.row{display:flex; gap:10px; align-items:center;}
.row .grow{flex:1;}
.chip{
  display:inline-block; font-size:12px; padding:2px 10px; border-radius:99px;
  background:var(--accent-soft); color:var(--ink); margin:0 4px 4px 0; font-weight:500;
}
.chip.tag{background:#f5f5f5; color:var(--ink-soft);}
.warmth-hot{background:var(--hot-bg); color:var(--brand-red);}
.warmth-warm{background:var(--warm-bg); color:var(--ink);}
.warmth-cold{background:var(--cold-bg); color:var(--ink-soft);}
.muted{color:var(--ink-soft); font-size:13px;}
.empty{
  text-align:center; color:var(--ink-soft); padding:36px 20px; font-size:14px;
  border:1px dashed var(--line); border-radius:14px; background:#fffdf9;
}
h2{font-size:13px; color:var(--ink-soft); font-weight:600; margin:22px 0 8px; letter-spacing:2px;}
.banner{
  background:var(--card); color:var(--ink);
  border:1px solid var(--card-line); border-radius:var(--r-card);
  padding:12px 14px; margin-bottom:14px; font-size:14px;
  display:flex; align-items:center; gap:10px;
}
.banner .btn{flex:0 0 auto;}
.banner.danger{background:var(--danger-bg); color:var(--danger); border-color:#e6c3c0;}
.card-title{font-size:13px; color:var(--ink-soft); font-weight:700; letter-spacing:1.5px; margin:0 0 10px;}
.card-divider{border:0; border-top:1px dashed var(--card-line); margin:10px 0;}

/* 客戶列表項 */
.person{
  display:flex; align-items:flex-start; gap:12px;
  background:var(--card); border:1px solid var(--card-line); border-radius:var(--r-person);
  padding:12px; margin-bottom:8px; cursor:pointer;
}
.person .dot{
  flex:0 0 auto; width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:600; color:#fff;
}
.dot-hot{background:var(--hot);} .dot-warm{background:var(--warm);} .dot-cold{background:var(--cold); color:var(--cold-fg);}
.person{padding-top:14px;}
.person .info{flex:1; min-width:0;}
.person .name-row{display:flex; align-items:center; flex-wrap:wrap; gap:5px 6px;}
.person .name{font-weight:600;}
.person .chip.partner{background:var(--partner); color:#fff;}
.person .meta{font-size:12.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px;}
.person .amount{flex:0 0 auto; font-size:12.5px; font-weight:600; color:var(--ink); align-self:center; white-space:nowrap;}

/* 互動紀錄項 */
.ilog{border-left:3px solid var(--accent-soft); padding:4px 0 4px 10px; margin-bottom:10px;}
.ilog .when{font-size:12px; color:var(--ink-soft);}
.ilog .who{font-weight:600; font-size:14px; color:var(--accent);}
.ilog .txt{font-size:14px; white-space:pre-wrap;}

/* 篩選列 */
.filterbar{
  display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; -webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 28px), transparent 100%);
  mask-image:linear-gradient(to right, #000 calc(100% - 28px), transparent 100%);
}
.filterbar .fbtn{
  flex:0 0 auto; border:1px solid var(--line-strong); background:#fff; border-radius:99px;
  padding:5px 14px; font-size:13px; color:var(--ink-soft); cursor:pointer;
}
.filterbar .fbtn.on{background:var(--btn-primary); border-color:var(--btn-primary); color:#fff;}
.filterbar .fdivider{flex:0 0 1px; align-self:stretch; background:var(--line); margin:0 2px;}
.filterbar.tags{margin-top:-4px;}

/* ===== 底部彈窗 sheet ===== */
#sheet-mask{
  position:fixed; inset:0; background:rgba(50,40,30,.45); z-index:80;
  display:none;
}
#sheet-mask.show{display:block;}
#sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:90;
  background:var(--paper); border-radius:18px 18px 0 0;
  max-height:88%; display:none; flex-direction:column;
  box-shadow:0 -6px 30px rgba(0,0,0,.18);
}
#sheet.show{display:flex;}
#sheet .sheet-head{
  padding:14px 16px 8px; display:flex; align-items:center; gap:8px;
  border-bottom:1px solid var(--line); flex:0 0 auto;
}
#sheet .sheet-head .title{font-size:17px; font-weight:700; flex:1;}
#sheet .sheet-body{overflow-y:auto; padding:14px 16px calc(24px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch;}

/* ===== 關係圖 ===== */
#graph-tools{
  padding:10px 12px 6px; display:flex; gap:8px; align-items:center; flex:0 0 auto;
}
#graph-tools input{flex:1; padding:8px 12px;}
#graph-legend{
  display:flex; gap:12px; overflow-x:auto; padding:4px 12px 8px; flex:0 0 auto;
  font-size:12px; color:var(--ink-soft); -webkit-overflow-scrolling:touch;
}
#graph-legend .lg{flex:0 0 auto; display:flex; align-items:center; gap:5px; white-space:nowrap;}
#graph-legend .sw{width:26px; height:6px; flex:0 0 auto;}
#graph-legend .swdot{width:11px; height:11px; border-radius:50%;}
#graph-wrap{flex:1 1 auto; position:relative; overflow:hidden; touch-action:none; background:
  radial-gradient(var(--dot) 1px, transparent 1px); background-size:26px 26px;}
#graph-svg{position:absolute; inset:0; width:100%; height:100%; touch-action:none;}
.gnode{cursor:pointer;}
.gnode circle{stroke-width:2.5;}
.gnode.dim{opacity:.22;}
.gedge.dim{opacity:.12;}
input[type="color"].colorpick{width:46px; height:34px; padding:2px; border-radius:6px;}
.rename{text-decoration:underline dotted; text-underline-offset:3px; cursor:pointer;}
.gnode.sleep{opacity:.45;}
.gnode.sleep circle{stroke:#9aa2a9; stroke-dasharray:4 3;}
#focus-bar{
  position:absolute; left:10px; right:10px; bottom:12px; display:none;
  align-items:center; gap:8px; flex-wrap:wrap;
  background:var(--card); border:1px solid var(--card-line); border-radius:12px;
  padding:10px 12px; box-shadow:0 4px 18px rgba(0,0,0,.10);
}
.ghull rect{pointer-events:none;}
.ghull.dim{opacity:.3;}
.glabel{
  fill:var(--ink-soft); font-weight:700; text-anchor:start; pointer-events:none; letter-spacing:1px;
  paint-order:stroke; stroke:var(--paper); stroke-width:3.5px; stroke-linejoin:round;
}
.slabel{
  fill:var(--ink-soft); font-weight:500; text-anchor:middle; pointer-events:none;
  paint-order:stroke; stroke:var(--paper); stroke-width:3px; stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}
.nlabel{
  fill:var(--ink); font-weight:600; text-anchor:middle; pointer-events:none;
  paint-order:stroke; stroke:var(--paper); stroke-width:3.5px; stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}
.elabel{
  font-weight:600; text-anchor:middle; pointer-events:none;
  paint-order:stroke; stroke:var(--paper); stroke-width:3.5px; stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}
.gnode.hit circle{stroke:var(--ink); stroke-width:4;}
</style>

</head>
<body>
<div id="app">
  <header>
    <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <circle cx="50" cy="50" r="37.50" fill="none" stroke="var(--ink)" stroke-width="2.4"/>
      <polygon points="50.00,53.00 50.71,54.40 51.47,55.77 52.28,57.10 53.12,58.40 54.00,59.66 54.91,60.86 55.86,62.02 56.82,63.12 57.81,64.16 58.82,65.14 59.83,66.05 60.86,66.90 61.88,67.67 62.90,68.38 63.92,69.01 64.92,69.57 65.90,70.05 66.86,70.46 67.79,70.79 68.69,71.05 69.55,71.23 70.37,71.34 71.14,71.37 71.86,71.34 72.52,71.24 73.12,71.07 73.66,70.83 74.14,70.54 74.54,70.18 74.87,69.78 75.13,69.32 75.30,68.81 75.40,68.26 75.41,67.67 75.34,67.05 75.19,66.39 74.95,65.72 74.63,65.01 74.23,64.30 73.73,63.57 73.16,62.83 72.50,62.09 71.77,61.36 70.95,60.63 70.06,59.91 69.09,59.20 68.05,58.52 66.95,57.86 65.78,57.23 64.55,56.63 63.27,56.06 61.94,55.54 60.55,55.05 59.13,54.61 57.67,54.21 56.18,53.87 54.66,53.57 53.12,53.33 51.56,53.14 50.00,53.00" fill="var(--brand-red)"/>
      <polygon points="50.00,53.00 48.44,53.14 46.88,53.33 45.34,53.57 43.82,53.87 42.33,54.21 40.87,54.61 39.45,55.05 38.06,55.54 36.73,56.06 35.45,56.63 34.22,57.23 33.05,57.86 31.95,58.52 30.91,59.20 29.94,59.91 29.05,60.63 28.23,61.36 27.50,62.09 26.84,62.83 26.27,63.57 25.77,64.30 25.37,65.01 25.05,65.72 24.81,66.39 24.66,67.05 24.59,67.67 24.60,68.26 24.70,68.81 24.87,69.32 25.13,69.78 25.46,70.18 25.86,70.54 26.34,70.83 26.88,71.07 27.48,71.24 28.14,71.34 28.86,71.37 29.63,71.34 30.45,71.23 31.31,71.05 32.21,70.79 33.14,70.46 34.10,70.05 35.08,69.57 36.08,69.01 37.10,68.38 38.12,67.67 39.14,66.90 40.17,66.05 41.18,65.14 42.19,64.16 43.18,63.12 44.14,62.02 45.09,60.86 46.00,59.66 46.88,58.40 47.72,57.10 48.53,55.77 49.29,54.40 50.00,53.00" fill="var(--brand-red)"/>
      <polyline points="50.00,53.00 50.70,51.74 51.35,50.46 51.95,49.17 52.51,47.86 53.01,46.55 53.46,45.24 53.85,43.93 54.19,42.63 54.47,41.34 54.70,40.08 54.88,38.84 54.99,37.63 55.06,36.45 55.07,35.31 55.03,34.22 54.94,33.17 54.81,32.18 54.63,31.24 54.40,30.36 54.14,29.55 53.83,28.80 53.50,28.12 53.13,27.52 52.73,26.99 52.32,26.54 51.88,26.17 51.42,25.88 50.95,25.67 50.48,25.54 50.00,25.50 49.52,25.54 49.05,25.67 48.58,25.88 48.12,26.17 47.68,26.54 47.27,26.99 46.87,27.52 46.50,28.12 46.17,28.80 45.86,29.55 45.60,30.36 45.37,31.24 45.19,32.18 45.06,33.17 44.97,34.22 44.93,35.31 44.94,36.45 45.01,37.63 45.12,38.84 45.30,40.08 45.53,41.34 45.81,42.63 46.15,43.93 46.54,45.24 46.99,46.55 47.49,47.86 48.05,49.17 48.65,50.46 49.30,51.74 50.00,53.00" fill="none" stroke="var(--ink)" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="50.00" cy="25.50" r="1.6" fill="var(--ink)"/>
      <circle cx="50.00" cy="53.00" r="3.1" fill="var(--ink)"/>
    </svg>
    <h1>織網</h1><span class="chip" style="background:#212121;color:#fff;flex:0 0 auto;">DEMO 假資料</span>
    <span class="sub" id="head-stats"></span>
  </header>
  <main id="main">

    <!-- 首頁 -->
    <section class="view active" id="view-home">
      <div id="backup-banner"></div>
      <div id="home-today"></div>
      <input type="search" id="home-search" placeholder="搜尋姓名、公司、標籤、備註…" autocomplete="off">
      <div id="home-search-results"></div>
      <div class="row" style="margin-top:14px; gap:8px;">
        <button class="btn primary grow" id="btn-quick-log" style="padding:10px 6px;">記互動</button>
        <button class="btn grow" id="btn-quick-buy" style="padding:10px 6px;">記購買</button>
        <button class="btn grow" id="btn-quick-add" style="padding:10px 6px;">新增客戶</button>
      </div>
      <div id="home-insights"></div>
      <div id="home-dormant"></div>
      <div id="home-recent"></div>
    </section>

    <!-- 名單 -->
    <section class="view" id="view-list">
      <div class="filterbar" id="list-warmth-filter"></div>
      <div class="filterbar tags" id="list-tag-filter"></div>
      <div id="list-body"></div>
      <button class="btn primary" style="width:100%; margin-top:6px;" id="btn-list-add">新增客戶</button>
    </section>

    <!-- 關係圖 -->
    <section class="view" id="view-graph">
      <div id="graph-tools">
        <input type="search" id="graph-search" placeholder="找人並定位…" autocomplete="off">
        <button class="btn small" id="btn-relayout">整理版面</button>
      </div>
      <div class="filterbar" id="graph-filter" style="padding:0 12px 4px;"></div>
      <div id="graph-legend"></div>
      <div id="graph-wrap"><svg id="graph-svg"></svg><div id="focus-bar"></div></div>
    </section>

    <!-- 設定 -->
    <section class="view" id="view-settings">
      <div class="card">
        <div style="font-weight:700; margin-bottom:6px;">備份</div>
        <div class="muted" id="backup-status"></div>
        <div class="row" style="margin-top:10px;">
          <button class="btn primary grow" id="btn-export">備份（匯出 JSON）</button>
          <button class="btn grow" id="btn-import">匯入備份</button>
        </div>
        <input type="file" id="import-file" accept=".json,application/json" style="display:none;">
        <div id="prebak-row"></div>
        <div class="muted" style="margin-top:10px;">備份會產生一個 JSON 檔，請在分享面板選「儲存到檔案」→ iCloud Drive。匯入會以備份內容<b>整份取代</b>目前資料。</div>
      </div>
      <div class="card">
        <div style="font-weight:700; margin-bottom:6px;">外觀</div>
        <label>主題</label>
        <select id="skin-select">
          <option value="nuskin">極簡黑白（Nu Skin 風）</option>
          <option value="paper">暖紙感（原版）</option>
        </select>
        <label>熟度顏色（點色塊修改）</label>
        <div class="row" id="warmth-row"></div>
        <label>夥伴外框顏色（關係圖節點外環、名單與詳情的夥伴徽章）</label>
        <div class="row">
          <input type="color" class="colorpick" id="pc-color">
          <span class="grow"></span>
          <button class="btn small" id="pc-reset">恢復預設</button>
        </div>
        <div class="muted" style="margin-top:8px;">點虛線底線的名稱可以改名。</div>
        <label>沉睡門檻（幾天沒聯絡算沉睡）</label>
        <input type="number" id="dormant-days" min="1" max="365" inputmode="numeric">
      </div>
      <div class="card">
        <div class="card-title">商品目錄</div>
        <div class="muted" id="catalog-info"></div>
      </div>
      <div class="card">
        <div style="font-weight:700; margin-bottom:6px;">資料統計</div>
        <div class="muted" id="stats-body"></div>
      </div>
      <div class="card">
        <div style="font-weight:700; margin-bottom:6px;">關係種類</div>
        <div id="reltype-list"></div>
        <div class="row" style="margin-top:10px;">
          <input type="text" id="new-reltype" placeholder="新種類名稱（例：同學）" class="grow">
          <button class="btn small" id="btn-add-reltype">新增</button>
        </div>
        <label class="row" style="margin-top:8px; font-size:13px; color:var(--ink-soft);">
          <input type="checkbox" id="new-reltype-directed" style="width:auto;"> 這種關係有方向（像「介紹人」）
        </label>
      </div>
      <div class="card muted">
        織網 v1.1 — 資料只存在這台裝置的瀏覽器裡，不會上傳。<br>
        請固定用同一個入口開啟（加到主畫面後就都用主畫面圖示），並養成每週備份的習慣。
      </div>
    </section>
  </main>

  <nav id="tabbar">
    <button data-view="home" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>

  const isColor = v => isStr(v) && /^#[0-9a-fA-F]{6}$/.test(v);
  const num = v => { const n = Number(v); return Number.isFinite(n) ? n : null; };
  const str = v => isStr(v) ? v : "";
  const dropped = {customers:0, relations:0, interactions:0, purchases:0, tasks:0};

  const seenC = new Set();
  base.customers = d.customers.filter(c => {
    const ok = c && typeof c === "object" && safeId(c.id) && isStr(c.name) && c.name && !seenC.has(c.id);
    if (ok) seenC.add(c.id); else dropped.customers++;
    return ok;
  }).map(c => ({
    id: c.id, name: c.name,
    phone: str(c.phone), company: str(c.company), source: str(c.source),
    lineId: str(c.lineId), birthday: isBirthday(c.birthday) ? c.birthday : "",
    tags: Array.isArray(c.tags) ? c.tags.filter(isStr).slice(0, 30) : [],
    warmth: WARMTH[c.warmth] ? c.warmth : "warm",
    role: ROLES[c.role] ? c.role : "customer",
    preference: str(c.preference), note: str(c.note),
    pos: (c.pos && Number.isFinite(Number(c.pos.x)) && Number.isFinite(Number(c.pos.y)))
      ? {x:Number(c.pos.x), y:Number(c.pos.y)} : null,
    createdAt: num(c.createdAt) || Date.now(), updatedAt: num(c.updatedAt) || Date.now(),
  }));

  const has = id => seenC.has(id);          // 外鍵檢查：指向不存在客戶的資料一律丟棄
  const seenR = new Set();
  base.relations = (Array.isArray(d.relations) ? d.relations : []).filter(r => {
    const ok = r && typeof r === "object" && safeId(r.id) && !seenR.has(r.id) &&
      has(r.from) && has(r.to) && isStr(r.type) && r.from !== r.to;
    if (ok) seenR.add(r.id); else dropped.relations++;
    return ok;
  }).map(r => ({id:r.id, from:r.from, to:r.to, type:r.type, createdAt: num(r.createdAt) || Date.now()}));

  base.interactions = (Array.isArray(d.interactions) ? d.interactions : []).filter(i => {
    const ok = i && typeof i === "object" && safeId(i.id) && has(i.customerId) && isDate(i.date) && isStr(i.text);
    if (!ok) dropped.interactions++;
    return ok;
  }).map(i => ({id:i.id, customerId:i.customerId, date:i.date, text:i.text, createdAt: num(i.createdAt) || Date.now()}));

  base.purchases = (Array.isArray(d.purchases) ? d.purchases : []).filter(x => {
    const ok = x && typeof x === "object" && safeId(x.id) && has(x.customerId) && isDate(x.date) && isStr(x.item) && x.item;
    if (!ok) dropped.purchases++;
    return ok;
  }).map(x => {
    const amt = num(x.amount), sv = num(x.sv), cy = num(x.cycle);
    return {id:x.id, customerId:x.customerId, date:x.date, item:x.item,
      amount: (amt !== null && amt >= 0) ? amt : null,
      sv: (sv !== null && sv >= 0) ? sv : null,
      cycle: (cy !== null && cy > 0 && cy <= 3650) ? Math.round(cy) : null,
      note: str(x.note), createdAt: num(x.createdAt) || Date.now()};
  });

  base.tasks = (Array.isArray(d.tasks) ? d.tasks : []).filter(t => {
    const ok = t && typeof t === "object" && safeId(t.id) && has(t.customerId) && isDate(t.due);
    if (!ok) dropped.tasks++;
    return ok;
  }).map(t => ({id:t.id, customerId:t.customerId, due:t.due, text: str(t.text) || "跟進",
    done: !!t.done, doneAt: num(t.doneAt) || null, createdAt: num(t.createdAt) || Date.now()}));

  const st = (d.settings && typeof d.settings === "object") ? d.settings : {};
  base.settings = {};
  if (st.skin === "paper" || st.skin === "nuskin") base.settings.skin = st.skin;
  if (st.warmthColors && typeof st.warmthColors === "object"){
    const wc = {};
    ["hot", "warm", "cold"].forEach(k => { if (isColor(st.warmthColors[k])) wc[k] = st.warmthColors[k]; });
    if (Object.keys(wc).length) base.settings.warmthColors = wc;
  }
  if (st.warmthLabels && typeof st.warmthLabels === "object"){
    const wl = {};
    ["hot", "warm", "cold"].forEach(k => { if (isStr(st.warmthLabels[k]) && st.warmthLabels[k]) wl[k] = st.warmthLabels[k].slice(0, 20); });
    if (Object.keys(wl).length) base.settings.warmthLabels = wl;
  }
  if (isColor(st.partnerColor)) base.settings.partnerColor = st.partnerColor;
  const dd = num(st.dormantDays);
  if (dd !== null && dd >= 1 && dd <= 365) base.settings.dormantDays = Math.round(dd);

  const types = Array.isArray(d.relationTypes) && d.relationTypes.length
    ? d.relationTypes.filter(t => t && typeof t === "object" && isStr(t.key) && t.key && isStr(t.label) && t.label)
        .map(t => {
          const def = DEFAULT_RELTYPES.find(x => x.key === t.key);
          // 還停在舊版低飽和色（沒自訂過）就升級成新配色，並補上虛線樣式
          const legacy = LEGACY_RELTYPE_COLORS[t.key];
          const color = isColor(t.color)
            ? ((legacy && t.color.toLowerCase() === legacy.toLowerCase() && def) ? def.color : t.color)
            : (def ? def.color : "#888888");
          // 名稱同理：還停在舊版預設名（沒自訂過）就更新成現行預設名
          const oldLabels = LEGACY_RELTYPE_LABELS[t.key] || [];
          const label = (def && oldLabels.includes(t.label)) ? def.label : t.label.slice(0, 20);
          return {key:t.key, label, directed: !!t.directed, color,
            dash: isStr(t.dash) ? t.dash : (def ? (def.dash || "") : ""),
            builtin: !!t.builtin, tree: !!t.tree};
        })
    : JSON.parse(JSON.stringify(DEFAULT_RELTYPES));   // 深拷貝：直接引用會讓改名/改色污染全域預設
  const have = new Set(types.map(t => t.key));
  DEFAULT_RELTYPES.forEach(t => { if (!have.has(t.key)) types.push(JSON.parse(JSON.stringify(t))); });
  base.relationTypes = types;

  base.lastBackupAt = isStr(d.lastBackupAt) ? d.lastBackupAt : null;
  base._dropped = Object.values(dropped).some(n => n > 0) ? dropped : null;
  return base;
}

function loadDB(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){}
  if (!raw) return emptyDB();
  try { return migrate(JSON.parse(raw)); }
  catch(e){
    try { localStorage.setItem(KEY + "_corrupt_" + Date.now(), raw); } catch(_){}
    alert("讀取資料時發現格式異常，已把原始內容另存一份在瀏覽器裡。畫面將以空白資料開始，請盡快匯入最近的備份。");
    return emptyDB();
  }
}
function save(){
  // 回傳是否真的寫入；失敗時明講「這次修改沒有存進去」，不要讓畫面看起來成功
  let ok = false;
  try { localStorage.setItem(KEY, JSON.stringify(DB)); ok = true; }
  catch(e){
    alert("儲存失敗，這次的修改沒有存進裝置：" + e.message +
      "\n\n可能是儲存空間已滿或瀏覽器隱私模式。請先用「備份」把資料匯出，避免遺失。");
  }
  renderHeadStats();
  return ok;
}
function getCustomer(id){ return DB.customers.find(c => c.id === id) || null; }
function relType(key){ return DB.relationTypes.find(t => t.key === key) || {key, label:key, directed:false, color:"#999"}; }
function relationsOf(id){ return DB.relations.filter(r => r.from === id || r.to === id); }
function interactionsOf(id){
  return DB.interactions.filter(i => i.customerId === id).sort((a,b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
}
/* ===== 直銷組織：上下線樹 ===== */
function uplineOf(id){
  const r = DB.relations.find(x => x.type === "upline" && x.to === id);
  return r ? r.from : null;
}
function downlinesOf(id){
  return DB.relations.filter(x => x.type === "upline" && x.from === id).map(x => x.to);
}
function generationOf(id){
  let depth = 1, cur = id, guard = 0;
  while (guard++ < 200){
    const up = uplineOf(cur);
    if (!up) break;
    depth++; cur = up;
  }
  return depth;
}
function orgMembers(id){
  const out = [], seen = new Set([id]), stack = [id];
  while (stack.length){
    const cur = stack.pop();
    downlinesOf(cur).forEach(d => {
      if (seen.has(d)) return;      // 防呆：資料若成環不會無限迴圈
      seen.add(d); out.push(d); stack.push(d);
    });
  }
  return out;
}
function orgSize(id){ return orgMembers(id).length; }
function orgSpend(id){
  return spentOf(id) + orgMembers(id).reduce((t, x) => t + spentOf(x), 0);
}

/* ===== 跟進待辦 ===== */
function tasksOf(id){
  return DB.tasks.filter(t => t.customerId === id && !t.done)
    .sort((a, b) => a.due.localeCompare(b.due));
}
function openTasks(){
  return DB.tasks.filter(t => !t.done).sort((a, b) => a.due.localeCompare(b.due));
}
function dueTasks(){
  const today = todayStr();
  return openTasks().filter(t => t.due <= today);
}
function daysUntil(dateStr){
  const d = new Date(dateStr + "T00:00:00").getTime();
  const t = new Date(todayStr() + "T00:00:00").getTime();
  return Math.round((d - t) / 86400000);
}

/* ===== 生日 ===== */
function birthdayInDays(c, within){
  if (!c.birthday) return null;                       // 存 MM-DD 或 YYYY-MM-DD
  const md = c.birthday.length > 5 ? c.birthday.slice(5) : c.birthday;
  if (!/^\d{2}-\d{2}$/.test(md)) return null;
  const today = new Date(todayStr() + "T00:00:00");
  for (let y = 0; y <= 1; y++){
    const cand = new Date((today.getFullYear() + y) + "-" + md + "T00:00:00");
    if (isNaN(cand)) return null;
    const diff = Math.round((cand - today) / 86400000);
    if (diff >= 0) return diff <= within ? diff : null;
  }
  return null;
}

/* ===== 回購提醒 ===== */
function repurchaseDue(id){
  // 同一商品只看最新一筆購買（否則重買後，舊紀錄會因逾期越久越搶先，永遠壓著新的）
  const latest = {};
  DB.purchases.filter(x => x.customerId === id && x.cycle > 0).forEach(x => {
    const k = String(x.item || "");
    if (!latest[k] || x.date > latest[k].date) latest[k] = x;
  });
  let best = null;
  Object.values(latest).forEach(x => {
    const due = new Date(new Date(x.date + "T00:00:00").getTime() + x.cycle * 86400000);
    const d = Math.round((due - new Date(todayStr() + "T00:00:00")) / 86400000);
    if (d <= 7 && (!best || d < best.days)) best = {days:d, item:x.item};
  });
  return best;
}

function purchasesOf(id){
  return DB.purchases.filter(x => x.customerId === id)
    .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
}
function spentOf(id){
  return purchasesOf(id).reduce((sum, x) => sum + (Number(x.amount) || 0), 0);
}
function money(n){
  return "NT$ " + Math.round(n).toLocaleString("en-US");
}
function lastContact(id){
  const list = interactionsOf(id);
  return list.length ? list[0].date : null;
}

  if (!DB.lastBackupAt) return true;
  return (Date.now() - new Date(DB.lastBackupAt).getTime()) > 7 * 86400 * 1000;
}

        <div class="txt">${esc(i.text)}</div></div>`;
    }).join("") + `</div>`;
  }
  renderHomeToday();
  renderHomeInsights();
  renderHomeSearch();
}
function renderHomeToday(){
  const box = document.getElementById("home-today");
  if (!DB.customers.length){ box.innerHTML = ""; return; }
  const items = [];

  dueTasks().forEach(t => {
    const c = getCustomer(t.customerId);
    if (!c) return;
    const d = daysUntil(t.due);
    items.push({sort:0, html:
      `<div class="row" style="margin-bottom:9px; align-items:center;">
        <button class="btn small" data-donetask="${esc(t.id)}" style="flex:0 0 auto;">完成</button>
        <span class="grow" data-open="${esc(c.id)}" style="cursor:pointer;"><b>${esc(c.name)}</b>　${esc(t.text)}</span>
        <span class="muted">${d < 0 ? "逾期 " + (-d) + " 天" : "今天"}</span>
      </div>`});
  });

  DB.customers.forEach(c => {
    const bd = birthdayInDays(c, 7);
    if (bd !== null) items.push({sort:1, html:
      `<div class="row" style="margin-bottom:9px;">
        <span class="grow" data-open="${esc(c.id)}" style="cursor:pointer;"><b>${esc(c.name)}</b>　生日</span>
        <span class="muted">${bd === 0 ? "就是今天" : bd + " 天後"}</span></div>`});
    const rp = repurchaseDue(c.id);
    if (rp) items.push({sort:2, html:
      `<div class="row" style="margin-bottom:9px;">
        <span class="grow" data-open="${esc(c.id)}" style="cursor:pointer;"><b>${esc(c.name)}</b>　該回購 ${esc(rp.item)}</span>
        <span class="muted">${rp.days < 0 ? "已過 " + (-rp.days) + " 天" : rp.days === 0 ? "今天" : rp.days + " 天後"}</span></div>`});
  });

  items.sort((a, b) => a.sort - b.sort);
  // 未來 7 天預覽：一眼看到接下來幾天的量，不用切視圖
  const ahead = openTasks().map(t => ({t, d: daysUntil(t.due)})).filter(x => x.d > 0 && x.d <= 7);
  const dayName = d => d === 1 ? "明天" : d === 2 ? "後天" : d + " 天後";
  const grouped = {};
  ahead.forEach(x => { grouped[x.d] = (grouped[x.d] || 0) + 1; });
  const laterCount = openTasks().filter(t => daysUntil(t.due) > 7).length;
  const preview = Object.keys(grouped).map(Number).sort((a, b) => a - b)
    .map(d => `${dayName(d)} ${grouped[d]} 件`).join("・");
  const aheadLine = (preview || laterCount)
    ? `<hr class="card-divider"><div class="muted">接下來：${esc(preview || "7 天內沒有待辦")}` +
      (laterCount ? `　<span style="opacity:.75;">更遠還有 ${laterCount} 件</span>` : "") + `</div>`
    : "";

  const allCount = openTasks().length;
  const titleRow = n => `<div class="row" style="align-items:baseline;">
    <span class="card-title grow" style="margin:0 0 10px;">今天要做的事${n ? "（" + n + "）" : ""}</span>
    ${allCount ? `<button class="btn small" id="open-all-tasks">全部 ${allCount}</button>` : ""}</div>`;
  box.innerHTML = items.length
    ? `<div class="card">${titleRow(items.length)}${items.map(x => x.html).join("")}${aheadLine}</div>`
    : ((aheadLine || allCount) ? `<div class="card">${titleRow(0)}
        <div class="muted">今天沒有待辦。</div>${aheadLine}</div>` : "");
  const allBtn = document.getElementById("open-all-tasks");
  if (allBtn) allBtn.addEventListener("click", openAllTasks);

  box.querySelectorAll("[data-donetask]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const t = DB.tasks.find(x => x.id === b.dataset.donetask);
    if (t){ t.done = true; t.doneAt = Date.now(); save(); renderHome(); }
  }));
}

      const c = getCustomer(t.customerId);

          <b>${esc(c ? c.name : "（已刪除）")}</b>　${esc(t.text)}</span>
        <button class="btn small" data-undotask="${esc(t.id)}" style="flex:0 0 auto;">還原</button></div>`;
    }).join("") : ""}
  `);
  document.querySelectorAll("[data-donetask3]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const t = DB.tasks.find(x => x.id === b.dataset.donetask3);
    if (t){ t.done = true; t.doneAt = Date.now(); save(); openAllTasks(); }
  }));
  document.querySelectorAll("[data-undotask]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const t = DB.tasks.find(x => x.id === b.dataset.undotask);
    if (t){ t.done = false; delete t.doneAt; save(); openAllTasks(); }
  }));
}

function renderHomeInsights(){
  const box = document.getElementById("home-insights");
  const dbox = document.getElementById("home-dormant");
  if (!DB.customers.length){ box.innerHTML = ""; dbox.innerHTML = ""; return; }
  const relCount = {};
  DB.customers.forEach(c => relCount[c.id] = 0);
  DB.relations.forEach(r => {
    if (relCount[r.from] !== undefined) relCount[r.from]++;
    if (relCount[r.to] !== undefined) relCount[r.to]++;
  });
  const hub = DB.customers.slice().sort((a, b) => relCount[b.id] - relCount[a.id])[0];
  const introOut = {};
  DB.relations.filter(r => r.type === "intro").forEach(r => introOut[r.from] = (introOut[r.from] || 0) + 1);
  const engineId = Object.keys(introOut).sort((a, b) => introOut[b] - introOut[a])[0];
  const engine = engineId ? getCustomer(engineId) : null;
  const islands = DB.customers.filter(c => !relCount[c.id]);
  const hotDorm = DB.customers.filter(c => c.warmth === "hot")
    .map(c => ({c, d: dormantInfo(c.id)}))
    .sort((x, y) => (y.d.days == null ? 1e9 : y.d.days) - (x.d.days == null ? 1e9 : x.d.days))[0];
  const line = (label, html) =>
    `<div class="row" style="margin-bottom:9px; align-items:baseline;"><span class="muted" style="flex:0 0 6.5em;">${label}</span><span class="grow">${html}</span></div>`;
  const nameLink = c => `<span data-open="${esc(c.id)}" style="font-weight:600; cursor:pointer;">${esc(c.name)}</span>`;
  const spender = DB.customers.map(c => ({c, v: spentOf(c.id)})).filter(x => x.v > 0)
    .sort((a, b) => b.v - a.v)[0];
  const lastBuy = DB.purchases.slice()
    .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt)[0];
  const noBuy = DB.customers.filter(c => c.warmth === "hot" && !purchasesOf(c.id).length);
  // 直銷組織相關
  const partners = DB.customers.filter(isPartner);
  const thisMonth = todayStr().slice(0, 7);
  const newPartners = partners.filter(c => {
    const d = new Date(c.createdAt || 0);
    const ym = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    return ym === thisMonth;
  });
  const stalled = partners.filter(c => !downlinesOf(c.id).length);
  const topOrg = partners.map(c => ({c, v: orgSize(c.id)})).filter(x => x.v > 0)
    .sort((a, b) => b.v - a.v)[0];
  const orgRows = partners.length ? [
    line("組織規模", `<b>${partners.length}</b> 位夥伴` +
      (topOrg ? `　最大線 ${nameLink(topOrg.c)}（${topOrg.v} 人）` : "")),
    newPartners.length ? line("本月新夥伴", newPartners.slice(0, 3).map(nameLink).join("、") +
      (newPartners.length > 3 ? ` <span class="muted">…共 ${newPartners.length} 位</span>` : "")) : "",
    stalled.length ? line("斷層夥伴", stalled.slice(0, 3).map(nameLink).join("、") +
      (stalled.length > 3 ? ` <span class="muted">…共 ${stalled.length} 位</span>` : "") +
      ` <span class="muted">底下還沒有下線</span>`) : "",
  ].filter(Boolean) : [];

  const ym = todayStr().slice(0, 7);
  const prevD = new Date(new Date(todayStr() + "T00:00:00").getTime() - 15 * 86400000);
  const prevYm = new Date(prevD.getFullYear(), prevD.getMonth() - (todayStr().slice(8) >= "16" ? 1 : 0), 1);
  const lastYm = (() => { const d = new Date(todayStr() + "T00:00:00"); d.setDate(1); d.setMonth(d.getMonth() - 1);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); })();
  const sumOf = key => DB.purchases.filter(x => x.date.slice(0, 7) === key)
    .reduce((t, x) => t + (Number(x.amount) || 0), 0);
  const cntOf = key => DB.purchases.filter(x => x.date.slice(0, 7) === key).length;
  const thisSum = sumOf(ym), lastSum = sumOf(lastYm);
  const svOf = key => DB.purchases.filter(x => x.date.slice(0, 7) === key)
    .reduce((t, x) => t + (Number(x.sv) || 0), 0);
  const thisSv = svOf(ym);
  const monthRow = (thisSum || lastSum || cntOf(ym))
    ? line("本月業績", `<b>${money(thisSum)}</b>　<span class="muted">${cntOf(ym)} 筆${thisSv ? "・SV " + Math.round(thisSv) : ""}</span>` +
        (lastSum ? `　<span class="muted">上月 ${money(lastSum)}（${thisSum >= lastSum ? "+" : "−"}${money(Math.abs(thisSum - lastSum)).replace("NT$ ", "")}）</span>` : ""))
    : "";

  // 上半段＝業績與組織，下半段＝客戶洞察，兩組各自組裝（別再用位移量切，會錯位）
  const topRows = [monthRow, ...orgRows].filter(Boolean);
  const bottomRows = [
    spender ? line("消費最高", nameLink(spender.c) + ` <span class="muted">累計 ${money(spender.v)}</span>`) : "",
    lastBuy && getCustomer(lastBuy.customerId) ? line("最近成交", nameLink(getCustomer(lastBuy.customerId)) + ` <span class="muted">${esc(lastBuy.item)}・${esc(lastBuy.date)}</span>`) : "",
    noBuy.length ? line("熟但沒成交", noBuy.slice(0, 3).map(nameLink).join("、") + (noBuy.length > 3 ? ` <span class="muted">…共 ${noBuy.length} 位</span>` : "")) : "",
    hub && relCount[hub.id] ? line("樞紐人物", nameLink(hub) + ` <span class="muted">${relCount[hub.id]} 條連結</span>`) : "",
    engine ? line("轉介發動機", nameLink(engine) + ` <span class="muted">介紹了 ${introOut[engine.id]} 人</span>`) : "",
    islands.length ? line("孤島客戶", islands.slice(0, 3).map(nameLink).join("、") + (islands.length > 3 ? ` <span class="muted">…共 ${islands.length} 位</span>` : "")) : "",
    hotDorm && hotDorm.d.dormant ? line("該回溫的" + esc(warmthLabel("hot")), nameLink(hotDorm.c) + ` <span class="muted">${hotDorm.d.days == null ? "從未互動" : hotDorm.d.days + " 天沒聯絡"}</span>`) : "",
  ].filter(Boolean);
  const divider = topRows.length && bottomRows.length ? '<hr class="card-divider">' : "";
  box.innerHTML = (topRows.length || bottomRows.length)
    ? `<div class="card"><div class="card-title">網絡洞察</div>${topRows.join("")}${divider}${bottomRows.join("")}</div>` : "";

  const dorm = DB.customers.map(c => ({c, d: dormantInfo(c.id)})).filter(x => x.d.dormant)
    .sort((x, y) => (y.d.days == null ? 1e9 : y.d.days) - (x.d.days == null ? 1e9 : x.d.days));
  dbox.innerHTML = dorm.length
    ? `<div class="card"><div class="card-title">該聯絡了（超過 ${dormantLimit()} 天，共 ${dorm.length} 位）</div>` +
      dorm.slice(0, 5).map(x => `<div class="row" style="margin-bottom:9px;">
        <span class="grow" data-open="${esc(x.c.id)}" style="cursor:pointer;"><b>${esc(x.c.name)}</b>
          <span class="chip warmth-${x.c.warmth}" style="margin:0 0 0 4px;">${esc(warmthLabel(x.c.warmth))}</span></span>
        <span class="muted">${x.d.days == null ? "從未互動" : x.d.days + " 天"}</span></div>`).join("") + `</div>`
    : "";
}

let listWarmth = "all";
let listTag = "all";
function renderList(){
  const wf = document.getElementById("list-warmth-filter");
  const groups = [
    [["all","全部"],["_partner","夥伴"],["_customer","純顧客"]],
    [["hot",warmthLabel("hot")],["warm",warmthLabel("warm")],["cold",warmthLabel("cold")]],
    [["_buy","有成交"],["_nobuy","未成交"]],
  ];
  wf.innerHTML = groups.map(g => g.map(([k,l]) =>
    `<button class="fbtn ${listWarmth===k?"on":""}" data-w="${k}">${l}</button>`).join("")
  ).join('<span class="fdivider"></span>');
  wf.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { listWarmth = b.dataset.w; renderList(); }));

  const tags = [...new Set(DB.customers.flatMap(c => c.tags || []))].sort();
  const tf = document.getElementById("list-tag-filter");
  if (tags.length){
    tf.innerHTML = [`<button class="fbtn ${listTag==="all"?"on":""}" data-t="all">全部標籤</button>`]
      .concat(tags.map(t => `<button class="fbtn ${listTag===t?"on":""}" data-t="${esc(t)}">#${esc(t)}</button>`)).join("");
    tf.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { listTag = b.dataset.t; renderList(); }));
  } else tf.innerHTML = "";

  let list = DB.customers.slice().sort((a,b) => a.name.localeCompare(b.name, "zh-Hant"));
  if (listWarmth === "_partner") list = list.filter(c => isPartner(c));
  else if (listWarmth === "_customer") list = list.filter(c => !isPartner(c));
  else if (listWarmth === "_buy") list = list.filter(c => purchasesOf(c.id).length);
  else if (listWarmth === "_nobuy") list = list.filter(c => !purchasesOf(c.id).length);
  else if (listWarmth !== "all") list = list.filter(c => c.warmth === listWarmth);
  if (listTag !== "all") list = list.filter(c => (c.tags||[]).includes(listTag));
  const body = document.getElementById("list-body");
  body.innerHTML = list.length ? list.map(personRowHTML).join("")
    : `<div class="empty">${DB.customers.length ? "沒有符合篩選的客戶。" : "還沒有客戶，按下面的按鈕建立第一位。"}</div>`;
}

/* ---------- 客戶詳情 ---------- */
function relationLabel(r, viewpointId){
  const t = relType(r.type);
  const otherId = r.from === viewpointId ? r.to : r.from;
  const other = getCustomer(otherId);
  const otherName = other ? other.name : "（已刪除）";
  let text;
  if (t.key === "upline"){
    text = r.from === viewpointId ? `下線：${otherName}` : `上線：${otherName}`;
  } else if (t.directed){
    text = r.from === viewpointId ? `介紹了 ${otherName}` : `${otherName} 介紹（引路人）`;
    if (t.key !== "intro") text = r.from === viewpointId ? `${t.label} → ${otherName}` : `${otherName} → ${t.label}`;
  } else {
    text = `${t.label}：${otherName}`;
  }
  return {text, otherId, color:t.color};
}
function openDetail(id){
  const c = getCustomer(id);
  if (!c) return;
  const rels = relationsOf(id);
  const logs = interactionsOf(id);
  const buys = purchasesOf(id);
  const spent = spentOf(id);
  const fields = [
    ["電話", c.phone ? `<a href="tel:${esc(c.phone)}" style="color:var(--brand-red)">${esc(c.phone)}</a>` : ""],
    ["LINE", c.lineId ? `<a href="https://line.me/ti/p/~${encodeURIComponent(c.lineId)}" target="_blank" rel="noopener" style="color:var(--brand-red)">${esc(c.lineId)}</a>` : ""],
    ["生日", c.birthday ? esc(c.birthday) + (birthdayInDays(c, 30) !== null ? `　<b>${birthdayInDays(c, 30) === 0 ? "就是今天" : birthdayInDays(c, 30) + " 天後"}</b>` : "") : ""],
    ["公司／職業", esc(c.company)],
    ["怎麼認識的", esc(c.source)],
  ].filter(f => f[1]);

  openSheet(c.name, `
    <div>
      <span class="chip warmth-${c.warmth}">${esc(warmthLabel(c.warmth))}</span>
      ${isPartner(c) ? `<span class="chip" style="background:${partnerColor()};color:#fff;">${esc(ROLES[roleOf(c)].label)}</span>` : ""}
      ${(c.tags||[]).map(t => `<span class="chip tag">#${esc(t)}</span>`).join("")}
    </div>
    ${(() => {
      const up = uplineOf(id), downs = downlinesOf(id), sz = orgSize(id);
      if (!up && !downs.length && !isPartner(c)) return "";
      const upc = up ? getCustomer(up) : null;
      const os = orgSpend(id);
      return `<div class="card" style="margin-top:12px;">
        <div style="font-weight:700; margin-bottom:6px;">組織</div>
        <div class="muted">第 ${generationOf(id)} 代　直屬下線 ${downs.length} 人　整條線 ${sz} 人</div>
        <div class="muted">上線：${upc ? `<span data-open="${esc(upc.id)}" style="color:var(--brand-red);cursor:pointer;">${esc(upc.name)}</span>` : "無（最上層）"}</div>
        ${os ? `<div class="muted">組織業績累計 ${money(os)}（本人 ${money(spentOf(id))}）</div>` : ""}
        ${downs.length ? `<div style="margin-top:6px;">${downs.map(d => {
          const dc = getCustomer(d);
          return dc ? `<span class="chip tag" data-open="${esc(d)}" style="cursor:pointer;">${esc(dc.name)}${orgSize(d) ? "（+" + orgSize(d) + "）" : ""}</span>` : "";
        }).join("")}</div>` : ""}
      </div>`;
    })()}
    ${fields.map(f => `<div style="margin-top:8px;"><span class="muted">${f[0]}</span>　${f[1]}</div>`).join("")}
    ${c.preference ? `<div style="margin-top:10px;"><span class="muted">偏好／需求</span>
      <div class="card" style="margin-top:4px; white-space:pre-wrap;">${esc(c.preference)}</div></div>` : ""}
    ${c.note ? `<div class="card" style="margin-top:12px; white-space:pre-wrap;">${esc(c.note)}</div>` : ""}
    <div class="row" style="margin-top:14px;">
      <button class="btn primary grow" id="d-log">記一筆互動</button>
      <button class="btn grow" id="d-buy">記一筆購買</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <button class="btn grow" id="d-rel">加關係</button>
      <button class="btn grow" id="d-edit">編輯</button>
    </div>

    ${(() => {
      const ts = tasksOf(id);
      return ts.length ? `<h2>待辦（${ts.length}）</h2>` + ts.map(t => {
        const d = daysUntil(t.due);
        return `<div class="row" style="margin-bottom:8px;">
          <button class="btn small" data-donetask2="${esc(t.id)}" style="flex:0 0 auto;">完成</button>
          <span class="grow">${esc(t.text)}</span>
          <span class="muted">${esc(t.due)}${d < 0 ? "（逾期）" : d === 0 ? "（今天）" : ""}</span></div>`;
      }).join("") : "";
    })()}

    <h2>購買紀錄（${buys.length}）${spent ? "　累計 " + money(spent) : ""}</h2>
    <div>${buys.length ? buys.map(x =>
      `<div class="ilog"><span class="when">${esc(x.date)}</span>
       <button class="btn small ghost" data-delbuy="${esc(x.id)}" style="float:right;">刪</button>
       <div class="txt"><b>${esc(x.item)}</b>${Number(x.amount) ? "　" + money(Number(x.amount)) : ""}${Number(x.sv) ? "　SV " + x.sv : ""}${x.note ? "\n" + esc(x.note) : ""}</div></div>`).join("")
      : `<div class="muted">還沒有購買紀錄。</div>`}</div>

    <h2>關係（${rels.length}）</h2>
    <div id="d-rels">${rels.length ? rels.map(r => {
      const L = relationLabel(r, id);
      return `<div class="row" style="margin-bottom:6px;">
        <span class="grow" data-open="${esc(L.otherId)}" style="cursor:pointer;">
          <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${L.color};margin-right:6px;"></span>${esc(L.text)}</span>
        <button class="btn small" data-delrel="${esc(r.id)}">刪</button></div>`;
    }).join("") : `<div class="muted">還沒有連任何人。</div>`}</div>

    <h2>互動紀錄（${logs.length}）</h2>
    <div>${logs.length ? logs.map(i =>
      `<div class="ilog"><span class="when">${esc(i.date)}</span>
       <button class="btn small ghost" data-dellog="${esc(i.id)}" style="float:right;">刪</button>
       <div class="txt">${esc(i.text)}</div></div>`).join("")
      : `<div class="muted">還沒有互動紀錄。</div>`}</div>

    <div style="margin-top:22px; text-align:center;">
      <button class="btn ghost" id="d-delete" style="color:var(--danger);">刪除這位客戶</button>
    </div>
  `);

  document.getElementById("d-edit").addEventListener("click", () => openEdit(id));
  document.getElementById("d-log").addEventListener("click", () => openQuickLog(id));
  document.getElementById("d-buy").addEventListener("click", () => openPurchase(id));
  document.querySelectorAll("[data-donetask2]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const t = DB.tasks.find(x => x.id === b.dataset.donetask2);
    if (t){ t.done = true; t.doneAt = Date.now(); save(); openDetail(id); }
  }));
  document.getElementById("d-rel").addEventListener("click", () => openAddRelation(id));
  document.getElementById("d-delete").addEventListener("click", () => {
    if (!confirm(`確定刪除「${c.name}」？相關的關係、互動與購買紀錄會一併刪除，無法復原。`)) return;
    DB.customers = DB.customers.filter(x => x.id !== id);
    DB.relations = DB.relations.filter(r => r.from !== id && r.to !== id);
    DB.interactions = DB.interactions.filter(i => i.customerId !== id);
    DB.purchases = DB.purchases.filter(x => x.customerId !== id);
    DB.tasks = DB.tasks.filter(x => x.customerId !== id);
    save(); closeSheet(); showView(currentView);
  });
  document.querySelectorAll("[data-delrel]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    if (!confirm("刪除這條關係？")) return;
    DB.relations = DB.relations.filter(r => r.id !== b.dataset.delrel);
    save(); openDetail(id);
  }));
  document.querySelectorAll("[data-delbuy]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    if (!confirm("刪除這筆購買紀錄？")) return;
    DB.purchases = DB.purchases.filter(x => x.id !== b.dataset.delbuy);
    save(); openDetail(id);
  }));
  document.querySelectorAll("[data-dellog]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    if (!confirm("刪除這筆互動紀錄？")) return;
    DB.interactions = DB.interactions.filter(i => i.id !== b.dataset.dellog);
    save(); openDetail(id);
  }));
}

function openEdit(id){
  const c = id ? getCustomer(id) : null;
  openSheet(c ? "編輯：" + c.name : "新增客戶", `
    <label>姓名（必填）</label><input type="text" id="f-name" value="${esc(c ? c.name : "")}">
    <label>電話</label><input type="tel" id="f-phone" value="${esc(c ? c.phone : "")}">

    <label>LINE ID</label><input type="text" id="f-line" value="${esc(c ? (c.lineId || "") : "")}" placeholder="用來一鍵開 LINE 聊天">
    <label>生日（可只填月日）</label><input type="text" id="f-birthday" value="${esc(c ? (c.birthday || "") : "")}" placeholder="例：03-15 或 1985-03-15" inputmode="numeric">
    <label>標籤（用逗號分隔）</label><input type="text" id="f-tags" value="${esc(c ? (c.tags||[]).join("、") : "")}" placeholder="例：保險、高潛力、台中">
    <label>身份</label>
    <div class="filterbar" id="f-role">
      ${Object.keys(ROLES).map(k =>
        `<button class="fbtn ${roleOf(c || {}) === k ? "on" : ""}" data-k="${k}">${esc(ROLES[k].label)}</button>`).join("")}
    </div>
    <label>熟度</label>
    <div class="filterbar" id="f-warmth">
      ${Object.keys(WARMTH).map(k =>
        `<button class="fbtn ${((c&&c.warmth)||"warm")===k?"on":""}" data-k="${k}">${esc(warmthLabel(k))}</button>`).join("")}
    </div>
    <label>偏好／需求</label><textarea id="f-pref" rows="2" placeholder="例：只用無香精、預算 3 萬內、偏好週末見面">${esc(c ? (c.preference || "") : "")}</textarea>
    <label>備註</label><textarea id="f-note" rows="4">${esc(c ? c.note : "")}</textarea>
    <div class="row" style="margin-top:18px;">
      <button class="btn primary grow" id="f-save">儲存</button>
    </div>
  `);

    role = b.dataset.k;
    document.querySelectorAll("#f-role .fbtn").forEach(x => x.classList.toggle("on", x === b));
  }));
  let warmth = (c && c.warmth) || "warm";
  document.querySelectorAll("#f-warmth .fbtn").forEach(b => b.addEventListener("click", () => {
    warmth = b.dataset.k;
    document.querySelectorAll("#f-warmth .fbtn").forEach(x => x.classList.toggle("on", x === b));
  }));
  document.getElementById("f-save").addEventListener("click", () => {
    const name = document.getElementById("f-name").value.trim();
    if (!name){ alert("姓名是必填的。"); return; }
    const tags = document.getElementById("f-tags").value.split(/[,，、]/).map(s => s.trim()).filter(Boolean);
    const data = {
      name,
      phone: document.getElementById("f-phone").value.trim(),
      company: document.getElementById("f-company").value.trim(),
      source: document.getElementById("f-source").value.trim(),
      tags, warmth, role,
      lineId: document.getElementById("f-line").value.trim(),
      birthday: document.getElementById("f-birthday").value.trim(),
      preference: document.getElementById("f-pref").value.trim(),
      note: document.getElementById("f-note").value.trim(),
      updatedAt: Date.now(),

/* ---------- 關係圖 ---------- */
const gview = {tx:0, ty:0, s:1, inited:false};
let gMode = "net";          // net=網絡 org=組織圖 intro=轉介鏈
const TREE_REL = {org:"upline", intro:"intro"};
let gDepth = {};            // 樹狀模式下各節點的代數
let gFocus = null;          // 聚焦的客戶 id
let gFocusDepth = 1;        // 1=直接關係 2=第二層
let gFilterWarmth = null;
let gFilterTag = null;
let gIntroPos = {};         // 轉介鏈模式的臨時座標（不寫回 pos）

function dormantLimit(){
  const v = DB.settings && parseInt(DB.settings.dormantDays, 10);
  return (v >= 1 && v <= 365) ? v : 30;
}
function dormantInfo(id){
  const lc = lastContact(id);
  if (!lc) return {days:null, dormant:true};
  const days = Math.max(0, Math.floor((Date.now() - new Date(lc + "T00:00:00").getTime()) / 86400000));
  return {days, dormant: days > dormantLimit()};
}

function ensurePositions(){
  const need = DB.customers.filter(c => !c.pos);
  if (!need.length) return;
  // 全部重排 → 用群組打包；只加了幾個人 → 沿用增量排版不動既有位置
  if (need.length === DB.customers.length) packedLayout();
  else forceLayout(need);
  save();
}

/* 連通分量：把彼此有關係的人歸成同一群 */
function componentsOf(list){
  const idset = new Set(list.map(c => c.id));
  const adj = {};
  list.forEach(c => adj[c.id] = []);
  DB.relations.forEach(r => {
    if (idset.has(r.from) && idset.has(r.to)){ adj[r.from].push(r.to); adj[r.to].push(r.from); }
  });
  const seen = new Set(), comps = [];
  list.forEach(c => {
    if (seen.has(c.id)) return;
    const stack = [c.id], g = [];
    seen.add(c.id);
    while (stack.length){
      const id = stack.pop();
      g.push(id);
      adj[id].forEach(n => { if (!seen.has(n)){ seen.add(n); stack.push(n); } });
    }
    comps.push(g);
  });
  return comps;
}

/* 單一群組內部的力導向排版（回傳相對座標） */
function layoutComponent(ids){
  const K = 120;
  const idset = new Set(ids);
  const rels = DB.relations.filter(r => idset.has(r.from) && idset.has(r.to));
  const pos = {};
  ids.forEach((id, i) => {
    const ang = i * 2.399963, rad = 40 + 22 * Math.sqrt(i + 1);
    pos[id] = {x: rad * Math.cos(ang), y: rad * Math.sin(ang)};
  });
  for (let it = 0; it < 260; it++){
    const disp = {};
    ids.forEach(id => disp[id] = {x:0, y:0});
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++){
      const a = ids[i], b = ids[j];
      let dx = pos[a].x - pos[b].x, dy = pos[a].y - pos[b].y, d2 = dx*dx + dy*dy;
      if (d2 < 1){ dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
      const d = Math.sqrt(d2), f = K * K / d;
      disp[a].x += dx / d * f; disp[a].y += dy / d * f;
      disp[b].x -= dx / d * f; disp[b].y -= dy / d * f;
    }
    rels.forEach(r => {
      const dx = pos[r.from].x - pos[r.to].x, dy = pos[r.from].y - pos[r.to].y;
      const d = Math.max(1, Math.sqrt(dx*dx + dy*dy)), f = d * d / K;
      disp[r.from].x -= dx / d * f; disp[r.from].y -= dy / d * f;
      disp[r.to].x += dx / d * f; disp[r.to].y += dy / d * f;
    });
    let cx = 0, cy = 0;
    ids.forEach(id => { cx += pos[id].x; cy += pos[id].y; });
    cx /= ids.length; cy /= ids.length;
    ids.forEach(id => {
      disp[id].x += (cx - pos[id].x) * 0.06;
      disp[id].y += (cy - pos[id].y) * 0.06;
    });
    const temp = 14 * (1 - it / 260) + 1;
    ids.forEach(id => {
      const d = Math.sqrt(disp[id].x**2 + disp[id].y**2) || 1;
      pos[id].x += disp[id].x / d * Math.min(d, temp);
      pos[id].y += disp[id].y / d * Math.min(d, temp);
    });
  }
  return pos;
}

/* 沒有任何關係的人：排成整齊格狀，不參與力導向（否則會被斥力推到天邊） */
function gridLayout(ids){
  const cols = Math.max(1, Math.ceil(Math.sqrt(ids.length)));
  const SX = 132, SY = 120;
  const pos = {};
  ids.forEach((id, i) => { pos[id] = {x: (i % cols) * SX, y: Math.floor(i / cols) * SY}; });
  return pos;
}

/* 把各群組當積木緊湊排列，避免互不相連的群把畫布撐爆 */
function packedLayout(){
  const all = DB.customers;
  if (!all.length) return;
  const comps = componentsOf(all).sort((a, b) => b.length - a.length);
  const singles = comps.filter(g => g.length === 1).map(g => g[0]);
  const blocks = [];
  const mkBlock = (ids, local) => {
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    ids.forEach(id => {
      minX = Math.min(minX, local[id].x); maxX = Math.max(maxX, local[id].x);
      minY = Math.min(minY, local[id].y); maxY = Math.max(maxY, local[id].y);
    });
    ids.forEach(id => { local[id] = {x: local[id].x - minX, y: local[id].y - minY}; });
    return {ids, local, w: maxX - minX, h: maxY - minY};
  };
  comps.filter(g => g.length > 1).forEach(ids => blocks.push(mkBlock(ids, layoutComponent(ids))));
  if (singles.length) blocks.push(mkBlock(singles, gridLayout(singles)));

  const GAP = 165;
  const area = blocks.reduce((t, b) => t + (b.w + GAP) * (b.h + GAP), 0);
  // 手機是直式螢幕：讓每列窄一點、群往下堆，才不會被寬度綁死縮放而上下留白
  const target = Math.max(420, Math.sqrt(area) * 0.78);
  let x = 0, y = 0, rowH = 0;
  blocks.forEach(b => {
    if (x > 0 && x + b.w > target){ x = 0; y += rowH + GAP; rowH = 0; }
    b.ox = x; b.oy = y;
    x += b.w + GAP;
    rowH = Math.max(rowH, b.h);
  });
  blocks.forEach(b => b.ids.forEach(id => {
    const c = getCustomer(id);
    if (c) c.pos = {x: Math.round(b.local[id].x + b.ox), y: Math.round(b.local[id].y + b.oy)};
  }));
}
function forceLayout(movable){
  const all = DB.customers;
  if (!all.length) return;
  const fixedSet = new Set(all.filter(c => c.pos && !movable.includes(c)).map(c => c.id));
  let cx = 0, cy = 0, n = 0;
  all.forEach(c => { if (c.pos){ cx += c.pos.x; cy += c.pos.y; n++; } });
  if (n){ cx /= n; cy /= n; } else { cx = 0; cy = 0; }
  const pos = {};
  all.forEach((c, i) => {
    if (c.pos && fixedSet.has(c.id)) pos[c.id] = {x:c.pos.x, y:c.pos.y};
    else {
      const ang = i * 2.399963;
      const rad = 60 + 26 * Math.sqrt(i + 1);
      pos[c.id] = {x: cx + rad * Math.cos(ang), y: cy + rad * Math.sin(ang)};
    }
  });
  // Fruchterman-Reingold：K = 理想邊長（120 > 節點直徑 54，連線露得出來又不會太鬆）
  const K = 120;
  for (let it = 0; it < 220; it++){
    const disp = {};
    all.forEach(c => disp[c.id] = {x:0, y:0});
    for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++){
      const a = all[i], b = all[j];
      let dx = pos[a.id].x - pos[b.id].x, dy = pos[a.id].y - pos[b.id].y;
      let d2 = dx*dx + dy*dy;
      if (d2 < 1) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
      const d = Math.sqrt(d2);
      const f = K * K / d;
      disp[a.id].x += dx / d * f; disp[a.id].y += dy / d * f;
      disp[b.id].x -= dx / d * f; disp[b.id].y -= dy / d * f;
    }
    DB.relations.forEach(r => {
      const pa = pos[r.from], pb = pos[r.to];
      if (!pa || !pb) return;
      const dx = pa.x - pb.x, dy = pa.y - pb.y;
      const d = Math.max(1, Math.sqrt(dx*dx + dy*dy));
      const f = (d * d) / K;
      disp[r.from].x -= dx / d * f; disp[r.from].y -= dy / d * f;
      disp[r.to].x += dx / d * f; disp[r.to].y += dy / d * f;
    });
    all.forEach(c => {
      // 向心力 0.06：讓群集更聚攏，手機一屏能看到的節點更多（0.02 時整體攤太開）
      disp[c.id].x += (cx - pos[c.id].x) * 0.06;
      disp[c.id].y += (cy - pos[c.id].y) * 0.06;
    });
    const temp = 14 * (1 - it / 220) + 1;
    all.forEach(c => {
      if (fixedSet.has(c.id)) return;
      const d = Math.sqrt(disp[c.id].x**2 + disp[c.id].y**2) || 1;
      pos[c.id].x += disp[c.id].x / d * Math.min(d, temp);
      pos[c.id].y += disp[c.id].y / d * Math.min(d, temp);
    });
  }
  // 沒有任何關係的節點不受引力拘束，會被斥力推到極遠；收斂後直接安置到群體外圍環上
  const linked = new Set();
  DB.relations.forEach(r => { linked.add(r.from); linked.add(r.to); });
  const islands = all.filter(c => !linked.has(c.id) && !fixedSet.has(c.id));
  if (islands.length && islands.length < all.length){
    const core = all.filter(c => linked.has(c.id));
    let mx = 0, my = 0;
    core.forEach(c => { mx += pos[c.id].x; my += pos[c.id].y; });
    mx /= core.length; my /= core.length;
    let rad = 0;
    core.forEach(c => rad = Math.max(rad, Math.hypot(pos[c.id].x - mx, pos[c.id].y - my)));
    const ring = rad + 110;
    islands.forEach((c, i) => {
      const ang = (i / islands.length) * Math.PI * 2 + 0.6;
      pos[c.id] = {x: mx + ring * Math.cos(ang), y: my + ring * Math.sin(ang)};
    });
  }
  all.forEach(c => { if (!fixedSet.has(c.id)) c.pos = {x:Math.round(pos[c.id].x), y:Math.round(pos[c.id].y)}; });
}

function nodePos(c){ return TREE_REL[gMode] ? gIntroPos[c.id] : c.pos; }

function visibleCustomers(){
  let list = DB.customers;
  if (gFilterWarmth) list = list.filter(c => c.warmth === gFilterWarmth);
  if (gFilterTag) list = list.filter(c => (c.tags || []).includes(gFilterTag));
  if (TREE_REL[gMode]){
    const key = TREE_REL[gMode];
    const inTree = new Set();
    DB.relations.filter(r => r.type === key).forEach(r => { inTree.add(r.from); inTree.add(r.to); });
    // 組織圖：夥伴即使還沒建立上下線關係也要看得到（會直接掛在「我」底下）
    list = list.filter(c => inTree.has(c.id) || (gMode === "org" && isPartner(c)));
  }
  return list;
}
function focusSetOf(rels){
  if (!gFocus) return null;
  const set = new Set([gFocus]);
  for (let depth = 0; depth < gFocusDepth; depth++){
    const add = [];
    rels.forEach(r => {
      if (set.has(r.from) && !set.has(r.to)) add.push(r.to);
      if (set.has(r.to) && !set.has(r.from)) add.push(r.from);
    });
    add.forEach(id => set.add(id));
  }
  return set;
}
function layoutIntroTree(vis, rels){
  const ids = vis.map(c => c.id);
  const idSet = new Set(ids);
  const parent = {};
  rels.forEach(r => { if (parent[r.to] === undefined && r.from !== r.to) parent[r.to] = r.from; });
  const children = {};
  ids.forEach(id => children[id] = []);
  ids.forEach(id => { const pa = parent[id]; if (pa !== undefined && idSet.has(pa)) children[pa].push(id); });
  const roots = ids.filter(id => parent[id] === undefined || !idSet.has(parent[id]));
  const XS = 118, YS = 150;
  let cursor = 0;
  const pos = {};
  const seen = new Set();
  function place(id, depth){
    if (seen.has(id)) return;
    seen.add(id);
    const kids = children[id];
    if (!kids.length){ pos[id] = {x: cursor * XS, y: depth * YS}; cursor++; return; }
    kids.forEach(k => place(k, depth + 1));
    const xs = kids.filter(k => pos[k]).map(k => pos[k].x);
    pos[id] = {x: xs.length ? (Math.min(...xs) + Math.max(...xs)) / 2 : (cursor++) * XS, y: depth * YS};
  }
  roots.forEach(r => { place(r, 0); cursor++; });
  ids.forEach(id => { if (!pos[id]){ pos[id] = {x: cursor * XS, y: 0}; cursor++; } });
  gDepth = {};
  ids.forEach(id => { gDepth[id] = Math.round(pos[id].y / YS) + 1; });
  return pos;
}

function fitViewTo(list){
  const wrap = document.getElementById("graph-wrap");
  const W = wrap.clientWidth, H = wrap.clientHeight;
  if (!list.length || !W) return;
  const PAD = 16;
  // 文字字級隨縮放反向變動、縮放又取決於含文字的範圍——兩者互為因果，跑兩次逼近即收斂
  let sc = 0.6, bounds = null;
  for (let pass = 0; pass < 2; pass++){
    bounds = contentBounds(list, sc);
    const w = bounds.maxX - bounds.minX + PAD * 2 || 1;
    const h = bounds.maxY - bounds.minY + PAD * 2 || 1;
    sc = Math.min(1.4, Math.max(0.18, Math.min(W / w, H / h)));
  }
  gview.s = sc;
  gview.tx = W / 2 - (bounds.minX + bounds.maxX) / 2 * sc;
  gview.ty = H / 2 - (bounds.minY + bounds.maxY) / 2 * sc;
}
function centerOn(c){
  const wrap = document.getElementById("graph-wrap");
  const pt = nodePos(c);
  if (!pt) return;
  gview.tx = wrap.clientWidth / 2 - pt.x * gview.s;
  gview.ty = wrap.clientHeight / 2 - pt.y * gview.s;
}

function updateFocusBar(id){
  const bar = document.getElementById("focus-bar");
  const c = id ? getCustomer(id) : null;
  if (!c){ bar.style.display = "none"; bar.innerHTML = ""; return; }
  const dz = dormantInfo(id);
  bar.style.display = "flex";
  const orgTxt = isPartner(c) || uplineOf(id) || downlinesOf(id).length
    ? `第 ${generationOf(id)} 代・直屬 ${downlinesOf(id).length}・線上 ${orgSize(id)} 人`
    : (dz.days == null ? "從未互動" : "上次聯絡 " + dz.days + " 天前");
  bar.innerHTML = `<span style="font-weight:700;">${esc(c.name)}</span>
    <span class="chip warmth-${c.warmth}" style="margin:0;">${esc(warmthLabel(c.warmth))}</span>
    <span class="muted grow">${esc(orgTxt)}</span>
    <button class="btn small" id="fb-detail">詳情</button>
    <button class="btn small" id="fb-depth">${gFocusDepth === 1 ? "第二層" : "收回"}</button>
    <button class="btn small" id="fb-close">關閉</button>`;
  document.getElementById("fb-detail").onclick = () => openDetail(id);
  document.getElementById("fb-depth").onclick = () => { gFocusDepth = gFocusDepth === 1 ? 2 : 1; renderGraph(); };
  document.getElementById("fb-close").onclick = () => { gFocus = null; gFocusDepth = 1; renderGraph(); };
}

const HULL_PAD = 44;
/* 群組區塊：ids、外框範圍、群名。hull 繪製與自動縮放共用同一份計算 */
function groupBlocks(vis){
  if (gMode !== "net" || vis.length < 2) return [];
  const comps = componentsOf(vis);
  const singles = comps.filter(g => g.length === 1).map(g => g[0]);
  const blocks = comps.filter(g => g.length > 1).map(ids => ({ids, island:false}));
  if (singles.length) blocks.push({ids:singles, island:true});
  if (blocks.length < 2) return [];
  return blocks.map(b => {
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    b.ids.forEach(id => {
      const c = getCustomer(id); if (!c) return;
      const pt = nodePos(c); if (!pt) return;
      minX = Math.min(minX, pt.x); maxX = Math.max(maxX, pt.x);
      minY = Math.min(minY, pt.y); maxY = Math.max(maxY, pt.y);
    });
    if (minX > maxX) return null;
    let title;
    if (b.island) title = "未連結";
    else {
      const freq = {};
      b.ids.forEach(id => (getCustomer(id).tags || []).forEach(t => freq[t] = (freq[t] || 0) + 1));
      const top = Object.keys(freq).sort((x, y) => freq[y] - freq[x])[0];
      if (top && freq[top] >= Math.ceil(b.ids.length / 2)) title = top;
      else {
        const deg = {};
        b.ids.forEach(id => deg[id] = 0);
        DB.relations.forEach(r => { if (deg[r.from] !== undefined) deg[r.from]++; if (deg[r.to] !== undefined) deg[r.to]++; });
        const hub = b.ids.slice().sort((x, y) => deg[y] - deg[x])[0];
        title = getCustomer(hub).name + " 這群";
      }
    }
    return Object.assign({}, b, {
      x1:minX - HULL_PAD, y1:minY - HULL_PAD, x2:maxX + HULL_PAD, y2:maxY + HULL_PAD,
      label: title + "　" + b.ids.length + " 人",
    });
  }).filter(Boolean);
}

function groupHullsSVG(vis){
  const blocks = groupBlocks(vis);
  if (!blocks.length) return "";
  const hs = Math.min(80, 13 / Math.max(gview.s, 0.12));
  return blocks.map(b => {
    const dim = gFocus && !b.ids.includes(gFocus);
    return `<g class="ghull ${dim ? "dim" : ""}">
      <rect x="${b.x1}" y="${b.y1}" width="${b.x2 - b.x1}" height="${b.y2 - b.y1}"
        rx="${Math.round(HULL_PAD * 0.55)}" fill="var(--accent-soft)" fill-opacity="0.35"
        stroke="var(--line-strong)" stroke-width="1.5" stroke-dasharray="7 6"/>
      <text class="glabel" x="${b.x1 + 12}" y="${b.y1 - hs * 0.35}" font-size="${hs.toFixed(1)}">${esc(b.label)}</text>
    </g>`;
  }).join("");
}

/* 內容實際範圍：含節點姓名與群名文字所佔空間（文字字級隨縮放反向變動，故需指定 s） */
function orgSubLabel(c){
  if (c.subLabel) return c.subLabel;
  const dn = downlinesOf(c.id).length, sz = orgSize(c.id), os = orgSpend(c.id);
  const bits = [`直屬 ${dn}`];
  if (sz > dn) bits.push(`線上 ${sz}`);
  if (os) bits.push(money(os).replace("NT$ ", "$"));
  return bits.join("・");
}

function contentBounds(list, sc){
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  const add = (a, b, c, d) => {
    minX = Math.min(minX, a); minY = Math.min(minY, b);
    maxX = Math.max(maxX, c); maxY = Math.max(maxY, d);
  };
  const R = 27;
  const ns = Math.min(72, 12 / Math.max(sc, 0.12));
  list.forEach(c => {
    const pt = nodePos(c); if (!pt) return;
    let halfW = Math.max(R, c.name.length * ns * 0.55);
    if (gMode === "org"){
      // 組織圖的小字（直屬／線上／業績）比姓名長，不算進去最外側節點會被切掉
      halfW = Math.max(halfW, orgSubLabel(c).length * ns * 0.8 * 0.55);
    }
    add(pt.x - halfW, pt.y - R, pt.x + halfW, pt.y + R + ns * (gMode === "org" ? 2.9 : 1.3));
  });
  const hs = Math.min(80, 13 / Math.max(sc, 0.12));
  groupBlocks(list).forEach(b => {
    add(b.x1, b.y1 - hs * 1.4, Math.max(b.x2, b.x1 + 12 + b.label.length * hs * 0.9), b.y2);
  });
  return {minX, minY, maxX, maxY};
}

function renderGraph(){
  const svg = document.getElementById("graph-svg");
  const wrap = document.getElementById("graph-wrap");
  renderGraphChips();
  renderGraphLegend();
  const vis = visibleCustomers();
  if (gFocus && !vis.some(c => c.id === gFocus)){ gFocus = null; gFocusDepth = 1; }
  if (!vis.length){
    const msg = DB.customers.length
      ? (gMode === "org" ? "還沒有任何上下線關係。到客戶詳情按「加關係」建立上線。"
        : gMode === "intro" ? "還沒有任何「介紹人」關係。" : "沒有符合篩選的客戶。")
      : "還沒有客戶，先去「名單」新增。";
    svg.innerHTML = `<text x="50%" y="45%" text-anchor="middle" fill="#8a8a8a" font-size="14">${msg}</text>`;
    updateFocusBar(null);
    return;
  }
  const visSet = new Set(vis.map(c => c.id));
  let rels = DB.relations.filter(r => visSet.has(r.from) && visSet.has(r.to));
  let me = null;
  if (TREE_REL[gMode]){
    rels = rels.filter(r => r.type === TREE_REL[gMode]);
    if (gMode === "org" && vis.length){
      // 以使用者為重心：虛擬「我」節點當整棵組織樹的根，沒有上線的夥伴掛在我底下
      const hasUp = new Set(rels.map(r => r.to));
      const roots = vis.filter(c => !hasUp.has(c.id));
      const total = vis.reduce((t, c) => t + spentOf(c.id), 0);
      me = {id:"__me__", name:"我", subLabel:
        `直屬 ${roots.length}・線上 ${vis.length}` + (total ? "・" + money(total).replace("NT$ ", "$") : "")};
      rels = rels.concat(roots.map((c, i) => ({id:"__mer" + i, from:"__me__", to:c.id, type:"upline", createdAt:0})));
      gIntroPos = layoutIntroTree([me].concat(vis), rels);
    } else {
      gIntroPos = layoutIntroTree(vis, rels);
    }
  } else {
    ensurePositions();
  }
  const drawList = me ? [me].concat(vis) : vis;
  const byId = {};
  drawList.forEach(c => byId[c.id] = c);
  const fset = focusSetOf(rels);
  if (!gview.inited){ fitViewTo(drawList); gview.inited = true; }

  const R = 27;
  const defs = `<defs>
    ${DB.relationTypes.map(t => `<marker id="arrow-${esc(t.key)}" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="${t.color}"/></marker>`).join("")}
  </defs>`;

  const pkey = r => r.from < r.to ? r.from + "|" + r.to : r.to + "|" + r.from;
  const pairGroups = {};
  rels.forEach(r => { (pairGroups[pkey(r)] = pairGroups[pkey(r)] || []).push(r); });
  Object.values(pairGroups).forEach(g => g.sort((a, b) => a.id.localeCompare(b.id)));

  const edges = rels.map(r => {
    const a = byId[r.from], b = byId[r.to];
    if (!a || !b) return "";
    const pa = nodePos(a), pb = nodePos(b);
    const t = relType(r.type);
    const dx = pb.x - pa.x, dy = pb.y - pa.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    const x1 = pa.x + dx / d * R, y1 = pa.y + dy / d * R;
    const x2 = pb.x - dx / d * (R + (t.directed ? 6 : 0)), y2 = pb.y - dy / d * (R + (t.directed ? 6 : 0));
    const grp = pairGroups[pkey(r)];
    let off = (grp.indexOf(r) - (grp.length - 1) / 2) * 34;
    if (r.from > r.to) off = -off;
    const nx = -dy / d, ny = dx / d;
    const cx = (x1 + x2) / 2 + nx * off * 2, cy = (y1 + y2) / 2 + ny * off * 2;
    const dim = fset && !(fset.has(r.from) && fset.has(r.to));
    const ls = Math.min(60, 10.5 / Math.max(gview.s, 0.12));

    // 同一對人有多條關係時，標籤沿線錯開，不要全部疊在中點
    const nInPair = grp.length;
    const tPos = nInPair > 1
      ? 0.5 + (grp.indexOf(r) - (nInPair - 1) / 2) * 0.26
      : 0.5;
    const bez = t2 => {
      const u = 1 - t2;
      return {x: u*u*x1 + 2*u*t2*cx + t2*t2*x2, y: u*u*y1 + 2*u*t2*cy + t2*t2*y2};
    };
    const lp = bez(Math.min(0.82, Math.max(0.18, tPos)));
    // 標籤側移避開姓名：量用螢幕像素（否則縮放後幾乎沒挪到），方向一律往上
    // ——姓名固定畫在圓的下方，往上就必然是遠離姓名的那一側
    let sx = nx, sy = ny;
    if (sy > 0){ sx = -sx; sy = -sy; }
    const sidePx = off ? 0 : 15 / Math.max(gview.s, 0.12);
    const lx = lp.x + sx * sidePx, ly = lp.y + sy * sidePx;

    // 空間夠不夠要用「標籤實際寬度」判斷，不能只看線長門檻：
    // 舊版對多重關係開例外強制顯示，短邊上兩個標籤會互相壓、還蓋住姓名
    const labelPx = t.label.length * ls * gview.s * 0.62;   // 標籤螢幕寬度估算
    const edgePx = (d - R * 2) * gview.s;                    // 可見線段螢幕長度
    const room = edgePx > Math.max(40, labelPx * (nInPair > 1 ? 1.9 : 1.25));
    return `<g class="gedge ${dim ? "dim" : ""}">
      <path d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" fill="none"
        stroke="${t.color}" stroke-width="2.4" vector-effect="non-scaling-stroke"
        ${t.directed ? `marker-end="url(#arrow-${esc(t.key)})"` : ""}
        ${t.dash ? `stroke-dasharray="${esc(t.dash)}"` : ""}
        stroke-linecap="round" opacity="0.9"/>
      ${room ? `<text class="elabel" x="${lx}" y="${ly - (off ? 0 : 5)}" font-size="${ls.toFixed(1)}" fill="${t.color}">${esc(t.label)}</text>` : ""}
    </g>`;
  }).join("");

  const nodes = drawList.map(c => {
    const isMe = c.id === "__me__";
    const pt = nodePos(c);
    const wc = isMe ? "#252525" : warmthColor(WARMTH[c.warmth] ? c.warmth : "warm");
    const dim = fset && !fset.has(c.id);
    const sleep = !isMe && !dim && dormantInfo(c.id).dormant;
    const hit = !isMe && gFocus === c.id;
    // 姓名一律畫在圓下方（反向縮放，螢幕字級恆定），圓本身只當熟度色點，不再重複放字
    const ns = Math.min(72, 12 / Math.max(gview.s, 0.12));
    const partner = !isMe && isPartner(c);
    const subTxt = gMode === "org" ? orgSubLabel(c) : "";
    const sub = subTxt
      ? `<text class="slabel" y="${R + ns * 2.35}" font-size="${(ns * 0.78).toFixed(1)}">${esc(subTxt)}</text>`
      : "";
    return `<g class="gnode ${dim ? "dim" : ""} ${sleep ? "sleep" : ""} ${hit ? "hit" : ""}" ${isMe ? "" : `data-nid="${esc(c.id)}"`} transform="translate(${pt.x},${pt.y})">
      ${partner ? `<circle r="${R + 5}" fill="none" stroke="${partnerColor()}" stroke-width="2.5" opacity="0.9"/>` : ""}
      <circle r="${R}" fill="${wc}" stroke="#ffffff"/>
      <text class="nlabel" y="${R + ns * 0.95}" font-size="${ns.toFixed(1)}">${esc(c.name)}</text>
      ${sub}
    </g>`;
  }).join("");

  svg.innerHTML = defs + `<g id="gworld" transform="translate(${gview.tx},${gview.ty}) scale(${gview.s})">${groupHullsSVG(vis)}${edges}${nodes}</g>`;
  wrap.style.backgroundPosition = gview.tx + "px " + gview.ty + "px";
  const bs = 26 * gview.s;
  wrap.style.backgroundSize = bs + "px " + bs + "px";
  updateFocusBar(fset ? gFocus : null);
}

function applyGraphTransformOnly(){
  const g = document.getElementById("gworld");
  if (g) g.setAttribute("transform", `translate(${gview.tx},${gview.ty}) scale(${gview.s})`);
  const wrap = document.getElementById("graph-wrap");
  wrap.style.backgroundPosition = gview.tx + "px " + gview.ty + "px";
  const bs = 26 * gview.s;
  wrap.style.backgroundSize = bs + "px " + bs + "px";
}

/* 手勢：單指拖背景=平移、單指拖節點=移動節點（網絡模式）、雙指=縮放、
   輕點節點=聚焦、再點同一節點=開詳情 */
(function(){
  const wrap = document.getElementById("graph-wrap");
  const pointers = new Map();
  let mode = null;
  let dragNode = null;       // 網絡模式下被拖的節點
  let downNode = null;       // 按下時壓到的節點（供輕點判斷）
  let startPt = null, moved = false;
  let pinchStart = null;

  function toWorld(x, y){
    const r = wrap.getBoundingClientRect();
    return {x: (x - r.left - gview.tx) / gview.s, y: (y - r.top - gview.ty) / gview.s};
  }

  wrap.addEventListener("pointerdown", e => {
    if (e.target.closest("#focus-bar")) return;
    wrap.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pointers.size === 2){
      mode = "pinch";
      dragNode = null; downNode = null;
      const pts = [...pointers.values()];
      pinchStart = {
        d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y),
        mid: {x:(pts[0].x + pts[1].x)/2, y:(pts[0].y + pts[1].y)/2},
        s: gview.s, tx: gview.tx, ty: gview.ty,
      };
      return;
    }
    const nodeEl = e.target.closest(".gnode");
    moved = false;
    startPt = {x:e.clientX, y:e.clientY, tx:gview.tx, ty:gview.ty};
    downNode = nodeEl ? getCustomer(nodeEl.dataset.nid) : null;
    if (downNode && gMode === "net"){
      mode = "node";
      dragNode = downNode;
    } else {
      mode = "pan";
    }
  });

  wrap.addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (mode === "pinch" && pointers.size >= 2){
      const pts = [...pointers.values()];
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const mid = {x:(pts[0].x + pts[1].x)/2, y:(pts[0].y + pts[1].y)/2};
      const ns = Math.min(3, Math.max(0.15, pinchStart.s * d / (pinchStart.d || 1)));
      const r = wrap.getBoundingClientRect();
      const wx = (pinchStart.mid.x - r.left - pinchStart.tx) / pinchStart.s;
      const wy = (pinchStart.mid.y - r.top - pinchStart.ty) / pinchStart.s;
      gview.s = ns;
      gview.tx = mid.x - r.left - wx * ns;
      gview.ty = mid.y - r.top - wy * ns;
      applyGraphTransformOnly();
      return;
    }
    if (!startPt) return;
    const dx = e.clientX - startPt.x, dy = e.clientY - startPt.y;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    if (mode === "pan"){
      gview.tx = startPt.tx + dx; gview.ty = startPt.ty + dy;
      applyGraphTransformOnly();
    } else if (mode === "node" && dragNode && moved){
      const w = toWorld(e.clientX, e.clientY);
      dragNode.pos = {x:Math.round(w.x), y:Math.round(w.y)};
      renderGraph();
    }
  });

  function up(e){
    pointers.delete(e.pointerId);
    if (mode === "pinch"){
      if (pointers.size < 2){ mode = null; pinchStart = null; renderGraph(); }
      return;
    }
    if (!moved && downNode){
      if (gFocus === downNode.id) openDetail(downNode.id);
      else { gFocus = downNode.id; gFocusDepth = 1; centerOn(downNode); renderGraph(); }
    } else if (mode === "node" && dragNode && moved){
      save();
    }
    mode = null; dragNode = null; downNode = null; startPt = null;
  }
  wrap.addEventListener("pointerup", up);
  wrap.addEventListener("pointercancel", up);
})();

document.getElementById("graph-search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q){ gFocus = null; gFocusDepth = 1; renderGraph(); return; }
  const hit = visibleCustomers().find(c => (c.name + " " + c.company).toLowerCase().includes(q));
  if (hit){ gFocus = hit.id; gFocusDepth = 1; renderGraph(); centerOn(hit); applyGraphTransformOnly(); }
  else renderGraph();
});

function renderSettings(){
